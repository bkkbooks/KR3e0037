body:
  text: 鍼灸資生經卷三虚損腦虚冷腦衂風寒入腦久逺頭疼等疾宜灸𩕄會予年踰壮沍寒夜觀書每覺腦冷飲酒過量腦亦疼甚後因灸此穴而愈有兵士患鼻衂不已予敎令灸此穴即愈有人久患頭風亦令灸此穴即愈但銅人明堂經只云主鼻塞不聞香臭等疾而已故予書此以補其治療之闕然以腦户不宜鍼觀之𩕄會亦不宜鍼鍼經止云八歲以下不宜鍼恐未盡也凡飲食不消心腹膨脹靣色萎黄世謂之脾腎病者宜灸中腕諸葛亮夙興夜寐罰至二十皆親覽而所噉食不至數升司馬仲達知其将死既而亮卒仲達追之楊儀反旗鳴鼓若将拒焉仲達乃退不敢偪百姓為之諺曰死諸葛走生仲達仲達聞之曰吾便料生不便料死故也其曰料生葢料其事多而食不如前死之兆也食不如前仲達且知諸葛之且死今人飲食減少是胃氣将絶不可久生矣方且常食堅硬使愈難剋化服峻補藥使脾胃反熱愈不能食初不知灸中腕等穴以壮脾胃亦惑之甚也難經論四時皆以胃氣為本釋者日言三臟皆以胃氣為本胃者水榖之府人須仰胃氣為生也然則欲全生者宜灸胃腕久冷傷憊藏府洩利不止中風不省人事等疾宜灸神闕舊傳有人年老而顔如童子者葢每歲以鼠糞灸臍中一壮故也予嘗久患溏利一夕灸三七壮則次日不如厠連數夕灸則數日不如厠足見經言主洩利不止之驗也又予年踰壮覺左手足無力偶灸此而愈後見同官説中風人多灸此或百壮或三五百壮皆愈而經不言主中風何也藏氣虚憊真氣不足一切氣疾久不差者宜灸氣海銅人身有四海氣海血海照海髓海是也而氣海為第一氣海者元氣之海也人以元氣為本元氣不傷雖疾不害一傷元氣無疾而死矣宜頻灸此穴以壮元陽若必待疾作而後灸恐失之晚也府藏虛乏下元冷憊等疾宜灸丹田人有常言七七之數是旁太歲壓本命六十有一是太歲壓本命人值此年多有不能必者是固然矣然傳不云吉人吉其凶者乎常觀素問以六八之數為精髓竭之年是當節其欲矣千金云五十者一月一泄要之四十八便當依此千金載素女論六十者閉精勿泄是欲當絶矣宜節不知節宜絶不能絶坐此而喪生葢自取之豈歲之罪哉人無罪歲則雖有孽猶可違矣所謂吉其凶者如此雖不灸丹田可也丹田可灸七七壮或三五百壮陽氣虛憊失精絶子宜灸中極中極一名氣原葢氣之原也人之陽氣虛憊者可不灸此以實其氣耶按難經云丹田亦名大中極言丹田取人之身上下四旁最為中間也故名為極此亦曰中極其去丹田只一寸雖未若丹田之最中然不中不逺矣三里治胃寒心腹脹滿胃氣不足惡聞食臭腸鳴腹痛食不化銅秦承祖云諸病皆治華佗云療五勞羸瘦七傷虛乏胷中瘀血乳癰外臺明堂云人年三十以上若不灸三里令氣上衝目明下云眼暗千云主隂氣不足小腹堅熱病汗不出口苦壮熱身反折口噤腰痛不可顧胃氣不足久泄利食不化脇下注滿不能久立狂言狂歌妄笑恐怒大罵霍亂遺尿失氣陽厥悽悽惡寒云云凡此等疾皆刺灸之多至五百壮少至二三百壮小品云四支但去風邪不宜多灸七壮至七七壮止不得過隨年數故銅人於三里穴止云灸三壮鍼五分而已明堂上經乃云日灸七壮止百壮亦未為多也至千金方則云多至五百壮少至二三百壮何其多耶要之日灸七壮或艾炷甚小可至二七壮數日灸至七七壮止灸瘡既乾則又報灸之以合乎若要安丹田三里不曾乾之説可也必如千金之壮數恐犯小品之所戒也予舊有脚氣疾遇春則足稍腫夏中尤甚至冬腫漸消偶夏間依素問注所説穴之所在以温鍼微刺之翌日腫消其神效有如此者謬刺且爾况於灸乎有此疾者不可不知此不止治足腫諸疾皆治云涌泉治心痛不嗜食婦人無子男子如蠱女子如姙娠千作如阻五指端盡痛足不得履地宜針灸銅千云主忽忽喜忘身體腰脊如解大便難小便不利足中清至膝咽中痛不可内食瘖不能言衂不止云云千金於諸穴皆分主之獨於膏肓三里涌泉穴特云治雜病是三穴者無所不治也但明堂云若灸廢人行動爾既欲愈疾雖不行動數日未為害也脾俞治食多身瘦洩利體重四支不收腹痛不嗜食銅胃俞治胃寒腹脹不嗜食羸瘦銅人之言曰血氣未動者瘠甚而不害血氣既竭者雖肥而死矣則身之羸瘦若未足為人之害者殊不知人之羸瘦必其飲食不進者也飲食不進則無以生榮衞榮衞無以生則氣血因之以衰終於必亡而已故難經疏云人仰胃氣為主是人資胃氣以生矣五藏論云脾不磨食不消是脾不壮食無自而消矣既資胃氣以生又資脾以消食其可使脾胃一日不壮哉必欲脾胃之壮當灸脾胃俞等穴可也心中風狂走發癎語悲泣心胷悶亂欬唾血宜針心俞銅難經疏言心為藏府之主法不受病病則神去氣竭故手足為之清手足節冷名真心痛旦發夕死手足温者名厥心痛可急治也故千金言心中風者急灸心俞百壯服續命湯必泥心俞不可灸之説則無策矣但心俞雖可鍼若刺中心一日必死又豈易鍼耶必欲無此患平居當養其心使之和平憂愁思慮不使傷其神乃策之上必不免此亦當服鎮心丹等藥補助乃其次也腎俞治虚勞羸瘦腎虛水藏久冷小便濁出精隂中疼五勞七傷虚憊足寒如氷身腫如水銅難經疏云夾脊骨有二腎在左為腎在右為命門言命門者性命之根本也其穴與臍平凡灸腎俞者在平處立以杖子約量至臍又以此杖子當背脊骨上量之知是與臍平處也然後相去各寸半取其穴則是腎俞穴也更以手按其陷中而後灸之則不失穴所在矣凡灸以隨年為壮灸固有功亦在人滋養之如何爾人當愛護丹田吾既於既效方論之詳矣而妻妾之戕害葢未之及也君子偕老之序曰夫人淫亂失事君子之道故陳人君之德服飾之盛宜與君子偕老也宜偕老而不至偕老夫人之罪多矣故詩人以是刺之意可見也至於士夫志得意滿不期驕而驕至侍妾數十人少亦三五輩淫言䙝語不絶于耳不能自克而淫縱其欲者多矣為内子者恬不之怪人有問之者則曰自母言之則為賢母自我言之未免為妬婦人也人或以此多之其夫亦以為賢而不妬孰知其不妬乃所以為禍之歟雖然二南之化至於無妬忌而止今而言此豈求異於詩人耶是不然古人十日一御荀子彼其不妬者葢使媵妾得備十日一御之數爾不妬則同所以不妬則異吾故表而出之以為夫婦之戒固非求異於詩人也曲骨主失精五藏虚竭灸五十壮千明下云但是虛乏冷極皆宜灸骨髓冷疼灸上亷七十壮千難經疏八會曰府會中管治府之病藏會章門藏病治此筋會陽陵泉筋病治此髓會絶骨髓病治此血會鬲俞血病治此骨會大杼禁灸骨病治此脉會太淵脉病治此氣會亶中氣病治此然則骨髓有病當先大杼絶骨而後上亷可也膀胱三焦津液少大小腸寒熱見腰痛或三焦寒熱灸小腸俞五十壮千三焦膀胱腎中熱氣灸水道隨年千膏肓俞主無所不療羸瘦虛損夢中失精上氣欬逆發狂健忘等疾膏肓俞無所不療而古人不能求其穴是以晉景公有疾秦醫曰緩者視之曰在肓之上膏之下攻之不可達之不及藥不至焉不可為也晉侯以為良醫而孫真人乃笑其拙為不能尋其穴而灸之也若李子豫之赤龍丹又能治其膏肓上五音下之鬼無待於灸也是緩非特拙於不能灸亦無殺鬼藥矣其亦技止於此哉灸二十種骨蒸崔知悌序云骨蒸病者亦名傳尸亦謂殗殢亦稱復連亦曰無辜丈夫以精氣為根女人以血氣為本無問老少多染此疾予嘗三十日灸活十三人前後差者數踰二百非止單攻骨蒸又别療氣療風或瘴或勞或邪或癖病状既廣灸活者不可具録灸後宜服治勞地黄元良凡取四花穴以稻稈心量口縫如何闊斷其長多少以如此長裁紙四方當中剪小孔别用長稻稈踏脚下前取脚大指為止後取脚曲踿横文中為止斷了却環在結喉下垂向背後看稈止處即以前小孔紙當中安分為四花葢灸紙四角也又一醫傳一法先横量口吻取長短以所量草就背上三推骨下直量至草盡處兩頭用筆㸃了再量中指長短為準却将量中指草横直量兩頭用筆圈四角其圈者是穴不圈不是穴可灸七七壮止勞瘵傳尸骨蒸羸瘦中髎治丈夫五勞七傷六極腰痛大便難小便淋􅅹腹脹下利食洩銅三里治五勞羸瘦七傷虛乏明下云五勞虛乏四支羸瘦肩井治五勞七傷大椎治五勞七傷温瘧痎瘧氣疰背膊急頸項强明上下同風勞食氣肺俞治寒熱喘滿虛煩口乾傳尸骨蒸勞肺痿欬嗽明云療肉痛皮癢傳尸骨蒸肺嗽魄户治虛勞肺痿明云勞損痿黄五尸走疰項强明下云療勞損虚乏秦承祖云支正療五勞四支力弱虛乏等明下譩譆療勞損虚乏不得睡下焦俞療背痛身熱曲骨但是虛乏冷極皆灸氣海療冷病靣黑肌體羸瘦四支力弱小腹氣積聚賁豚腹弱脱陽欲死不知人五藏氣逆上攻膏肓俞治羸瘦虚損夢中失精無所不療銅腎俞治虛勞羸瘦耳聾腎虛水藏久冷明有腰痛心腹膨脹脅滿引小腹痛目視䀮䀮少氣溺血小便濁出精隂疼五勞七傷虛憊脚膝拘急明有好獨卧足寒如氷頭重身熱振慄腰中四支淫濼洞洩食不化身腫如水明下云療身寒熱食多身羸瘦靣黄黑目䀮䀮女久積冷氣成勞腦空治勞疾羸瘦體熱頸項强章門治傷飽身黄羸瘦漏谷治食不為肌膚下管治日漸羸瘦見痃癖下管見腹脹胃俞見虛損脾俞下亷見飱洩治羸瘦小兒羸瘦食飲少不生肌膚灸胃俞一壮明下灸勞法其状手足心熱多盗汗精神困頓骨節疼寒初發咳嗽漸吐膿血肌瘦靣黄減食少力令身正直用草子男左女右自脚中指尖量過脚心下向上至曲踿大紋處截斷却将此草自鼻尖量從頭正中須分開頭心髪貼肉量至脊以草盡處用墨㸃記别用草一條令病人自然合口量闊狹截斷却将此草於墨㸃上平摺兩頭盡處量穴灸時隨年多灸一壮如年三十灸三十一累効集效羸瘦固瘵疾自有寒熱等證宜隨證醫治若素來清癯者非有疾也惟病後瘦甚久不復常謂之形脱與夫平昔充肥忽爾羸瘦飲食減少者或有他疾乘之則難救療須辨之於早而著艾可也然仲景論六極必曰精極令人氣少無力漸漸内虛身無潤澤翕翕羸瘦眼無精光且云八味腎氣差六極而差五勞則是八味丸所當服仲景常服或常服去附子加五味子而腎俞等穴尤所當灸也脾俞大腸俞主腹中氣脹引脊痛食多身羸瘦名曰食晦先取脾俞後取季肋五藏六府心腹滿腰背痛飲食吐逆寒熱往來小便不利羸瘦少氣灸三焦俞隨年千腎虛腎俞治腎虚水藏久冷銅見勞明同中膂俞治腎虛消渴見竭陽蹻療腎氣明下亷療小腸氣不足靣無顔色灸小腸氣痃癖氣發時腹痛若刀刺不可忍者并婦女本藏氣血癖走疰刺痛或坐卧不得或大小便不通可思飲食於左右脚下下第二指第一節曲紋中心各灸十壮每壮如赤豆大甚驗集効連一云治寒病腎腸氣發牽外腎大痛腫硬如石治小腸氣方甚多未必皆效耆域方奪命散良方倉猝散皆已試之效者有一兵患小腸氣依此方灸足第二指下文五壮畧效而再發恐壮數未多也予以鎮靈丹十粒與之令早晩服五粒而愈灸固捷於藥若灸不得穴又不如藥相當者見效之速且灸且藥方為當爾近傳一立聖散用全乾蝎七枚縮砂仁三七枚炒茴香一錢為末分三服熱酒調下和滓空心服此疾是小腸受熱藴積不散久而成疾服此立效雖未試用以其説有理故附于此有士人年少覔灸夢遺為㸃腎俞痠疼其令灸而愈則不拘老少腎皆虛也古人云百病皆生于心又云百病皆生于腎心勞生百病人皆知之腎虛亦生百病人未知也葢天一生水地二生火腎水不上升則心火不下降兹病所由生也人不可不養心不愛護腎乎消渴消腎消中商丘主煩主渴千意舎主消渴身熱靣目黄明同承漿明下云飲水不休意舎關衝然谷主消渴嗜飲隱白主飲渴勞宮主苦渴食不下曲池主寒熱渴行間太衝主嗌乾善渴並千意舎見腹脹中膂俞治腎虚消渴汗不出明作汗出腰脊不得俛仰腹脹脇痛銅兊端治小便黄舌乾消渴然谷治舌縱煩滿消渴水溝治消渴飲水無度明同陽綱療消渴明下見腸鳴古方載渴病有三曰消渴曰消中曰消腎消腎最忌房事李祠部必云腎虚則消渴消中亦當忌也張仲景云宜服八味丸或服之不效者不去附子也有同舎患此人敎服去附子加五味子八味丸即效有同官患此予敎服千金枸杞湯效坡文載眉山張醫治楊頴臣渴病見坡麝香當門子酒漬作十丸取枳枸俗謂雞距子亦曰癩漢指頭作湯飲之愈張云消渴消中皆脾衰而腎敗土不能勝水腎液不上泝乃成此疾今診楊脾極巨脉熱而腎衰當由果實過度虛熱在脾故飲食兼人而多飲水水多故溺多非消渴也麝香能敗酒瓜果近輒不植屋外有枳枸木屋中釀酒不熟故以二物去酒果毒其論渴有理故載于此凡消渴經百日以上不得灸刺灸刺則於瘡上漏膿水不歇遂致癰疽羸瘦而死亦忌有所誤傷初得患者可如方刺灸若灸諸隂而不愈宜灸諸陽詳見千金有數十穴隂痿縮兩丸騫隂谷主隂痿小腹急引隂内亷痛千大赫然谷主精溢上縮太衝主兩丸騫縮腹堅不得卧甲云臍環痛隂騫兩丸縮石門主小腹堅痛下引隂中不得小便兩丸騫隂交主腹䐜堅痛引隂中不得小便兩丸騫隂縮灸中封大赫見失精中封主痿厥見疝曲泉主不尿隂痿氣衝治隂痿莖痛千同兩丸騫痛不可忍銅五樞見疝歸來治卵縮見隂痛筋攣隂縮入腹相引痛灸中封五十壮或不滿五十壮老少加減又云此二穴喉腫厥逆五藏所苦鼓脹並主之隂挺出大敦主隂挺出少府主隂挺長千並見疝上髎千見絶子治婦人隂挺出不禁銅隂蹻照海見淋水泉見月事曲泉見瘕癖千同治婦人隂挺出隂蹻見淋􅅹療隂挺出明轉胞涌泉主胞轉千見淋關元主婦人胞轉不得尿見無子又主胞閉塞銅云治胞轉不得尿腰痛小便不利苦胞轉灸中極七壮小兒同又灸十五椎或臍下一寸或四寸隨年凡飽食訖忍小便或走馬或忍小便入房或大走皆致胞轉臍下急滿不通方見千金凡尿不在胞囊中為胞屈僻津液不通葱葉除尖頭内隂莖孔中深三寸微用口吹胞脹津通愈隂莖疼曲泉見疝行閒主癃閉莖中痛千氣衝主隂痿莖痛烈缺見失精隂陵泉少府主隂痛歸來主賁豚卵上入引莖痛歸來治小腹賁豚卵縮莖痛銅横骨治隂器縱伸痛見淋水道治小腹滿引隂痛見小腹滿氣衝治莖痛見隂痿㑹隂治隂中諸病前後相引痛不得大小便隂端寒衝心大敦治隂頭痛見疝腎俞見勞志室見隂腫隂谷見溺難太衝見小便不利治隂痛千金翼云七傷為病小便赤熱乍數時難或時傷多或如鍼刺隂下常濕隂痿消小精清而少連連獨洩隂端寒冷莖中疼痛云云當早服藥著艾莖中痛灸行間三十壮膀胱氣章門療膀胱氣癖疝瘕氣膀胱氣痛状如雷聲積聚氣明岐伯灸膀胱氣攻衝兩脇時臍下鳴隂卵入腹灸臍下六寸兩旁各寸六分三七壮五樞療膀胱氣攻兩脇下膀胱冷灸之如腎虛法千膀胱三焦津液少大小腸寒熱見腰痛或三焦寒熱灸小腸俞五十壮三焦膀胱腎中熱氣灸水道隨年壮水道治小腹滿引隂中痛腰背急膀胱有寒三焦結熱小便不利千金云氣衝主㿗明堂云氣衝療㿉疝是㿉疝即㿗也必用云治水㿗偏大上下不定疼不可忍俗呼為膀胱氣是膀胱氣即㿗疝也然太倉公診命婦云疝氣客于膀胱難于前後溲而溺赤又不可便認膀胱氣為疝氣云隂汗濕癢會陽治陽氣虚乏隂汗濕銅魚際見寒熱療隂汗明千云主隂濕腹中餘疾中極隂蹻腰尻交隂交曲泉主隂癢千會隂主隂頭寒少府主隂癢見疝仲景論七傷曰一隂汗二精寒三精清四精少五囊下濕癢六小便數七夜夢隂人然則隂汗隂濕癢者葢七傷之數也可不早治之乎有人作文字則氣濕亦心氣使然心腎相為表裏故也千金翼敘虛損云疾之所起生自五勞即生六極詳見寒熱復生七傷一隂寒二隂痿三裏急四精連連不絶五精少囊濕六精清七小便數其病小便赤熱或如鍼刺隂痿小隂下常濕精清而少云云論與仲景少異故載之於此隂腫隂瘡曲泉見無子隂蹻見漏下大敦氣衝見疝主隂腫千志室胞肓療隂痛下腫明崑崙在外踝後跟骨上治隂腫銅明下云内崑崙在内踝後五分筋骨間療小兒隂腫灸三壮曲泉治隂腫䯒痛見風勞氣衝治婦人隂腫見月事又療隂腫明下見疝膀胱俞治隂生瘡見便赤有人隂腫醫以赤土塗之令服八味丸而愈一小兒隂腫醫亦以赤土塗之愈今人用寫字油柱木用若久病而隂腫病已不可救宜速灸水分穴蓋水分能分水榖水榖不分故隂腫不特隂腫他處亦腫也尤宜急服禹餘糧丸云見既效方小腹痛隂蹻療小腹偏痛嘔逆嗜卧明中極療小腹痛積聚堅如石小便不利失精絶子靣䵟下腎俞復溜中封承筋隂包承山大敦主小腹痛千石門商丘主小腹堅痛下引隂中石門水分主小腹拘急痛涌泉主風入腹中小腹痛臍中等主小腹疝氣痛見疝大谿主小腹熱而偏痛肝俞是欬逆小腸俞見便赤蠡溝照海見疝下亷見飱洩丘墟見腋腫中都見腸鳴治小腹痛銅太衝治腰引小腹痛帶脉治婦人小腹堅痛月脉不調帶下赤白裏急瘈瘲五樞主小腹痛見疝曲泉主女子小腹腫無子婦人隂痛引心下小腹綅痛灸膝外邊上去一寸宛宛中千翼小腹脹滿大巨治小腹脹滿煩渴㿉疝偏枯四支不舉銅曲骨治小腹脹滿小便淋澁不通㿉疝小腹痛然谷治