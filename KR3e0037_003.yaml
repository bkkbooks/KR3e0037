便難一卒傷寒大小便不通予與五苓散而皆通五苓固利小便矣而大便亦通者津液生故也或小便通而大便尚不通宜用蜜九道之必用方婦人老人大便祕用麻子蘇子煮粥食最佳小便不禁遺尿附承漿主小便不禁見便黄關元又主婦人小便數泄不止涌泉主小便數少府主隂暴痛遺尿千關門中府甲作委中神門主遺尿隂陵泉陽陵泉主失禁遺尿不自知太衝主女遺尿見疝關門治遺溺善滿銅箕門見淋通里見傷寒千同大敦見疝膀胱俞見便赤太衝見小便不利委中見腰脊神門治遺溺見心煩隂包治遺溺不禁見腰痛遺溺灸陽陵泉或足陽明各隨年千遺溺失禁出不自知灸隂陵泉隨年小便失禁灸大敦或行間七壮尿床灸臍下横文七壮婦人遺尿灸横骨七壮小兒遺尿灸臍下寸半隨年又灸大敦三壮餘見千金曲泉隂谷隂陵泉復溜此諸穴斷小便利大佳不損陽氣亦云止遺尿大便不禁餘見泄瀉大腸俞次窌主大小便利陽綱主大便不節明同腸鳴泄注小便赤黄承扶主尻中腫大便直出隂胞有寒小便不利屈骨端主大便泄數小便不利并灸天樞丹田主泄利不禁小便絞痛關元療洩痢虛脹小便難明䰟門治大便不節銅老小大便失禁灸兩足大指去甲一寸三壮又灸大指岐間各三壮千三里主霍亂遺失大便不禁病亦惙矣神闕石門丹田屈骨端等皆是穴處宜速灸之予頃患脾泄醫謂有積以冷藥利之大便不禁服鎮靈丹十餘丸午夜各數丸而愈今人服此丹三五丸不效則不服是以一勺水救輿薪火也可乎哉泄瀉餘見吐瀉曲泉治泄利四支不舉銅見疝腹結治腹寒泄利見臍痛神闕治泄利不止小兒妳利不絶腹大繞臍痛氣穴治婦人泄利不止見月事陽綱治大便泄利意舎治大便滑泄並見腹脹梁門治大腸滑泄榖不化見積氣關門治泄利不欲食見積氣天樞治泄利食不化三焦俞治水榖不化欲泄注見腹脹懸樞治水榖不化下利見積聚脊中治温病積聚下利中髎治腹脹下利食泄脾俞治泄利見腹脹膀胱俞治泄利腹痛大腸俞腎俞治洞洩食不化見勞瘵會陽治腹中冷氣洩利不止京門治小腹急腫腸鳴洞洩髎樞引痛三間治腹滿腸鳴洞洩然谷治兒洞洩見口噤關元療腹洩不止明下見賁豚京門然谷隂陵泉主洞泄不化千腎俞章門主寒中洞泄不化京門崑崙主洞泄體痛長强主頭重洞泄明下云洞洩不禁隂陵泉隱白主胷中熱暴泄大腸俞主腸鳴腹䐜腫暴洩三焦俞小腸俞下窌意舎章門主腸鳴腹脹欲泄注會陽主腹中有寒泄注腸澼便血束骨主腸澼泄天樞主冬月重感於寒則泄當臍痛腸胃間遊氣切痛若心腹痛而後泄此寒氣客於腸間云云灸關元百壮服當歸縮砂湯指泄瀉宜先灸臍中次灸關元等穴飱泄中窌主腹脹飱泄下亷治小腹痛飱洩次指間痛脣乾涎出不覺不得汗出毛髪焦脱肉少氣胃中熱不嗜食上亷見脇痛治飱洩隂陵泉主婦人飱泄見疝瘕素問言春傷於風夏必飱泄茍知傷於風而得之則藥自可治雖不著艾未為害也本事方云飱泄者食榖不化也春時木旺肝生風邪淫於脾經至夏引冷當風故多飱泄宜芎藭丸芎藭神麯白术附子等分細末糊圓梧子大每服三五十丸米飲下治脾濕而泄者萬無不中其用芎除濕有理故載于此溏泄三隂交治溏洩食不化銅見腹脹地機見水腫治溏洩地機主溏瘕腹痛藏痹千太衝等主溏泄見痢予嘗患痹疼既愈而溏利者久之因灸臍中遂不登溷連三日灸之三夕不登溷若灸溏泄臍中第一三隂交等穴乃其次也本事方云一親每五更初必溏痢一次者數月有人云此名腎泄腎感隂氣而然服五味子散愈五味子二兩呉茱萸半兩細粒緑色者並炒香熟為末每服二錢陳米飲下其論溏利有理故附載之予舊患溏利每天曉必如厠人敎贖豆附丸服即愈其方不可得也他年再患此只用薑煎附子加豆蔲服愈痢餘見瀉素問言泄痢有五種一曰胃泄飲食不化而色黄胃與脾合故黄也二曰脾泄腹脹而注泄無休又上逆嘔此為寒熱之患也三曰大腸泄食畢腸鳴切痛而痢白色大腸與肺合故白也四曰小腸泄身瘦而便膿血小腸與心合心主血也五曰大瘕泄裏急後重數至圊不能便莖中痛此腎泄也諸家方有二十餘種此唯言五種葢舉其綱也必用方亦有赤白疳蠱之别其大槩則藏府寒也廪丘公所謂諸下悉寒是也數予治人痢惟與以鎮靈丹無有不效或未效更加丸數則效矣若蠱利則用栢葉黄連煎服見既效諸痢惟耆域方用厚朴櫻粟殻末最佳後人又加木香黄連陳皮等分甘草拌之黄榖葉數片姜棗烏梅水煎予嘗用之驗故載于此然痢本無惡證而有患此而死者或者世醫以痢為熱病多服冷藥故也若其急難亦當灼艾不可專用藥云復溜主腸澼便膿血泄痢後重腹痛如痓状千交信主泄痢赤白銅同漏血太衝曲泉主溏泄痢注下血小腸俞主泄痢膿血五色重下腫痛丹田主泄痢不禁小便絞痛關元大谿主泄痢不止脾俞主泄痢不食食不生肌五樞主婦人赤白裏急瘈瘲曲泉治泄水下利膿血銅見風勞中膂俞治腸冷赤白痢明同膀胱俞療泄痢腹痛明脊俞療温病積聚下痢銅作下利關元療洩痢見便不禁小兒痢下赤白秋末脱肛每厠腹痛不可忍灸十二椎下節間名接脊穴一壮黄帝療小兒疳痢脱肛體瘦渴飲形容瘦悴諸藥不差灸尾翠骨上三寸骨陷間三壮岐伯云三伏内用桃水浴孩子午正時當日灸之用青帛拭似見疳蟲隨汗出神效小兒伏深冷痢不止灸臍下二寸三寸間動脉中三壮婦人水洩痢灸氣海百壮泄痢食不消不作肌膚灸脾俞隨年壮千泄注五利便膿重下腹痛灸小腸俞百壮泄痢不禁小腹絞痛灸石門百壮三報久痢百治不差灸足陽門下一寸高骨上陷中去大指岐三寸隨年又臍中二三百壮又關元三百十日灸赤白下灸窮骨多為佳四支不舉多汗洞痢灸大横隨年餘見千金痢暴下如水云云氣海百壮指便血餘見痢腸風復溜太衝等並見痢會陽見瀉主便血千下亷幽門明同太白見吐瀉治洩利膿血銅太白治吐洩膿血見腹脹小腸俞治大便膿血出明同下髎治大便下血腹哀治大便膿血見腹痛千又云寒中食不化腹痛勞宮見傷寒治大小便血陸氏續集驗方治下血不止量臍心與脊骨平於脊骨上灸七壮即止如再發即再灸七壮永除根本目覩數人有效予嘗用此灸人腸風皆除根本神效無比然亦須按其骨突處痠疼方灸之不疼則不灸也但便血本因於腸風腸風即腸痔不可分而為三或分為三而治之非也痔瘻漏餘見瘍瘻長强治腸風下血五種痔疳蝕下部􅉶此痔根本是冷謹冷食房勞銅與明同明下云療久痔會隂治榖道瘙擾久痔相通者死千云主痔與隂相通者死會陽治久痔小腸俞治五痔疼明同秩邊治五痔發腫復溜治血痔洩後腫飛揚治野雞痔承山治久痔腫痛扶承治久痔尻脽腫大便難隂胞有寒小便不利千云療五種痔瀉鮮血尻脽中腫大便難小便不利氣海俞療痔病瀉血明飛揚主痔篡傷痛商丘復溜主痔血泄後重勞宮主熱痔承筋承扶委中陽谷主痔痛掖下腫商丘主痔骨蝕銅云痔疾骨疽蝕支溝章門主馬刀腫瘻絶骨主瘻馬刀掖腫俠谿陽輔銅同太衝主掖下腫馬刀瘻銅云太衝臨泣治馬刀瘍瘻天突章門天池支溝王漏天突天牕主漏頸痛長强療下漏明見痔一千用亭厯子豉作餅灸漏外臺云不可灸頭瘡亭厯氣入腦殺人灸痔法疾若未深尾閭骨下近榖道灸一穴便可除去如傳信方先以經年槐枝煎湯洗後灸其上七壮大稱其驗如本草只以馬藍菜根一握水三碗煎碗半乘熱以小口瓦器中熏洗令腫退於元生鼠妳根上灸即不可灸尖頭恐效遲如患深用湯洗未退易湯洗令消然後灸覺火氣通至胷乃效病雖深至二十餘壮永絶根本以竹片䕶四邊肉仍於天色寒凉時灸忌毒物集效千金灸漏更有數穴腸風脊端窮骨脊骨盡處名龜尾當中灸三壮治腸風瀉血即愈須顛倒身方灸得久冷五痔便血脊中百壮千翼何敎授湯簿有此疾積年皆一灸除根湯簿因傳此法後觀灸經此穴療小兒脱肛瀉血葢岐伯灸小兒法也後人因之以灸大人腸風瀉血爾葢大人小兒之病初不異故也五痔便血失屎廻氣百壮在脊窮骨上赤白下長强治腸風下血銅見痔腸風藥甚衆多不作效何也本草衍義曰腸風乃腸痔茍知其為痔而治之無不效矣若灸腸風長强為要穴云近李倉腸風市醫以杖量臍中於脊骨當臍處灸即愈予因此為人灸腸風皆除根陸氏方治下血除根腸澼復溜見痢束骨會陽見瀉主腸澼千中都治腸澼㿉疝小腹痛銅四滿治腸澼切痛見積聚結積留飲澼囊胷滿飲食不消灸通谷五十壮千大腸俞主風腹中雷鳴大腸灌沸腸澼洩痢食不消化小腹絞痛腰脊疼强大小便難不能飲食灸百壮三報之諸結積留飲澼囊胷滿飲食不消通谷五十壮又胃管三百三報之第十五椎名下極俞主腹中疾腰痛膀胱寒澼飲注下隨年壮千翼會陽主腹中有寒泄注腸澼便血束骨主腸澼泄膺牕主腸鳴泄注陽綱主大便不節小便赤黄腸鳴泄注三焦俞小腸俞下窌意舎章門主腸鳴腹脹欲泄注千腸痛餘見腸澼太白主腸痛甲見腸鳴陷谷等主腸痛千見腸鳴商曲治腸切痛銅見積聚建里療腸中疼嘔逆上氣心痛身腫明氣衝治腸中之熱銅見上氣腸痛亦多端若疼甚者乃腸癰急宜服内補十全散等藥其他宜隨證灸之有老嫗大腸中常若裏急後重甚苦之自言人必無老新婦此竒疾也為按其大腸俞疼甚令歸灸之而愈腸癰為病小腸重小便數似淋或繞臍生瘡或膿從臍出大便出膿血屈兩肘正灸肘頭鋭骨各百壮則下膿血止差胡權内補十全散治腸癰神效腸鳴腹鳴不容治腹虚鳴銅見痃癖三間主胷滿腸鳴千胃俞主腹滿而鳴明下云腹中鳴臍中主腸中常鳴上衝於心天樞主腹脹腸鳴氣上衝胷又主婦人隂都主心滿氣逆腸鳴太白公孫大腸俞三焦俞等見瀉主腸鳴隂交主腸鳴濯濯有如水聲上亷主腸鳴相追逐漏谷主腸鳴强欠心悲氣逆膺牕主腸鳴泄注陷谷温溜漏谷復溜陽綱主腸鳴而痛下窌主婦人腸鳴注泄胷脇脹腸鳴切痛太白主之甲三里見胃三間京門見瀉關門見積氣三隂交見腹脹陷谷一水分神闕並見水腫承滿温溜三焦俞大腸俞胃俞腹脹天樞月事治腸鳴銅章門治腸鳴盈盈然千同食不化脅痛不得卧煩熱口乾不嗜食胷脇支滿喘息心痛腰下經有背脅痛不得轉側上亷治腸鳴氣走疰痛商丘治腹脹腸鳴不便脾虚令人不樂身寒善太息心悲氣逆復溜治腹雷鳴見鼓漲腎俞療腹痛雷鳴明見腹痛承滿療腸鳴腹脹上喘氣逆下陽綱療食飲不下腹中雷鳴腹滿䐜脹大便洩消渴身熱靣目黄不嗜食怠惰下千云主腸鳴見大便不禁三焦俞療腹脹腸鳴腸中雷鳴相逐痢下灸承滿五十壮千天樞主腹脹腸鳴氣上衝胷不能久立腹痛濯濯冬日重感於寒則泄見泄瀉食不化嗜食身腫夾臍急腹中雷鳴灸太衝無限壮數千見上氣脱肛百會療脱肛明下云療大人小兒脱肛銅云治小兒脱肛久不差岐伯療小兒脱肛瀉血秋深不較灸龜尾一壮脊端窮骨也黄帝灸小兒疳痢脱肛小兒痢下脱肛並見痢小兒脱肛灸頂上旋毛中三壮即入千或尾翠骨三壮或臍中隨年寒冷脱肛灸翠骨七壮立愈神效臍中隨年千翼横骨百壮或龜尾七壮窮骨人有小女患痢脱肛予傳得一方用草茶葉一握薑七片令煎服而愈然不知其方所自來也後閲坡文始知生薑㕮咀煎茶乃東坡治文潞公痢之方也故附於此霍亂轉筋筋緩急餘見手足攣凡霍亂頭痛胷滿呼吸喘鳴窮窘不得息人迎主之千巨闕明云療霍亂不識人關衝支溝公孫隂陵泉主霍亂太隂大都