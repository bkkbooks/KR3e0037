痺温溜治傷寒噦逆噫噦鬲中氣閉寒灸腋下聚毛下附肋宛宛中五十壮千噫噦嘔逆灸石關百壮傷寒嘔噦諸噦巨闕主傷寒煩心喜嘔千甲云王心腹脹噫煩熱善嘔鬲中不利間使主熱病煩心喜噦胷中澹澹温溜主傷寒寒熱頭痛噦衂百會主汗出而嘔痙商丘主寒熱好嘔大椎主傷寒熱盛煩嘔腎俞主頭身熱赤欲嘔並千勞宮主熱病煩滿欲嘔噦甲曲澤主傷寒逆氣嘔唾千必用方論噦者俗云克逆也鍼灸者當以此求之若氣自腹中起上築咽喉逆氣連屬不能出或至數十聲上下不得喘息此由寒傷胃腕腎氣先虚逆氣上乘於胃與氣相倂不止者難治謂之噦宜茱萸丸灸中腕關元百壮未止灸腎俞百壮指唾中府治欬唾濁涕銅見肺氣庫房治多唾濁沫膿血周榮治欬唾稠膿並見胷脅滿少商治腹滿唾沫見瘧百會見癎治唾沫石關治多唾嘔沫明下庫房治肺寒欬嗽唾膿見逆氣幽門見同治嘔沫吐涏喜唾銅石關治脊强不開多唾日月治多唾見愁悲天井治心胷痛欬𠻳上氣吐膿不嗜食紫宮治吐血及唾如白膠明曲澤主傷寒逆氣嘔唾千名醫賈祐録云積主藏病聚主府病積者是飲食包結不消聚者是伏痰結而不化痰伏在上鬲主頭目眩痛多自涎唾或致潮熱用平胃散烏金散治之其論有理故載之胃痛寒熱魚際療胃氣逆明分水治胃脹不調見腹痛銅云胃虛脹不嗜食鬲俞治胃腕暴痛銅見嘔吐下管治腹胃不調腹痛明見腹堅腎俞主胃寒脹千見食多胃俞治胃中寒銅見腹脹水分治胃虛脹見水腫三里治胃中寒心腹脹滿胃氣不足惡聞食臭腸鳴腹痛食不化明下同下廉見飱洩懸鍾治胃熱不嗜食心俞療胃中弱食不下明下太淵千見心痛療胃氣上逆唾血治胃補胃胃俞百壮胃寒不能食食多身瘦腸鳴腹滿胃脹胃熱三里三十壮反胃食即吐上氣灸兩乳下各一寸以差為期又臍上一寸二十壮又内踝下三指稍斜向前穴三壮外臺云一指千翼反胃凡食飲不化入腹還出先取下管後取三里瀉之章門主食飲不化入腹還出見不嗜食中庭中府主鬲寒食不下嘔吐還出又主嘔逆吐食不得出中庭療胷脇支滿心下滿銅明同下食不下嘔逆吐食還出三里療胃氣不足反胃胃俞見不能食療吐食意舎療吐食不留住下見背痛吐逆食不住胃管百壮千吐嘔逆不得下食今日食明日吐灸鬲俞百壮有人久患反胃予與鎮靈丹服更令服七氣湯遂能立食若加以著艾尤為佳也有老婦人患反胃飲食至晚即吐出見其氣繞臍而轉予為㸃水分氣海并夾臍邊兩穴他歸只灸水分氣海即愈神效食不下不化魂門治飲食不下腹中雷鳴銅三焦俞治吐逆飲食不下見腹脹胃倉意舎見腹脹鬲關治食飲不下見背痛胃俞主嘔吐筋攣食不下千大腸俞周榮主食不下喜飲中庭中府主鬲寒食不下見反胃陽綱期門少商勞宮主飲食不下三焦俞主傷寒頭痛食不下心俞治胃弱食飲不下明下鬲俞治鬲寒食飲不下腹脇滿胃弱食少嗜卧怠惰不欲動身温不能食千云主吐食見嘔陽綱治食不下腹中雷鳴大小便下節黄水明紫宮見煩心中庭見反胃膽俞見嘔治飲食不下三里見胃大腸俞三隂交並見腹脹下腕見腹痛三焦俞懸樞見瀉梁門見積氣治榖不化天樞見瀉志室見脊痛腎俞見勞治食不化腹哀治寒中食不化三焦俞治水榖不消腹脹腰痛吐逆明腹哀銅同太白見瀉主食不化千凡食飲不化入腹還出先取下管後取三里瀉之石門主不欲食榖入不化天樞厲兊内庭主食不化不嗜食夾臍痛章門主食飲不化見不嗜食上管中管主寒中傷飽食飲不化中庭治胷脇滿食不下見反胃胃管三焦俞主小腹積聚堅大如盤胃脹食不消千志室明見腹痛療食不下太白公孫見腹脹主食不化中府胃倉承滿見腹脹魚際見腹痛周榮見胸滿治食不下中管腹脹三隂交見腹脹治食不化不能食然谷治腦痛不能食銅見痰豐隆主不能食中極主飢不能食胃俞主嘔吐筋攣食不下不能食維道主三焦有水氣不能食鬲俞主傷寒嗜卧怠惰不欲動身濕不能食銅同石門主不欲食榖入不化率谷主醉酒風熱發不能飲食嘔吐甲少商療不能食腹中氣滿喫食無味明分水見腹痛療不能食胃俞療煩滿吐食腹脹不能食下云療胃中寒氣不能食胷脇滿身瘦不能食胷滿鬲上逆氣悶熱灸大腸俞二七壮小兒減之千三里療腹滿不能食胃氣不足反胃明不能飲食見腸澼藏府積聚及飲食不消見寒熱涌泉主心痛不嗜食咽中痛不可内食見虚勞脾俞胃俞治不嗜食不嗜食凡不嗜食刺然谷多見血使人立飢千隱白見吐然谷脾俞内庭主不嗜食天樞厲兊内庭主食不化不嗜食夾臍急中封主身黄有微熱不嗜食章門主食飲不化入腹還出熱中不嗜食苦吞而聞食臭傷飽身黄酸疼羸瘦肺俞治上氣嘔吐支滿不嗜食銅胃俞脾俞治腹痛不嗜食見腹脹地機隂陵泉水分並見水腫幽門見胷痛小腸俞見脚氣治不嗜食下腕治六府氣寒不嗜食見腹痛下廉見飱洩懸鍾治胃熱不嗜食見膝摩隂蹻療病飢不欲食明懸鍾療腹滿中焦客熱不嗜食明下又云心腹脹滿胃熱不嗜食陽綱見腸鳴療不嗜食分水治胃虚脹不嗜食銅不嗜食有數端有三焦客熱不嗜食有胃熱不嗜食有胃寒不嗜食有六府氣寒不嗜食固當隨證用藥治之而針灸者亦當知補瀉之法可也史記陽虚侯病甚衆醫皆以為蹙太倉公診脉以為痺根在右脇下大如覆杯令人喘逆氣不能食病得之内即以火齊粥且飲六日氣下即令更服圓藥出入六日病已然則人之不能食亦有患痺而得者槩曰胃有寒熱則不可也扁鵲曰凡人心風灸心俞肝俞主心風腹脹滿食不消化四支羸露不欲食見中風曲泉主不嗜食見無子食氣無味三里治食氣惡聞食臭見胃大杼見勞治食氣百會見風癎少商見不能食療喫食無味明凡身重不得食食無味心下虚滿時時欲下喜卧皆針胃管太倉服建中湯及平胃丸有鑚胃丸温中開胃病人覻飲食不得三五服即思食破故紙半兩肉荳蔲四枚為末蒸棗肉丸梧子大空心米飲三十丸食多脾俞治食飲多身瘦銅見腹脹腎俞療食多身瘦明下見勞胃俞腎俞主胃中寒脹食多身瘦脾俞大腸俞主食多身瘦見腹脹舎姪偶食罷即飢再食又飢自碎生薑濃泡二碗服愈瘧脾寒千金云夫瘧皆生於風夏傷於暑秋為㾬痎同瘧素問云㾬猶老也亦瘦也楊上善云二日一發為㾬瘧其説與素問千金異瘧有數名先寒後熱曰寒瘧先熱後寒曰温瘧熱而不寒曰癉瘧多寒曰牡瘧久不差曰勞瘧久不斷曰老瘧時行後變成瘧曰瘴瘧病結為癥瘕曰瘧母以至肝肺脾腎心胃亦皆有瘧或每日發或間日發或作稍益晏或作日益早素問千金等方論之詳矣治瘧之方甚多惟小金丹為最佳予嘗以予人皆效然人豈得皆有此藥哉此灸之所以不可廢也鄉居人用旱蓮草椎碎寘在手掌上一夫四指間也當兩筋中以古文鐃壓之繫之以故帛未久即起小泡謂之天灸尚能愈瘧况於灸乎故詳著之譩譆治温瘧寒瘧明下云療瘧久不愈腰俞中管治温瘧痎瘧鬲俞見痰命門見頭疼太溪見欬逆療痎瘧隂蹻治暴瘧上亷治寒瘧三間治瘧寒熱脣口乾身熱喘目急痛至隂治瘧發寒熱頭重煩心下液門合谷陷谷天池治寒熱㾬瘧偏厯治發寒熱瘧久不愈目視䀮䀮大椎治㾬瘧久不愈少府治痎瘧久不愈者煩滿少氣悲恐畏人臂酸掌熱手握不伸陶道治痎瘧寒熱洒浙命門治寒熱痎瘧腰腹相引痛足臨泣治瘧日西發千同銅云治瘧日發療小兒瘧久不愈灸足大指次指外間陷中各一壮並下太谿見心痛照海中渚治久瘧丘墟治久瘧振寒千同陷谷治瘧中封治痎瘧色蒼蒼千云太息振寒小腹腫食怏怏繞臍痛足逆冷不嗜食身體不仁液門治痎瘧寒熱目眩頭痛暴得耳聾腕骨治痎瘧頭痛煩悶商陽治寒熱痎瘧口乾明下云治瘧口乾譩譆見肩背痛中腕白環俞治温瘧見腰脊上髎偏厯治寒熱瘧三間治寒瘧脣焦口乾氣喘脾俞治痎瘧寒熱有人患久瘧諸藥不效或敎之以灸脾俞即愈更一人亦久患瘧聞之亦灸此穴而愈蓋瘧多因飲食得之故灸脾俞作效内庭厲兊靣腫公孫治寒瘧不嗜食京骨治瘧寒熱喜驚不欲食明下同神門治瘧心煩甚欲得飲冷惡寒則欲處温中咽乾不嗜食合谷陽谿後谿陽池隂都治身寒熱瘧明下云㾬瘧病心下煩滿氣逆天樞治寒瘧列缺治寒瘧嘔沫善笑縱脣口明下云㾬瘧靣色不定少商治痎瘥振寒腹滿明下有煩心善噦唾沫脣乾引飲不下膨膨手攣指痛寒慄鼓頷喉鳴經渠治瘧寒熱胷背拘急胷滿膨膨明同大椎腰俞治温瘧痎瘧明同大杼療瘧頸項强不可俛仰頭痛振寒前谷風池神道見頭痛百會治痎瘧上星治痎瘧振寒熱汗不出偏厯主風瘧汗不出千少澤明云頭痛銅云寒熱復溜崑崙主瘧寒汗不出衝陽主瘧先寒洗淅甚久而熱熱去汗出然谷崑崙主瘧多汗甲云主瘧多汗腰痛不可俛仰目如脱項如㧞列缺後谿少澤前谷主瘧寒熱太泉太谿經渠主瘧欬逆心悶不得卧寒熱大陵腕骨陽谷少衝主乍寒乍熱瘧天樞主瘧振寒熱盛狂言太鍾主瘧多寒少熱甲云瘧悶嘔甚熱多寒少欲閉户而處寒厥足熱商丘主寒瘧腹痛少海主瘧背振寒甲云項痛引肘掖腰痛少腹四支不舉陽谿主瘧甚苦寒欬嘔沫厲兊内庭主瘧不嗜食惡寒少商主瘧振慄鼓頷商丘神庭上星百會完骨風池神道掖門前谷光明至隂大杼主痎瘧熱隂都少海商陽三閒中渚主瘧身熱列缺主瘧甚熱陽谷主瘧脇痛不得息俠谿主瘧足痛衝陽束骨主瘧從脚胻起陽谷主瘧脇痛不得息飛揚主狂瘧頭眩痛痙反折温溜主瘧靣赤腫天井主瘧食時發心痛悲傷不樂天府主瘧病譩譆支正小海主風瘧三里陷谷俠谿飛揚主痎瘧少氣大附子一枚炮末薑兩半取自然汁丸如小豆大每十五丸空心熱酒吞下老少加減川客治瘧只二三服皆愈云兼治脾胃愈於薑附湯故附此脾疼餘見心腹痛府舎治疝癖脾中急痛循脅上下搶心腹滿積聚厥氣兩乳銅商丘治脾虚令人不樂見腸鳴千見吐三隂交治脾病身重見腹脹予嘗久患脾疼服治脾藥反膨脹不得已依耆域方用麵裹火炮蓬莪茂末水與酒醋煎服立愈已而告人人亦云高良薑末米飲調服亦作效後鄭敎授傳一方云草果延胡索苓脂并没藥酒調三兩錢一似手拈却草果子五苓脂四味等分為末此亦平穩藥也有此疾者宜服之或不吐不瀉心中疼甚日輕夜甚者用乾鹽梅并茶煎服神效若灸者宜上管中管下管脾俞三隂交等穴鍼灸資生經卷三
