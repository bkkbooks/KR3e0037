body:
  text: 針灸資生經卷二針灸須藥千金云病有須針者即針刺以補瀉之不宜針者直爾灸之然灸之大法其孔穴與針無忌即下白針或溫針訖乃灸之此為良醫其腳氣一病最宜針若針而不灸灸而不針非良醫也針灸而藥藥不針灸亦非良醫也但恨下里間知針者鮮爾所以學者須解用針燔針白針皆須妙解知針知藥固是良醫此言針灸與藥之相須也今人或但知針而不灸灸而不針或惟用藥而不知針灸者皆犯孫真人所戒也而世所謂醫者則但知有藥而已針灸則未嘗過而問焉人或詰之則曰是外科也業貴精不貴雜也否則曰富貴之家未必肯針灸也皆自文其過爾吾故詳著千金之説以示人云針忌千金云夫用針者先明其孔穴補虛瀉實而失其理針毛皮腠理勿傷肌肉針肌肉勿傷筋脈針筋脈勿傷骨髓針骨髓勿傷諸絡傷筋膜者愕視失魂傷血脈者煩亂失神傷皮毛者上氣失魄傷骨髓者呻吟失志傷肌肉者四支不收失智此為五亂因針所生若更失度有死之憂也素問亦云刺骨無傷筋刺筋無傷肉刺肉無傷脈刺脈無傷皮刺皮無傷肉刺肉無傷筋刺筋無傷骨刺中心一日死中肝五日死中腎六日死中肺三日死中脾十日死中膽一日半死刺跗上中大脈血出不止死刺頭中腦户入腦立死又無刺大醉大怒大勞大飢大渴大驚新飽云云詳見素問孔穴相去甲乙經云自大椎下至尾􅦡骨二十一椎長三尺折量取俞穴或云第一椎上更有大椎在宛宛陷中非有骨也有骨處即是第一椎若以大椎至尾骶二十一椎長三尺法校之則上節云椎每傾一寸四分惟第七椎下至於膂骨多分之七故上七節共九寸八分分之七下節十四椎每椎一寸四分分之五有竒故下七節共二尺一分分之三此亦是一説也但第一椎有骨乃骨節之收大椎雖無骨實是穴名既曰自大椎下至十一椎豈可不量大椎以下或者之説於是不通矣自蔽骨下至臍八寸而中管居其中上下各四十氣穴論注云中管居心蔽骨與臍之中是也按明堂下經云鳩尾在臆前蔽骨下五分人無蔽骨者從岐骨際下行一寸則是欲定中管之中又當詳有蔽骨無蔽骨也當準人長短肥瘠量自臍下寸半為氣海三寸為丹田至屈骨凡五寸千金云屈骨在臍下五寸明堂下經亦云屈骨在橫骨上中極下一寸當準人長短肥瘠量之銅人云幽門夾巨闕旁各五分肓俞夾臍各五分明堂云在巨闕旁各寸半通谷夾上管旁相去三寸不容在幽門旁各寸半天樞去肓俞寸半夾臍期門在不容旁寸半大橫直臍旁不容天樞期門既各寸半則幽門育俞各五分誤矣銅人云腎俞在十四椎下兩旁各寸半與臍平肓門在十三椎下相去各三寸與鳩尾相直腎俞既與臍平肓門乃與鳩尾相直亦可疑也甲乙經云人有長七尺五寸者髮以下至頤一尺結喉至􅐳骭鳩尾也一尺三寸􅐳骭至天樞八寸天樞至橫骨六寸半橫骨至內輔上廉一尺八寸內輔上廉至下亷三寸半內輔下廉至內踝一尺三寸內踝至地三寸又膝膕至跗屬一尺六寸跗屬至地三寸又肩至肘一尺七寸肘至腕一尺二寸半腕至中指本節四寸本節至末四寸半定髮際明堂上經云如後髮際亦有項腳長者其毛直至骨頭亦有無項腳者毛齊至天牖穴即無毛根如何取穴答曰其毛不可輒定大約如此若的的定中府正相當即是側相去各二寸此為定穴下云兩眉中直上三寸為髮際後大椎直上三寸為髮際論同身寸下經曰岐伯以八分為一寸緣人有長短肥瘠不同取穴不凖扁鵲以手中指第一節為一寸緣人有身長手短身短手長取穴亦不準孫真人取大拇指節橫文為一寸亦有差互今取男左女右手中指第二節內庭兩橫文相去為一寸若屈指即旁取指則中節上下兩文角角相去逺近為一寸謂同身寸自依此寸法與人著灸療病多愈今以為準銅人亦曰取中指內文為一寸素問云同身寸是也又多用繩度量繩多出縮不準今以薄竹片點量分寸療病凖的亦有用蠟紙條量者但薄篾易折蠟紙亦粘手難取稻稈心量却易為勝於用繩之信縮也審方書經云爪甲與爪甲角內與外間內側與外側與夫陷中宛宛中要精審如某穴去某處幾寸與其穴去處同者自各有經絡灸膏肓云其間當有四肋三間灸中間者謂四肋必有三間當中間灸不灸邊兩間也千金曰經云橫三間寸者則是三灸兩間一寸有三灸灸有三分三壯之處即為一寸也又曰凡量一夫之法覆手并舒四指對度四指上下節橫過為一夫夫有兩種有三指為一夫者若灸腳弱以四指為一夫也見腳氣穴名同異手有三里五里足亦有三里五里手有上廉下亷足亦有上亷下亷側頭部有竅隂足少陽亦有竅隂偃伏部有臨泣足少陽亦有臨泣既有五里矣勞宮亦名五里既有光明矣攢竹亦名光明肩有肩井又有所謂中肩井足有崑崙又有所謂下崑崙太淵太泉之名或殊天鼎天頂之字有異丹田初非石門和窖明堂上經誤作和字亦非禾髎陽蹻實為申䏞本非附陽隂蹻實為照海本非交信有髃之名扁骨見於外臺懸鍾之名絶骨童子髎之名前關見於千金注如此者衆可不審處而針灸耶茍不審處則差之毫釐有尋丈之謬矣於是舉其略以示世醫俾之謹於求穴云點穴千金云人有老少體有長短膚有肥瘦皆須精思商量準而折之又以肌肉文理節解縫會宛陷之中及以手按之病者快然如此子細安詳用心者乃能得之耳許希亦云或身短而手長或手長而身短或胸腹短或胸腹長或瘠或肥又不可以一槩論也千金云凡點灸法皆須平直四體無使傾側灸時恐穴不正徒破好肉爾明堂云須得身體平直四支無令拳縮坐點無令俯仰立點無令傾側若坐點則坐灸卧點則卧灸立點則立灸反此則不得其穴千金云凡灸當先陽後隂言從頭向左而漸下次後從頭向右而漸下先上後下明堂下云先灸於上後灸於下先灸於少後灸於多皆宜審之論壯數多千金云凡言壯數者若丁壯病根深篤可倍於方數老少羸弱可減半又云小兒七日以上周年以還不過七壯炷如雀屎扁鵲灸法有至五百壯千壯曹氏灸法有百壯有五十壯小品諸方亦然惟明堂本經多云針入六分灸三壯更無餘論故後人不準惟以病之輕重而增損之凡灸頭頂止於七壯積至七七壯止銅人若治風則灸上星前頂百會皆至二百壯腹背宜灸五百壯若鳩尾巨闕亦不宜多四支但去風邪不宜多灸灸多則四支細而無力明上而千金於足三里穴乃云多至三二百壯心俞禁灸若中風則急灸至百壯皆視其病之輕重而用之不可泥一説而又不知其有一説也下經只云若是禁穴明堂亦許灸一壯至三壯恐未盡也千金云凡官遊吳蜀體上常須三兩處灸之切令瘡暫差則瘴癘溫瘧毒氣不能著人故吳蜀多行灸法有阿是之法言人有病即令揑其上若裏當其處不問孔穴即得便快成痛處即云阿是灸刺皆驗故曰阿是穴艾炷大小千金云黃帝曰灸不三分是謂徒寃炷務大也小弱乃小作之又云小兒七日以上周年以還不過七壯炷如雀糞明堂下經云凡灸欲艾炷根下廣三分若不三分即火氣不能逺達病未能愈則是艾炷欲其大惟頭與四支欲小爾至明堂上經乃云艾炷依小竹筯頭作其病脈粗細狀如細線但令當脈灸之雀糞大炷亦能愈疾又有一途如腹內疝瘕痃癖塊伏梁氣等惟須大艾炷故小品曰腹背爛燒四支則但去風邪而已如巨闕鳩尾雖是胸腹穴灸之不過四七炷祇依竹筯頭大但令正當脈灸之艾炷若大復灸多其人永無心力如頭上灸多令人失精神臂腳灸多令人血脈枯渴四支細而無力既失精神又加於細即令人短夀見承漿穴此論甚當故備著之點艾火下經云古來灸病忌松柏枳橘榆棗桑竹八木切宜避之有火珠曜日以艾承之得火次有火鏡耀日亦以艾引得火此火皆良諸蕃部落用鑌鐵擊瑎石得火出以艾引之凡人卒難備即不如無木火清麻油點燈燈上燒艾莖點灸是也兼滋潤灸瘡至愈不疼痛用蠟燭更佳良方云凡取火者宜敲石取火今舟行人以鐵鈍刀擊石穴以紙灰為火丸在下承之亦得火或水精鏡於日得太陽火為妙天隂則以槐木取火治灸瘡下經云凡著艾得瘡發所患即差不得瘡發其疾不愈甲乙經云灸瘡不發者用故履底灸令熱尉之三日即發今用赤皮蔥三五莖去青於煻火中煨熟拍破熱尉瘡十餘遍其瘡三日自發豫見人灸不發者頻用生麻油清之而發亦有用皂角煎湯候冷頻點之而發亦有恐氣血衰不發於灸前後煎四物湯服以此湯滋養氣血故也蓋不可一槩論也豫嘗灸三里各七壯數日過不發再各灸兩壯右足發左足不發更灸左足一壯遂發兩月亦在人以知取之若任其自然則終不發矣此人事所以當盡也凡著灸住火便用赤皮蔥薄荷煎湯溫洗瘡周回約一二尺令驅逐風氣於瘡口出兼令經脈往來不滯自然瘡壞疾愈今人亦有恐水殺人不用湯淋若灸瘡退火痂後用東南桃枝青嫩柳皮煎湯溫洗能護瘡中諸風若瘡內黑爛加胡荽煎若瘡疼不可忍多時不效加黃連煎神效凡貼灸瘡春用栁絮夏用竹膜秋用新綿冬用兔腹上白細毛貓兒腹毛更佳今人多以膏藥貼之日三兩易全不疼但以膏藥貼則易乾爾若要膿出多而疾除不貼膏藥尤佳忌食物既灸忌豬魚熱麵生酒動風冷物雞肉最毒而房勞尤當忌也下經云灸時不得傷飽大飢飲酒食生硬物兼忌思慮憂愁恚怒呼罵呼嗟歎息等今下里人灸後亦忌飲水將水濯手足避人神等千金云欲行針灸先知行年宜忌及人神所在不與禁忌相應即可故男忌除女忌破男忌戊女忌已有日神忌有每月忌有十二時忌有四季人神有十二部人神有十二部年人神有九部旁通人神有雜忌旁通又有所謂血支血忌之類凡醫者不能知此避忌若逢病人厄會男女氣怯下手至困通人達士豈拘此哉若遇急卒暴患不拘此法許希亦云若人病卒暴宜急療亦不拘此故後之醫者亦云卒暴之疾須速灸療一日之間止忌一時是也千金云癰疽丁腫喉痺客忤尤為急凡作湯藥不可避凶日覺病須臾即宜便治又曰凡人卒暴得風或中時氣凡百所苦須急救療漸久後皆難愈此論甚當夫急難之際命在須臾必待吉日後治已淪於鬼録矣此所以不可拘避忌也惟平居治病於未形選天德月德等日服藥針灸可也相天時千金云日正午以後乃可灸謂隂氣未至灸無不著午前平旦榖氣虛令人癲眩不可針灸卒急者不用此例下經云灸時若遇隂霧大風雪猛雨炎暑雷電虹霓暫停候晴明即再灸急難亦不拘此針灸資生經卷二
