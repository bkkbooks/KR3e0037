body:
  text: 鍼灸資生經卷七傷寒熱病隂證陽證凡熱病刺陷谷足先寒寒上至膝乃出鍼身痹洗淅振寒悸脇支滿痛熱病先腰脛酸喜渇數飲身清清則項痛而寒且酸足熱不欲言頭痛癲癲然先取涌泉及太陽井滎熱中少氣厥寒灸之熱去灸涌泉三壯煩心不嗜食灸涌泉熱去四逆喘氣偏風身汗出而清皆取俠谿凡温病身熱五日以上汗不出刺太泉留鍼一時取鍼若未滿五日者禁鍼凡好太息不嗜食多寒熱汗出病至則喜嘔嘔已乃衰即取公孫及井俞實則腸中切痛厥頭面腫起煩心狂多飲不嗜卧虛則鼓脹腹中氣大滿熱痛不嗜食霍亂公孫主之凡熱病煩心足寒清多汗先取然谷後取太谿大指間動脉皆先補之凡温病可鍼刺五十九穴又身之穴六百五十有五其三十六穴灸之有害七十九穴刺之爲災江南諸師秘仲景要方不傳顳顬穴鍼灸治温病見黄疸指迷方灸隂毒傷寒法其狀不躁不渇唇青腰背重咽喉及目睛痛心腹煩疼舌縮面青吃噫氣嘔逆冷汗向暗不語以生葱約十餘莖去根麄皮顚倒紙卷徑闊二寸勿令𦂳欲通氣以快刀切毎一餅子髙半寸安在臍心用熨斗火熨葱軟易之不過十餘次患人即甦後服正氣藥灸結胷傷寒法其狀胸滿短氣按之卽痛或吐逆滿悶或大便不通諸藥不能救者巴豆七粒和皮肥黄連七寸去鬚同搗爛作一圓安在臍心上以手按下稍實𦂳捻艾皂子大於藥上灸甚者不過三五壯立愈續用補藥一二日若病半月㣲有氣皆療治氣虛陽脫體冷無脉氣息欲絶不省人事及傷寒隂厥百藥不効葱熨法以索纒如盞許大切去根及葉惟存白長二寸許如大餅餤先以火脅一面令通熱艾勿令灼人及以熱處搭病人臍連臍下其上以熨斗滿貯火熨之令葱餅中熱氣熨入肌肉中須預作三四餅一餅壞不可熨又易一餅良久病人當漸醒手足温有汗則差更服四逆湯軰温其内萬萬無憂予伯兄病傷寒㝠㝠不知人八日四體堅冷如石藥不可復入用此遂差集賢校理胡全夫用此拯人之危不可勝數良初得病或先頭痛身寒熱或濇濇欲守火或腰背强直面目如飲酒狀此傷寒初得一二日但列火灸心下三處第一處去心下一寸名巨闕第二處去心下二寸名上管第三處去心下三寸名胃管各灸五十壯大人可五十壯小兒可三壯亦隨其年灸之大小以意斟量千若病者三四日以上宜先灸胷上二十壯以繩度鼻正上盡髪際中屈繩斷去半便從髪際入髪中灸繩頭名曰天聰又灸兩顳顬又灸兩風池又灸肝俞百壯餘處各二十壯又灸太衝三十壯神驗凡治傷寒惟隂證可灸餘皆當鍼故千金方惟云刺取而素問亦云病甚者爲五十九刺所以瀉諸陽胷中胃中四支五藏之熱也見熱論篇若温病身熱五日以上汗不出可刺太泉未滿五日禁鍼爾千金而千金於頭痛身寒熱病乃灸巨闕上中管三處豈亦是隂證耶其狀蓋云或濇濇欲守火者也醫者當辨之通里治熱病卒心中懊憹數欠頻伸悲恐目眩頭痛面赤而熱心悸肘臂臑痛實則支腫虛則不能言若嘔喉痹少氣遺溺銅期門治婦人傷寒過經不解當鍼期門使經不傳中管療天行傷寒明曲澤療傷寒病温濕身熱口乾鬲俞主傷寒嗜卧怠惰不欲動摇身常濕不能食千少衝治熱病煩滿上氣心痛痰冷少氣悲恐善明作喜驚掌熱胷痛口熱咽酸乍寒乍熱手攣不伸引眼痛銅曲池治傷寒餘疾皮膚乾燥通里主熱病先不樂數日千魚際陽谷主熱病振慄鼓頷腹滿隂痿色不變尺澤主氣隔喜嘔鼓頷不得汗腎俞主頭身熱赤振慄腰中四支滛濼欲嘔三閒主氣熱身熱喘甲云寒熱口乾身熱喘息目急痛善驚魚際治熱病寒慄鼓頷腹滿隂痿色不變中衝少衝關衝勞宫太陵陽谿天窌主熱病煩心心悶汗不出掌中熱心痛身熱如火舌本痛閒使主熱病煩心喜噦胷中澹澹喜動而熱巨闕主煩心喜嘔曲澤主傷寒温病身熱煩心口乾支正少海主熱病先腰脛酸喜渇數飲食身熱項强痛天井主振寒頸項痛委中主熱病夾脊痛風門治傷寒頸項强目瞑明有鼻塞字多啑鼻􅍠出清涕銅隂毒沉困藥餌難爲功但灸臍中三百壯艾如半棗手足不暖不可治也見本事方或心迷耳聾呌不應因食冷得疾者予以理中湯救數人矣若復渇則煎五苓散與服或煎人參湯服皆效千金云傷寒多從風寒得之始表中風寒入裏則不消矣未有温覆而不消也黄疸脾俞胃管太谿主黄疸千然谷主黄疸一足寒一足熱喜渇太衝主黄疸熱中喜渇中封五里主身黄時有微熱甲乙云不嗜食少氣身體重脊中主黄疸腹滿不能食脾俞主黄疸喜欠不下食脇下滿欲吐身重不欲動勞宫主黄疸目黄中管太陵主目黄振寒脾俞治黄疸銅見腹脹脾俞療腰身黄脹滿腹吐洩痢身重四支不収黄疸邪氣積聚腹痛寒熱明章門療身黄羸瘦明下見鼓脹寅門穴治馬黄黄疸上齗裏穴鍼三鋥治馬黄黄疸上腭穴鍼三鋥治馬黄黄疸四時等病舌下穴俠舌兩邊鍼治黄疸唇裏穴鍼三鋥治馬黄黄疸寒暑温疫顳顬穴鍼灸治四時寒暑所苦疸氣温病俠人中穴火鍼治馬黄黄疸疫通身並黄語音已不轉者俠承漿穴治馬黄急疫巨闕七壯治馬黄黄疸急疫等病上管灸七壯治馬黄黄疸男隂縫穴㧞隂反向上灸治馬黄黄疸風府鍼之治頭中百病馬黄黄疸熱府鍼灸治馬黄黄疸肺俞灸主黄疸通治百毒心俞肝俞脾俞腎俞脚後跟鍼灸治馬黄黄疸寒暑諸毒耳中穴灸治馬黄黄疸寒暑疫毒頰裏穴鍼主治馬黄黄疸寒暑温疫頰兩邊同法手太陽灸隨年壯治黄疸䑀石子頭穴灸七壯治馬黄黄疸錢孔穴灸百壯治黄疸太衝穴鍼灸治馬黄温疫五苓散治疸病發渇立效瘀熱在裏身黄腫煎茵陳下服此不效方可鍼灸傷寒頭痛其餘見頭痛温溜主傷寒寒熱頭痛噦衂肩不舉千懸顱主熱病頭痛身熱懸釐鳩尾主熱病偏頭痛引目外眥少澤主振寒小指不用頭痛神道關元主身熱頭痛進退往來三焦俞主頭痛食不下太白主熱病先頭重顏痛煩悶心身熱熱争則腰痛不可俛仰又熱病滿悶不得卧身重骨痛不相知温溜治傷寒身熱頭痛噦逆肩不得舉銅風池治頭痛魚際掖門中渚通理主頭痛千天池療頭痛此見寒熱支正等主頭眩痛見傷寒寒熱頭痛顚顚然先取涌泉云云見傷寒魚際療頭痛汗不出見寒熱治傷寒頭痛藥多矣惟濃煎五苓散服必效不必鍼灸予屢施與人皆效故也傷寒寒熱餘見自汗傷寒無汗支正少海主熱病先腰脛酸喜渇身熱項强振寒寒熱甲云主振寒寒熱頸項腫實則肘攣頭眩痛虛則生疣痂千曲澤主傷寒温病身熱煩心口乾甲云主心澹善驚身熱煩心口乾手清逆氣嘔唾肘瘈善摇頭顏清汗出不過眉三閒主氣熱身熱喘甲云寒熱口乾身熱喘息口急痛善驚肩貞主寒熱項適歴甲云耳鳴無聞引缺盆肩中熱痛麻木不舉温溜主傷寒寒熱頭痛商丘主寒熱好嘔大椎主傷寒熱盛煩嘔膈俞中府主寒熱皮肉骨痛少氣不得卧支滿肩井關衝主寒熱悽索氣上不得卧列缺主寒熱掌中熱曲池主傷寒餘熱不盡天井主傷寒振寒頸項痛衝陽主振寒而欠後谿主身熱惡寒寒熱又見傷寒寒熱中風寒熱復溜治骨寒熱汗注不止銅至陽治寒熱解散淫濼脛酸四支重痛少氣難言明同光明治身解寒淫濼䯒痠不能乆立瘂門治寒熱風痙脊强反折銅陶道神堂見肩痛風池治洒淅寒熱隂郄治洒淅畏寒厥逆魚際治洒淅惡風寒虛熱舌黄身熱頭痛欬𠻳汗不出痹走􅎍背痛不得息浮白治發寒熱腎俞治頭重身熱見勞瘵顱𩕄治身熱頭重脇痛不得轉側太白陽綱治身熱並見腹脹曲差治身體煩熱腦空治勞疾羸瘦體熱肺俞治寒熱喘滿見勞瘵天池治寒熱胷膈滿見膈滿少衝治乍寒乍熱見傷寒神道見頭痛少海治寒熱膽俞治振寒見頭痛臨泣治洒淅振寒見腋腫魚際治虛熱洒洒毛䜿惡風寒舌上黄身熱欬𠻳喘痺走胷背不得息頭痛甚汗不出熱煩心少氣不足明膈俞療寒熱骨痛見痰天突見頸腫療身寒熱下腦空療身寒熱引項强急飛揚光明主寒熱千見傷寒無汗藏府積聚心腹滿腰背痛飲食不消吐逆寒熱往來小便不利羸瘦少氣三焦俞隨年壯又見勞又胃管百壯至千壯佳小腸俞主三焦寒熱如灸腎法隨年又膀胱三焦津液下大小腸寒熱赤洩洞痢腰脊痛又小便不利婦人𢃄下五十壯四支寒熱腰疼不得俯仰身黄腹滿食嘔舌根直灸脾俞大椎三穴各七壯盗汗寒熱惡寒肺俞隨年壯鍼五分又隂都百壯多汗寒熱玉枕五十千翼涌泉主身體腰脊如解見虛損腹寒熱氣冷氣又見勞行閒主腹痛而熱千中極主腹中熱並見腹痛五藏熱及身體熱脉弦急着灸第十四椎與臍相當五十壯老小增損之若虛寒至百壯横三間寸灸之氣衝主身熱腹痛凡腹中熱喜渇涎出是蛔也手持之勿令得移以鍼刺中管亦不可容易鍼氣衝主腹中大熱不安見腹脹關元主寒氣入腹乆冷灸天樞百壯見癥瘕隂陵泉見水腫三隂交見痃痺治腹寒隱白療腹中寒熱明見腹脹下廉療熱風冷痹上關等主寒熱千見瘈瘲癲飛揚等治寒熱銅各見癲疾瘂門等治寒熱見瘈瘲少衝治乍寒乍熱見傷寒岐伯云但是積冷虛乏病皆宜灸關元三里療藏府乆積冷氣心腹脹滿天樞療乆積冷氣繞臍切痛時上衝心銅同中極療冷氣見積聚漏谷見痃癖㑹陽治冷氣銅見泄瀉下管治六府氣寒不嗜食氣海治冷氣上衝心隱白主腹中寒冷氣脹滿千太衝主上氣冷發腹中雷鳴見上氣結氣寒冷灸太倉百壯見結氣凡臍下絞痛流入隂中發作無時此冷氣灸關元百壯商丘主心下寒見腹滿鳩尾少衝商丘主心寒冷氣上灸龍頷百壯並心痛陽交主寒厥驚狂衝門治腹寒氣滿銅見積聚千金翼云五勞六極復生七傷變生七氣積聚堅牢如杯留在腹内心痛煩寃不能飲食時來時去發作無常寒氣爲病則吐逆心滿熱氣爲病則恍惚悶亂長如眩冒又復失精云云宜服局方七氣湯若冷氣忽作藥灸不及止用火鍼㣲刺諸穴與疼處須臾即定神效身寒痹濕痹不仁又見手足痹不仁膈俞明同治身常濕銅見痃癖豐隆主身濕千曲池列缺主身濕摇時時寒中封主痿厥身體不仁少氣濕重合陽主膝股重漏谷主乆濕痺不能行銅云不能乆立懸鍾主濕痺不腫髀筋急瘈脛痛絶骨主髀樞痛膝脛骨摇酸痺不仁筋縮諸節酸折臨泣主身痺洗淅振寒商丘主骨痺煩滿凡身體不仁先取京骨後取中封絶骨皆瀉之中封主痿厥身體不仁少氣濕重膝腫風市主緩縱痿痺腨腸疼冷不仁中瀆主寒氣在分肉閒痛舌痺不仁陽關主膝外廉痛不可屈伸脛痺不仁絶骨主酸痺不仁又主身重見上環跳治冷風濕痺銅見腰痛條口見膝痛治濕痺下髎治寒濕内傷見月事委中療風濕痺明見脚弱下廉療偏風熱風冷痺不遂風濕痺灸瘡差冷痺即已魚際療痺走胷背明見寒熱銅同治冷痺脛膝疼腰脚攣急足冷氣上不能久立有時厭厭嗜臥手足沉重日覺羸瘦此名復連病今人極無情地常愁不樂健忘嗔喜有如此候即當灸懸鍾絶骨隨年一灸即愈不得再灸也若年月久更發依法更灸若意便欲多者七日外更七壯千翼虛損論曰疾之所起生自五勞五勞旣用二藏先損心腎受邪即生六極一曰氣極氣極令人内虛五藏不足外受邪氣多寒濕痺云云又曰五勞六極七傷七氣積聚變爲病者甚則令人得大風緩急濕痺不仁偏枯筋縮四支拘攣令人無子云云自汗傷寒自汗盗汗玉枕見目痛療多汗明膈俞見痰療汗出隂蹻療女人汗出見月事隂蹻等見腹痛主汗出千飛揚涌泉頷厭後頂主頸項疼歴節汗出崑崙主瘧多汗千然谷主温瘧汗出復溜治骨寒熱汗注不止銅大敦治心痛汗出見卒疝缺盆治汗出見瘰癧中府治風汗出見肺氣少商治汗出而寒見嘻噫衝陽主汗出見瘧灸手足心熱盗汗見勞牡蠣散治卧即盗汗風虛頭痛牡蠣熬黃白术防風各三兩酒服方寸匕日二止汗之驗無出此方一切泄汗服之三日皆愈此千金方所載也本事方云如惡風加防風一倍氣虚加术面腫加牡蠣蓋增益之也亦有牡蠣散治虛勞盗汗不止牡蠣煅麻黄根黄耆等分爲末毎二錢水一盞煎七分溫服予皆用之驗故附此本事又有二方列缺曲池主熱病煩心心悶先手臂身熱瘈瘲唇口聚鼻張目下汗出如珠千五處攅竹正營上管缺盆中府主汗出寒熱承漿主汗出衂血不止百㑹主汗出而嘔痙大都主熱病汗出目厥足清外臺乃云汗不出厥手足清復溜主寒熱無所安汗出不止風逆四肢腫凡熱病煩心足寒清多汗先取然谷後取大谿大指間動脉皆先補之列缺水腫肺俞心俞主汗出中風傷寒自汗蓋隂證也惟理中湯最佳予屢敎人服驗若止額上有微汗與夫上一節有汗者最宜煎五苓散服之見旣效方單方歌云疫病汗如水論中號濕溫燒故竹扇灰調湯效莫論其論頗有理藥必可用也多汗亦有用心得者宜灸心俞服鎮心丹皆效多汗瘧病譆譩五十多汗四肢不舉少力横文五十長平五十多汗盗汗並見寒熱汗不出凡胷滿短氣不得汗皆鍼補手太隂以出汗千少澤復溜崑崙主瘧寒汗不出偏歴主風瘧汗不出少澤治瘧寒熱汗不出銅上星治痎瘧振寒熱汗不出心俞見狂明同曲差治心中煩滿汗不出明同瘂門治頭痛風汗不出陶道治洒淅寒熱脊强汗不出明同膽俞治振寒汗不出見頭痛命門治頭痛如破身熱如火汗不出上脘治身熱汗不出見霍亂至隂見頭痛魚際見寒熱曲泉見疝俠谿見胷脇滿中膂俞治汗不出見消渇偏歴治風汗不出竅隂治手足煩熱汗不轉筋命門見頭痛肺俞見汗療汗不出明曲澤療汗出不過肩見唾血曲澤主汗出不過眉甲見傷寒寒熱魚際療汗不出見寒熱傷寒無汗大都療熱病汗不出手足逆冷腹滿善嘔目眩煩心四肢腫明下凡溫病身熱五日以上汗下出刺太泉留鍼一時取鍼若未滿五日禁刺勞宫主熱病三日以往不得汗怵惕甲乙亦云主熱病煩滿欲嘔噦三日以往不得汗怵惕胷脇不可反側欬滿溺赤小便血衂不止嘔吐血氣逆噫不止嗌中痛食不下善渇口中爛掌中熱欲嘔千孔最主臂厥熱痛汗不出明云熱病汗不出皆灸刺之此穴可出汗經渠陽池陽谷合谷明下同前谷内庭後谿腕骨支溝明下同厲兊衝陽解谿主熱病汗不出中衝等主熱病汗不出見傷寒諸病命門膀胱俞上管曲差上星陶道天柱上窌懸釐風池主煩滿汗不出飛揚主下部寒熱汗不出體重玉枕大杼肝俞心俞膈俞陶道主汗不出悽厥惡寒光明主腹足清寒熱汗不出曲泉主身熱頭痛汗不出魚際主頭痛不甚汗出尺澤主氣膈喜嘔鼓頷不得汗煩心身痛掖門中渚通理主熱病先不樂頭痛面熱無汗傷寒溫病善摇頭顏清汗出不過眉曲澤主之甲委中治熱病汗不出云云取其經血立愈銅孔最治熱病汗不出此穴可灸三壯即汗出明下同陷谷厲兌膈俞中渚大都見腹滿支溝陽谷明同腕骨前谷治熱病汗不出懸顱治熱病煩滿汗不出明同懸釐治熱病汗不出頭偏痛煩心不欲食譩譆治熱病汗不出大杼治傷寒汗不出脊强經渠治熱病汗不出暴痺喘足明作逆心痛嘔吐商陽治熱病汗不出明下同中衝治熱病汗不出掌熱身如火心痛煩滿舌强太谿治熱病汗不出默默嗜卧溺黄消癉大便難風池治溫病汗不出目眩苦頭痛太陵治熱病汗不出臂孿腋腫善笑不休心懸若饑喜悲泣驚恐目赤小便如血嘔逆狂言不樂勞宫治熱病三日汗不出怵惕胷脇痛不可轉大小便血衂血不止氣逆嘔噦煩渇食飲不下光明治熱病汗不出卒狂虛則痿痺坐不能起實則足䯒熱膝痛身體不仁善囓頰中衝治熱病煩悶汗不出掌熱身如火心痛舌强明下云身熱如火頭痛如破天池療熱病汗不出胷滿頸痛四肢不舉腋下腫上氣胷中有聲喉喝明下相識患隂證傷寒四肢厥冷不省予與理中湯服至第二服汗出如雨矣神哉發背癰疽瘍瘻餘見痔漏頻刺風門洩諸陽熱氣背永不發癰疽銅灸發背法或不見瘡頭以濕紙傅先乾者是以大蒜去皮生切錢子先安一蒜錢在上次艾灸三壯換蒜復三灸如此易無數痛灸至不痛不痛灸至痛方住若第一日急灸减九分二日灸減八分至第七日尚可自此以往灸已後時灸訖以石上生者龍鱗薜荔洗研取汁湯溫呷即瀉出惡物去根凡丁瘡頭瘡魚臍等瘡一切無名者悉治集效凡發腫至堅有根者名曰石癰治法當上灸之百壯石子當碎出如不出益壯乃佳千論曰凡發背皆因服五石寒食更生散所致亦有單服鍾乳而發者又有生平不服而自發背者其候率多於背兩脾間起初如粟米大或痛或癢仍作赤色人皆初不以爲事日漸長大不過十日遂至於死臨困之時以闊三寸高一寸瘡有數十孔以手按之諸孔中皆膿出尋時失音所以養生者小覺背上癢痛有異即火急取浄土水和爲泥捻作餅子厚二分闊一寸半以麄艾大作炷灸泥上帖著瘡上灸之一炷一易餅子若粟米大時可灸七餅子卽差如榆莢大灸七七餅炷即差如錢大可日夜灸不限炷數仍服五香連翹湯及鐡漿諸藥攻之乃愈凡腫起背胛中頭白如黍粟四邊相連腫赤黒令人悶亂即名發背禁房室酒肉蒜麵若不灸治即入内殺人若灸當瘡上七八百壯有人不識多作雜腫治者皆死郭户爲予言鄕里有善治發背癰疽者皆於瘡上灸之多至二三百壯無有不愈但艾炷小作之炷小則人不畏灸灸多則作效矣蓋得此法也然亦不必泥此近有一醫以治外科得名有人發背瘡大如椀有數孔醫亦無藥可治止以艾徧敷在瘡上灸之乆而方疼則以瘡上皆死肉故初不覺疼也旋以藥調治之愈蓋出於意表也王蘧疽發於背張生以艾火加瘡上自旦及暮凡一百五十壯知痛乃已明日鑷去黑痂膿血盡潰膚理皆紅亦不復痛始别以藥附之日一易焉易時旋剪去黑爛惡肉月許瘡乃平是歲秋夏間京師士大夫病疽者七人余獨生此雖司命事然固有料理不知其方遂至不幸者見王蘧發背方序陽輔治腋腫疽馬刀見腰脚痛犢鼻治膝臏癕腫見膝痛竅隂主營明作骨疽發厲項痛引頭明同目痛銅云治癰疽頭痛心煩凡疽卒著五指筋急不得屈伸者灸踝骨中央數十壯或至百壯附骨疽灸間使後一寸隨年壯立差天突療肺癰唾膿血氣壅不通明亶中療肺癰欬𠻳上氣唾膿不下食胷中氣滿如塞少海治瘍腫振寒太衝臨泣見腋腫治馬刀瘍瘻單方歌云惡患是石癰不鍼可藥取當上灸百壯石子出如雨余嘗爲劉和叔序灸癰疽方云必以毒藥攻於内伐其根也又以火艾灼于外宣其毒也法盡於此矣癰疽始作灼艾服大黄等藥無不愈者大黄宜隨人虛實服王子高病背疽京師外醫以爲不可治得一徐人教以灼艾如棗大近千壯魯直數患背瘡亦灼艾而愈灸爲第一法也必癭瘤肉瘤天府甲乙作天窻臑㑹氣舍主瘤癭氣咽腫通天主癭灸五十壯胷堂羊矢灸百壯腦户通天消濼天突主頸有大氣臑㑹治項癭氣瘤明下云療癭及臂氣腫氣舍治瘤癭見欬逆上氣浮白療癭肩不舉銅云治癭氣肺俞療癭氣癭上氣短氣灸肺俞百壯癭上氣胷滿雲門五十壯癭惡氣天府五十壯千金翼云又胷堂百壯癭勞氣衝陽隨年壯癭灸天瞿三百横三闊寸灸之癭氣面腫通天五十壯癭灸中封隨年壯諸癭灸肩髃左右相對宛宛處男左十八壯右十七壯女右十八壯左十七壯或再三取差上又風池百壯又兩耳後髪際百壯又頭衝一作頸衝灸之各隨年壯千金翼云一名臂臑癭惡氣大椎横三闊寸灸之風池耳上髪際大椎各百壯大椎兩邊各寸半小埀下各三十又臂臑隨年壯凡五處共九穴又埀兩手兩腋上文頭各三百壯鍼亦良千翼大智禪師云皮膚頭面生瘤大如拳小如栗或軟或硬不痛不可輙鍼灸天南星生乾皆得滳少醋研膏先將小鍼刺病處令氣透以藥膏攤紙上貼三五易差此亦一說也故併存之治腦瘻諸節諸癰腫牢堅治之方削附子令如棊子厚正着腫上以少唾濕附子艾灸附子令熱徹附子欲乾輒更唾濕之常令附子熱徹附子欲乾輒更氣入腫中無不愈此法絶妙不傳千翼凡肉瘤勿治治則殺人肘後方云不得鍼灸瘰癧大迎五里臂臑主寒熱頸瘰癧千大迎治寒熱頸痛瘰癧銅缺盆治寒熱瘰癧缺盆中腫外潰則生胷中熱滿腹大水氣缺盆中痛汗出明同五里治寒熱瘰癧欬𠻳臂臑治寒熱頸項急瘰癧肩臂痛不得舉少海療腋下瘰癧臂疼屈伸不得風痺疼疰病明天牖療瘰癧寒熱頸有積氣暴聾肩痛下灸一切瘰癧在項上及觸處但有肉結凝似作瘻及癰節者以獨頭蒜截兩頭留心大作艾炷如蒜大小帖癧子上灸之勿令上破肉但取熱而已七壯一易蒜日日灸之取消止一切瘰癧灸兩胯裏患癧處宛宛中日一壯止神驗又五里大迎各三十壯又患人背兩邊腋下後文上湏隨年壯又耳後髮際直脉七壯有同舍項上患癧人教用忍冬草研細酒與水煎服以滓傅而愈詳見良方次年復生用前藥不效以艾灸之而除根有小兒耳後生癧用藥傅不效亦灸之而愈云瘰癧初生如梅李切忌以毒藥㸃蝕及鍼刀鐮割勞癧爲甚旣經蝕取之後無有不死者蓋外醫旣少慈悲又利於積日特宜戒之必癧瘍著頸及胷前灸乳間見白駮腋下瘰癧漏臂疼屈伸不得風痺漏瘙鍼少海三分留七呼瀉五吸鍼瘰癧先拄鍼皮上三十六息推鍼入内之追核大小勿出核三上三下乃出鍼頸漏天池百壯又心鳩尾下宛宛中七十又章門臨泣支溝陽輔百壯又肩井隨年又以艾炷繞四畔周匝七壯即止諸惡漏中冷息肉出灸足内踝上各三壯二年者六壯千翼風疹瘾疹曲澤治風疹臂肘腕善動摇銅肩髃治熱風癮疹明云刺風風虚曲池治刺風癮疹涌泉明同環跳見膝治風疹下崑崙療刺風疹風熱風冷痺明曲池療刺風疹疼痛見偏風伏兎見風勞療癮疹合谷曲池療大小人徧身風疹下千金方云人有風疹多必眼暗先攻其風其暗自差然則人之目暗亦有因風疹多而得者風疹可不先治乎千金翼灸風熱赤疹癢搔之逐手作瘡法以一條艾蒿長者以兩手極意尋之著壁立兩手併蒿竿拓着壁伸十指當中指頭以大艾炷灸蒿竿上令蒿竿斷即止灸十十差差後重發更依法灸永差癮疹曲池灸隨年壯頭痛癮疹天窻七壯歴節風飛揚涌泉頷厭後頂主歴節汗出千見頸項飛揚治歴節風足指不得屈伸頭目眩逆氣銅麝香丸尤治白虎歴節諸風疼痛遊走無定狀如蟲行畫静夜劇許叔微在歙川有一貴家婦人遍身走炷疼痛至夜則發如蟲嚙其肌多作鬼邪治予曰此正歴節病也三服愈見本事方舉體痛癢如蟲嚙掻之皮便脫作瘡灸曲池見瘡良方服治癩藥半月兩膝眼灸二七壯丞相長安公醫人無數麻風惡疾千金諸方藥甚多或效或不效惟兼絲葉細末地暴米糊圓梧子大日二三服每服四五十丸茶湯下調藥末服效尤速止難服爾病去後亦宜服屢施與人神效若更灸曲池合谷三里絶骨等穴尤佳予與人按此等穴皆痠疼故也丁瘡瘍瘻窩瘡魚臍瘡疳瘡丁腫灸掌後横文後五指男左女右七壯卽差已用得效丁腫灸法雖多然此法甚驗出於意表千刮竹箭上取茹作炷灸丁腫上二七壯即消丁瘡灸法千金以爲神驗亦有先以鍼刺魚臍瘡上四畔作孔擣白苣汁滴瘡孔者有刺瘡頭及四畔令汁出擣生栗黄傅以麫圍之勿令黄出從旦至午根拔出者有用蒼耳根莖苗但取一色燒灰醋泔淀和如泥塗乾卽易之不過十度拔根出者丁腫方有千首皆不及此也有用皂莢子取仁作末傅五日内差者有用水獺屎傅大良者可考而知也有道人傳瓦盤覆蜣蜋安濃米泔小盞以火逼之蟲熱喫泔及困死取腦中白肉乃米泔也新瓦上暵乾爲末熱酒調二錢服仍以少傅瘡卽愈胡簽母患此疼如鐡丁丁然依此治之效小海治瘍腫振寒太衝臨泣見腋腫治馬刀瘍瘻銅一切窩瘡灸足大指竒間二七壯灸大指頭亦佳千予年少生一瘡在足内外踝之中深而疼隂證瘡也偶閱古隂陽書有用青桑漿治袴口瘡者用之卽愈後在武林内踝上生一瘡踰月又生一瘡令僕往江下取得少黄桑漿僅可一抹翌朝愈矣自是常教人用皆效舍姪腿生瘡不可行舍弟取桑根搗成膏傅亦愈舉體痛癢如蟲齧癢而搔之皮便脫落作瘡灸曲池二穴隨年壯發卽灸之神驗千凡丁瘡頭瘡魚臍等瘡一切無名者皆治見發背凡瘡毒乆不合灸合谷各七壯至七七壯極驗仍服内托散小兒疳濕瘡灸第十五椎俠脊兩傍七壯未差加七壯千丁腫在左灸左臂曲肘文前取病人三指外於臂上處中灸之兩筋間從下痛至痛腫在右從右灸不過三日即差矣千翼癬疥瘡白癜風疣目日中時灸病處影上三壯呪曰癬中蟲毛戎戎若欲治待日中千又法八月八日日出時令病人正當東向户長跪平舉兩手持户兩邊取肩頭小垂際骨解宛宛中灸兩火俱下各三壯若七壯十日愈千金翼曰瘑瘡疥癬皆有諸蟲三年不差便爲惡疾云云治乆癬不差方細研水銀霜如粉和臘月猪膏先以泔清洗瘡拭乾一塗卽差再塗永差矣大陵支溝陽谷後谿主痂疥千陽谿治痂疥銅合谷曲池療皮膚痂疥明下予少患疥凡十五年遇冬則爲瘡人教用羊蹄菜根蛇床子根片切如錢米泔浸二三宿漉出入生薑礬同研細裹以生布遇浴擦洗良乆以水洗三四次用卽除根後數年再生用前法愈神效如此何以灸為也白癜風灸左右手中指節去延外宛中三壯未差報之至道單方治紫癜風用舶上硫黄細研綿帛裹生薑自然汁半盞浸和綿子塗所患處稍乾再易此患多從夏發但請驗之予雖未試想必竒方也千金翼灸白癜白駮等重午日午時灸膝外屈脚當文頭隨年壯一時下火不得動又白癜白駮浸滛癧瘍著頭頸胷前灸兩乳間隨年壯立差疣目着艾炷疣目上灸之三壯卽除支正治生疣目銅疣目雖可灸千金方亦有用杏仁燒令黒研膏塗上者有用松栢脂合和塗之一宿失去者有用牛口中涎敷塗自落者有用苦酒漬石灰六七日滴取汁㸃疣上小作疣即落者有以猪脂揩癢處令少許血出卽差神驗無以加者不必專拘灸也蠱毒巨闕治蠱毒銅見心痛俗亦有灸法初中蠱於心下捺便大炷灸百壯併主猫鬼亦灸得愈又當足下小指尖上灸三壯當有物出酒上得者有酒出飯上得者有飯出肉菜上得者有肉菜出卽愈神驗皆於灸瘡上出千梅師治卒中蠱下血如雞肝藏府敗壊桔梗擣汁服七分合佳録驗方亦云卒中蠱血如雞肝晝夜出血桔梗擣屑酒服方寸匕日三藥不下挍開口灌又有用馬藺根末水服方寸匕隨吐則出極神者肘後方云凡中蠱令人心腹切痛如有物咬或吐下血不卽治蝕人五藏盡卽死萆麻一枚去皮朴消一錢同硏新水作一服連進二三服效此雖未試亦竒方也犬傷蛇傷外丘治猘犬所傷毒不出發寒熱速以三壯艾可灸齧處立愈銅春末夏初狂犬咬人卽令人狂過百日乃得免當終身禁食犬肉蠶蛹食此則發不可救也先去却惡血灸瘡中十壯明日以後日灸一壯百日乃止忌酒每七日搗韮汁飲一二盞腄日蛇入七竅以艾灸蛇尾卽出又法刀破蛇尾些子入椒七粒蛇自出出後急以雄黄朱砂細研煎人參湯調灌取蛇毒單山居人或被蛇傷卽以溺溺之拭乾以艾灸之效朝野僉載記艾炷當毒蛇齧處灸引出毒氣差薄切獨頭蒜貼蛇咬處灸熱徹卽止灸蛇毒上三七壯無艾以火頭將瘡孔大小熱之千翼狂犬咬人令人吮去惡血盡灸百壯後日日灸百日止差血不出一生忌酒猪千翼乳癰膺窻治乳癰寒熱卧不安銅臨泣治乳癰見月事神封治乳洒淅惡寒明同乳根治乳癰悽慘寒千有熱字痛不可按三里主乳癰銅同有熱千下廉治乳癰驚痹脛重銅作喉痹䯒腫足跗不収跟痛神封膺窻主乳癰寒熱短氣卧不安天谿俠谿主乳腫癰潰論曰產後宜勤濟乳不宜令汁蓄積蓄積不去便結不復出惡汁於内引熱溫壯結堅牽掣痛大渇引飲乳急痛手不得近成妬乳非癰也急灸兩手魚際二七壯斷癰脉也不復惡手近乳汁亦自出便可手助迮捋之則乳汁大出皆如膿狀内服連翹湯外以小豆薄塗之便差又以繩横度口以度從乳上行灸度頭二七壯千翼千金論曰女人患乳癰四十以下治之多差四十以上治之多死不治自終天年予有親年七十生乳癰不信此論令外科用刀仗開時暫雖快未幾而殂方知千金猶信也有擣地榆汁傅有擣蔓菁葉或根傅熱卽易之有用白芷末溫湯調傅效乳腫痛殂乳少吐嬭乳根療乳痛明肓門明同治婦人乳有餘疾銅千云中極主乳餘疾氣衝治難乳子搶心見月事府舍厥氣兩乳見脾疼太泉主妬乳膺胷痛千天谿治乳腫賁膺見胷痛梁丘見驚地五㑹治乳腫天牖主乳腫缺盆中腫千足臨泣主乳腫見月事亶中治乳汁少銅明下云妳脉滯無汁下火立愈小兒吐妳灸中庭一壯明下小兒喉中鳴嚥乳不利璇璣三壯婦人無子隂廉治婦人絶産若未經産者灸三壯卽有子銅中髎治絶子𢃄下月事不調次髎涌泉商丘治絶子中極治婦人斷緒見月事明同明下云療失精絶子石關治絶子藏有惡血上衝腹㽲痛不可忍明下云腹厥痛絞刺曲泉主女子疝痂按之如以湯沃兩股中小腹腫隂挺出痛經水來下隂腫或癢漉青汁如葵羮血閉無子不嗜食千水原隂蹻主女不字隂暴出淋漏月水不來多悶心痛然谷主不字銅作不字隂暴出經漏千上窌主絶子瘧寒熱隂挺出不禁白瀝痙脊反折隂交主拘攣腹滿疝月水不下乳餘疾絶子隂癢賁豚上䐜腹堅痛下引隂中不得小便石門主腹滿疝積乳餘疾絶子隂癢賁豚上䐜小腹堅痛下引隂中不得小便忌灸絶孕關元主絶子不血血在内不下胞轉不得尿小腹滿石水痛又主引脇下脹頭痛身背熱賁豚寒小便數泄不止中極主子門不端小腹苦寒隂癢及痛賁豚搶心饑不能食腹脹經閉不通小便不利乳餘疾絶子又主狗攣腹疝隂癢築賓主大疝絶子涌泉主女子無子欬而短氣氣衝主無子小腹痛隂廉主絶産若未曽産婦人絶子灸然谷五十壯婦人絶嗣不生胞門閉塞關元三十壯報之婦人姙子不成若堕落腹痛漏見赤胞門五十壯在關元左邊二寸是婦人絶嗣不生灸氣門在關元旁三寸百壯婦人子藏閉塞不受精疼胞門五十壯婦人絶嗣不生漏赤白泉門十壯三報月水不利賁豚上下併無子曰滿三十壯婦人胞落頽臍中三百壯又隂交五十壯三報在臍下横文中又背脊當臍五十壯又玉泉五十壯三報婦人胞下垂注隂下脱灸俠玉泉三寸隨年壯三報婦人隂冷腫痛歸來三十壯三報中極婦人斷緒最要穴𢃄下關元主斷緒產道冷鍼八分留三呼㵼五吸灸亦佳灸不及鍼日灸百壯止姙不成數堕落玉泉即中極五十壯三報又龍門二十壯婦人無子鍼關元千翼甄權涌泉治婦人無子見虚損婦人欲斷産灸右踝上一寸三壯卽斷千石門忌灸絶孕銅云鍼之絶子明云懐胎必不鍼關元若鍼而落胎胎多不出鍼外崑崙立出隂交灸多絶孕千翼又云石門關元相去一寸鍼關元治婦人無子鍼石門則終身絶嗣其道幽隱豈可輕侮哉婦人血氣痛四滿又主胞中有血石關主子藏有惡血内逆滿痛千四滿治婦人血藏積冷陽蹻療婦人血氣明隂交治産後惡露不止繞臍冷痛見血崩涌泉治心痛不嗜食婦人無子女子如姙娠五指端盡痛見虛損婦女本藏氣血癖走刺痛灸法見腎虚隂交治血塊腹痛餘見月事血塊瘀血石門治婦人因産惡露不止遂結成塊崩中明同漏下銅天樞中極治血結成塊並見月事下極療因産惡露不止遂成疝瘕或因月事不調血結成塊明漏谷曲泉治血瘕銅見痃癖曲骨主血癃千復溜主血淋血淋灸丹田等並見淋三里治胷中瘀血銅九曲中府主内有瘀血見尸厥血崩崩中漏下惡露不止大敦治血崩不止銅合陽治崩中氣海見月事石門治崩中漏下見血塊中都治崩中因産惡露不絶交信隂谷太衝三隂交治女漏血不止石門治崩中漏下見血塊血海治漏下惡血月事不調逆氣腹脹血海主漏下若血閉不通逆氣脹千隂谷主漏血小腹脹體寒熱腹偏腫太衝見疝然谷主經漏見無子隂蹻主隂挺下血隂腫或癢漉清汁若葵汗白崩灸小腹横文當臍孔直下百壯又内踝上三寸左右各百壯隂交石門療崩中明天樞療漏下赤白交儀復留並同及腹大堅食不化面色蒼蒼下若經候過多其色瘀黒甚者崩下吸吸少氣臍腹冷極則汗出如雨尺脉微小由衝任虛衰爲風冷客乗胞中氣不能固可灸關元百壯宜鹿茸丸指有皮匠妻患血崩兩月飲食不進與鎭靈丹服少减而未斷因撿得耆域方如聖散用椶櫚烏梅乾薑各一兩並燒存五分性爲末毎服二錢食前烏梅湯調下患甚者不過三服合一劑與服而疾平又有廵捕之妻年踰五十因傷寒而血崩與加膠艾四物湯一服漸愈後因勞復大作與鎭靈丹十五丸而止或無此丹燒鹿角存性爲末酒調服亦佳以其屢驗故附於此隂交治女子月事不絶𢃄下産後惡露不止繞臍冷痛銅明同氣海見月事中都治惡露不止見血崩關元治惡露不止見赤白帯中極明見血塊石門下與銅同療因産惡露不止漏胞下血不禁灸關元兩旁三寸百壯産難月水不禁横生胎動鍼三隂交胎動崩中下痢賁氣上逆鍼石門寸四分漏胞見赤胞門五十又氣門五十崩中𢃄下鍼灸中極見𢃄下産後餘疾産前期門治産後餘疾銅見心痛千云主産餘疾食不下賁豚上下傷腹滿伏兎療婦人八部諸疾明婦人産後渾身疼鍼百勞穴遇痛處卽鍼避筋骨及禁穴許明下云産後未滿百日不宜灸産後血暈寒熱往來或血搶心惡疾也予閱食料本草見有用鹿角燒爲末酒調服日夜數服驗者偶家有婦人患此令服此神效因教他人婦服皆驗但以産後未可飲酒以童子小便調服爾最忌服利藥明下云凡懐孕不論月數不宜灸銅云昔宋太子善醫術出苑治一姙婦太子診曰女令徐文伯診曰一男一女鍼之瀉三隂交補合谷應鍼而落果如文伯言故姙娠不可刺難産胞衣不出落胎子搶心衝門治難産子上衝心不得息銅張仲文療横產治先出手諸符藥不㨗灸右脚小指尖頭三壯炷如小麥下火立産中封主小腹大字難嗌乾嗜飲夾臍疝千上崑崙主字難若胞衣不出泄風從頭至足氣衝主胞不出見月事氣衝治子上搶心銅見月事千同衝門主乳難子上衝心隂疝千一海上方治難産及胞衣死胎不下􅒝麻七粒去殻研如泥塗足心才下急洗去本事方極驗昔河陽公主每産累不能終南山道士進枳殻散神效枳殻麩炒去穣四兩甘草炙三兩爲細末每服一大錢匕空腹沸湯㸃服五六月後方可服日一服八月日三服始産瘦小數月後平服若横生逆生宜服黒散百草霜釜下黑煤是香白芷等分研匀毎服二錢匕醋童子小便各一茶脚調匀更入少沸湯温熱服良乆便正生未知再作頃刻活二人命予教人服屢驗故附此婦人墮胎後手足厥逆鍼肩井立愈灸更勝鍼可七壯月事氣衝治月水不利身熱腹痛㿉疝隂腫難乳子上搶心痛不得息氣衝腰痛不得俛仰銅會隂治女子經不通千同關元治月脉㫁絶見𢃄下足臨泣治月事不利季脇支滿乳癰心痛周痺痛無常處逆氣喘不能行中極治婦人斷緒又因惡露不止月事不調血結成塊天樞治月事不時血結成塊腸鳴腹痛不嗜食水泉治月事不來來卽多心下悶痛目䀮䀮不能遠視隂挺出小便淋瀝腹痛隂蹻療不月水驚悲不樂如墮墜汗出千作不出面黑病饑不欲食婦人淋瀝隂挺出四支淫濼心悶明下云療月水不調嗜卧怠惰善悲不樂手足偏枯不能行太衝療月水不通下隂包交儀療月水不調隂蹻主經逆四支淫濼隂暴跳小腹偏痛又主女子淋隂挺出月水不來行閒主月事不利見赤白而有身反敗隂寒足臨泣主月水不利見血而有身則敗乳腫腰俞主月閉溺赤脊强互引反折汗不出中樞主經閉不通見無子治女人從小至大月經未嘗來服黄芩牡丹湯兩臍後灸乳下一寸黑員際各五十壯氣穴主月水不通奔泄氣上下引腰脊痛天樞主胞中痛惡血月水不以時休止腹脹腸鳴氣上衝胃氣衝主月水不利或暴閉塞腹脹滿癃淫濼身熱乳難子上搶心若胞不出衆氣盡亂中絞痛不得反息正仰卧屈一膝伸一膝月經不斷灸内踝下白肉際青脉上隨年壯𢃄脉俠谿主小腹堅痛月水不通水道主小腹脹滿痛引隂中月水至則腰背痛胞中瘕子門寒大小便不通下髎治女子下蒼汁不禁中痛引小腹疼大便不利寒濕内傷銅隱白治月事過時不止立愈隂交治月事不絶氣海治月事不調𢃄下崩中因産惡露不止繞臍病痛氣穴治月事不調洩利不止賁氣上下引腰脊痛血海見漏下𢃄脉治月水不調見小腹痛隂交見血崩治月事不絶千云不下月水不利灸四滿並見無子月水不調血結成塊鍼閒使見疝瘕産後月水不禁横生胎動皆鍼三隂交千翼月水不利賁血上下無子四滿三十壯赤白𢃄關元治𢃄下瘕聚因産惡露不止月脉斷絶下經冷銅與明同氣海見月事小腸俞治𢃄千明並同中髎治𢃄下月事不調見絶子𢃄脉治𢃄下赤白見小腹痛明下又云脇下氣轉連背痛不可忍隂交見惡露療𢃄下明曲骨療𢃄下赤白惡合隂陽銅同小便閉塞不通但是虛乏冷皆宜灸上窌主白瀝千見絶子次窌主赤白瀝心積脹腰痛中窌主赤滛時白氣癃月事少腰尻交主下蒼汁不禁赤瀝隂癢痛引小腹控眇不可俯仰曲骨主赤白沃隂中乾痛惡合隂陽小腹䐜堅小便閉大赫主赤沃有來覔赤白𢃄藥者予並以鎭靈丹與之鎭靈丹能活血溫中故也以其神效故書於此但有孕不可服爾若灸𢃄脉穴尤竒於此丹也有婦人患赤白𢃄林親得予鍼灸經初爲灸氣海穴未効次日爲灸𢃄脉穴有鬼附患身云昨日灸亦好止灸我未着今灸着我我今去矣可爲酒食祭我其家如其言祭之其病如失此實事也予初怪其事因思晋景公膏肓之病蓋有二鬼焉以其虛勞甚矣鬼得乗虛而居之今此婦人之疾亦有鬼者豈其用心而虛損故有此疾鬼亦乗虛居之灸旣着穴其鬼不得不去雖不祭之可也自此有來覔灸者必爲之按此穴莫不應手痠疼予知是正穴也令歸灸之無有不愈其穴在兩脇季肋之下一寸八分有此疾者速宜灸之婦人患此疾而喪生者甚多切不可忽若更灸百㑹尤佳此疾多因用心使然故也𢃄下灸閒使三十壯見疝瘕絶嗣不生漏下赤白泉門十壯三報下血洩痢赤白漏血足太隂五十壯在内踝上三寸腹中五寒百壯漏下赤白月水不利灸交儀下血漏赤白營池四穴二十壯在内踝前後兩邊池上脉一名隂陽漏下赤白四支痠削漏隂三十壯在内踝下五分微動脉上赤白漏洩注灸隂陽穴隨年壯三報之在足拇指下屈裏表頭白肉際崩中𢃄下因産惡露不止婦人斷緒最要穴鍼中極四度卽有功若未有更鍼入八分留十呼得氣卽瀉灸亦佳不及鍼日灸三十至三百止𢃄下小腸俞五十見寒熱千翼鍼灸資生經卷七
