唇腫俠溪見耳聾和髎見牙關頰車治頷頰腫見口噤曲鬢治頰頷腫引牙車不得開急痛口噤不能言完骨治頰腫大迎治頰頷腫見風痙翳風治脫頷頰腫見口喎腕骨陽谷治頸項腫寒熱支正治頷腫手三里治頰頷腫瘰癧少商治腮頷腫成君綽忽腮頷腫大如升甄權針此立愈商陽治頥頷腫齒痛惡寒肩背急相引缺盆痛目青盲灸三壯右取左左取右食頃立已完骨等主頰腫千見喉痹攢竹等主頰痛見面痛角孫主頸項柱滿兊端等主唇吻強見齒齲足臨泣療胸膈滿悶腋下腫善齧頰明下水溝療面腫唇動葉葉肺風狀如蟲行明李襲興稱武德中出鎮潞州甄權以新撰明堂示豫時有刺史成君綽忽頸腫如數升喉中閉塞水粒不下三日矣余屈權救之針其右手次指之端如食頃氣息即通明日飲噉如故千金翼按銅人云少商穴在手大指端內側去爪甲角如韭葉成君綽腮頷腫大如升云云同上甄權針之立愈病狀少異功效實同但李云次指端銅人云大指端未知其孰是果針少商當在大指端也姑兩存之以俟識者頸項強急腫腕骨陽谷治頸項腫寒熱銅丘墟治頸腫見腋腫大迎治寒熱頸痛瘰癧消濼見風痹竅隂治項痛見癰疽風門治傷寒頸項強見傷寒雜病京骨見足麻大杼治頸項強不可俯仰見瘧明同魄户見勞瘵肩井治頸項不得顧見肩痛天牖後溪治項強不得顧完骨見偏風頷厭治頸項痛本神治頸項強痛見目眩風池治痎瘧頸項痛不得顧通天治頸項轉側難頰車大椎氣舍見咳逆腦空治頸項強不得顧天柱治頸項筋急不得顧人迎治項氣悶腫食不下後頂外丘治頸項痛惡風寒齗交風府治頸項急不得顧見目眩臂臑見瘰􅊓強間治頸項強見頭痛少澤明同前谷後溪陽谷完骨崑崙小海攢竹主項強急痛不可顧千消濼本神通天強間風府瘖門天柱風池齗交天衝陶道外丘通谷玉枕主項如拔不可左右顧明云天柱見目眩強間見頭痛療項如拔下云天柱療項如拔見腦痛天容前谷角孫腕骨支正主頸腫項療不可顧天容主頸項癰不能言飛揚涌泉頷厭後頂主頸項疼歷節汗出角孫主頸項注滿浮白療頸項癰腫銅同不能言及癭肩不舉明曲差療心煩滿汗不出頭項痛身熱目視不明通天療項痛重暫起僵仆瘖門療項強不得顧玉枕見目痛完骨見風眩療項痛風府療頭明有痛項急不可傾側陽谷療脅痛頸腫寒熱天突療身寒熱頸腫喉中鳴翕翕胸中氣鯁鯁下天井療頸項及肩背痛見千肘曲鬢療頸項強不得顧引牙齒痛口噤不能言頭風頭眩又見頭旋五處療頭眩風悶明百會見癎腦空見目眩天柱見腦痛療頭風神聰療頭風目眩狂亂風癎左主如花右主如果前頂療頭風熱痛頭腫風癎後頂療風眩目䀮䀮額顱上痛上星療頭風目眩下前頂治頭風目眩面赤明下作皮腫銅下廉五處見目眩神庭見鼻涕治頭風神庭主風頭眩善嘔煩滿千天牖風門明下同崑崙關元關衝主風眩頭痛前頂後頂頷厭主風眩偏頭痛上星主風頭眩顔清𩕄會主風頭眩頭痛顔清完骨主風頭耳後痛瘈脈同煩心銅同付陽主痿厥風頭重痛俠溪主胸中寒如風狀頭眩兩頰痛腎俞攢竹承光絲竹空瘈脈和窖主風頭痛上星主風頭引頷痛合谷五處主風頭熱天牖療頭風面腫下作目眩項強不得轉明𩕄會治頭風生白屑多睡明同針佳以油鹽揩髮根頭風永除銅頭風腫癢針眉衝許通理百會療頭目眩痛明陽谷療頭眩見狂素問論頭痛本於大寒內至骨髓則頭風者亦本於風寒入腦髓耶本事方論婦人患頭風者十居其半或者婦人無巾以禦風寒焉耳男子間有患之者非頭上少髮必其𩕄會前頂之秃髮也欲炙頭風宜先𩕄會百會前頂等穴其頭風連目痛者當灸上星神聰後頂等穴豫嘗自灸驗教人灸亦驗云本事云下虛者腎虛也腎厥則頭痛宜玉真圓上虛者肝虛也肝厥則頭暈宜鈎藤散頭痛偏頭痛餘見傷寒頭痛解溪見中風承光明同治風眩頭痛嘔吐心煩銅膽俞治頭痛振寒汗不出大杼治頭痛振寒見瘧啞門治頭痛風汗不出合谷天池見膈絲竹空見目眩魚際見寒熱四白見目眩天衝三焦俞見腹脹風池見傷寒無汗治頭痛神道治寒明下作身熱頭痛進退痎瘧恍惚悲愁明同健忘驚悸陽溪治厥逆頭痛􅎍滿不得息豐隆治厥頭痛面浮腫風逆四支腫身濕至隂治鼻塞頭重風寒從足小指起脈痹上下𢃄胸脅痛無常轉筋寒熱汗不出煩心青靈治頭痛振寒目黃脅痛強間治腦旋目運頭痛不可忍煩心嘔吐涎沫發無時項強不可顧崑崙治頭痛肩背急風府治頭痛頸項急不得顧目眩曲差治頭項痛顱息療身熱頭痛不可反側明魚際療頭痛甚汗不出腦户見面腫療頭痛百會通理療頭目眩痛下中衝見傷寒命門上同療身熱如火頭痛如破明下溫留療寒熱頭痛善噦衄肩不舉率谷痛醉後酒風發頭重皮膚腫兩角眩痛小兒食時頭痛千同及五心熱灸譩嘻各一壯天柱陶道大杼一作本神孔最後溪主頭痛千腦户腦空通天主頭重痛頭維大陵主頭痛如破目痛如脫甲云噦逆煩滿嘔吐汗流竅隂強間明同主頭痛如椎刺不可動目窗中渚完骨命門豐隆大白外丘通谷京骨臨泣小海承筋陽陵泉主頭痛寒熱汗出不惡寒神庭水溝主寒熱頭痛喘渴目不可視消濼主寒熱痺頭痛五處等主頭痛見瘈瘲崑崙解溪曲泉飛揚前谷少澤通理主頭眩痛若頭痛筋攣骨重少氣噦噫滿時驚不嗜卧咳嗽煩寃其脈舉之則弦按之石堅由腎氣不足而內著其氣逆而上行謂之腎厥宜灸關元百壯服玉真丸指若頭痛連齒時發時止連年不已此由風寒留於骨髓髓以腦為主腦逆故頭痛齒亦痛宜白附子散灸曲鬢七壯左痛灸左右痛灸右少海見齒齲完骨治頭痛銅見心煩千云主風頭耳後痛腦空等天衝主癲疾頭痛千見癲素問嘗論有數歲頭痛不已者大寒內至骨髓髓以腦為主腦逆故頭痛齒亦痛名曰厥逆頭痛亦有腎厥肝厥頭痛者如本事方所謂下虛者腎虛也腎厥則頭痛上虛者肝虛也肝厥則頭暈是也皆可隨證治之若真頭疼則朝發夕死夕發朝死矣詳見難經疏人而患此亦末如之何要之亦有所自其在根本不固耶若欲著艾須先百會𩕄會等穴而丹田氣海等穴尤所當灸以補養之毋使至於此極可也前頂等主風眩偏頭痛千見頭風懸釐治頭偏痛見傷寒寒熱懸釐主偏頭痛引目外眥見傷寒頭痛頷厭療風銅云頭風眩目無見偏頭痛引目外眥急耳鳴好喋頸痛明岐伯灸偏頭痛見目眩後頂治頭偏痛銅玉枕主頭半寒痛千甲云頭眩目痛頭半寒正營治頭項偏痛懸顱治熱病煩滿汗不出頭偏痛引目外眥赤身熱齒痛明同懸釐治頭偏痛煩心不欲食並銅腦痛腦風強間治腦旋銅見頭痛天柱治頭旋腦痛明下云療頭風腦重目如脫項如拔項強痛不顧玉枕治腦風疼不可忍承靈治腦風頭痛惡風寒腦空治腦風頭痛不可忍目瞑心悸發即為癲風引目眇上廉治腦風頭痛率谷治腦兩角強痛見痰瘖門療頭風腦疼風池見面腫療腦疼小兒𩕄開不合灸臍上下各五分二穴各三壯灸瘡未合𩕄先合矣下少海治腦風銅見齒齲凡口鼻出血不止名腦衄上星五十壯千有士人患腦熱疼甚則自牀投下以腦柱地或得冷水粗得而疼終不已服諸藥不效人教灸𩕄會而愈熱疼且可灸况冷疼乎凡腦痛腦旋腦瀉先宜灸𩕄會而強間等穴蓋其次也頭旋頭重目窗治忽頭旋銅見目痛絡却治頭旋耳鳴天柱治頭旋見腦痛岐伯灸頭旋見目眩申脈治坐如在舟車中銅見腰腳母氏隨􅀢赴任為江風所吹自覺頭動搖如在舟車上如是半年乃大吐痰偏服痰藥并灸頭風諸穴方愈治頭風搖動灸腦後玉枕中間七壯千翼玉枕療失枕頭重明見目痛下云療頭重如石百會療頭重見風癎百會療腦重鼻塞頭目眩疼下陶道療頭重目眩率谷見頭痛療頭重付陽見頭風腦户等主頭重痛千見頭痛至隂治頭重銅見頭痛天柱療腦重明下見腦啞門見癲通天見鼻衄付陽見風痹治頭重銅腎俞治頭重見勞頭重風勞腦户五壯頭重不能勝灸腦户下寸半千翼頭腫腦户治頭腫銅前頂療頭風熱痛頭腫大腫極即以三稜針刺之繞寸已下其頭痛腫立差明上星療頭風頭腫皮腫面虛鼻塞頭痛𩕄會療頭皮腫生白屑完骨治頭面腫銅見癲腦户治頭腫公孫主頭面腫完骨等主頭面氣腫並見水腫頂腫痛曲差治頂痛銅前頂治小兒驚癎頂腫見驚癎澧陽有士人之子驚風後頂腫醫以半夏南星為細末新水調傅而愈若灸則宜灸前頂等穴云面腫餘見水腫巨窖主面惡風寒頰腫痛千上星天牖治頭風面虛腫銅𩕄會治目眩靣腫明下云面赤暴腫前頂治面赤腫目窗治頭面浮腫痛引目外眥上赤痛完骨治頭面浮腫水溝治面腫唇動狀如蟲行又云風水面腫針此穴出水盡頓愈迎香治面癢腫見偏風大迎治風壅靣浮腫目不得閉唇吻瞤動不止針之頓愈合谷治面腫唇吻不收瘖不能言口噤不開溫溜治面虛腫豐隆見頂痛承漿陽交見膝痛治面腫厲兊治寒瘧面腫足䯒寒陷谷見水腫治面目浮腫百會治飲酒面赤明見風癎解溪治頭風面赤腦户治面赤腫頭痛明厲兊療面浮腫水溝見肺風天牖療面腫陷谷療頭面虛腫風池療肺風面赤目視䀮䀮項強不得顧面腫皮軟腦疼上星𩕄會前頂腦户風池主面赤腫千陷谷上星𩕄會前頂並見水腫公孫治卒面腫銅見狂言陷谷等陽陵泉等天樞等中府等解溪主面腫並見水腫有人因入水得水腫四支皆腫面亦腫人為灸水分并氣海翌朝視其面如削矣恐面腫亦可灸水分云面痛面赤面黑攢竹齗交玉枕主面赤頰中痛千中渚主顳顬痛頷顱主熱痛面赤懸釐主面皮赤痛腎俞內關主面赤熱天窗天突主面皮熱腦户治面赤目黃銅懸顱治面膚赤痛行間主面蒼黑千太衝主面塵黑支溝見咳間使見狂掖門見驚主面赤解溪主面赤見風氣海療冷病面黑明下腎俞療面黃黑並見勞關衝主面黑見風針灸資生經卷六
