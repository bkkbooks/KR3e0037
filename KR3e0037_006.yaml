body:
  text: 針灸資生經卷六耳鳴上關下關四白百會顱息翳風耳門頷厭天窗陽溪關衝掖門中渚主耳鳴聾千天容聽會聽宫中渚主聾䏆䏆若蟬鳴腕骨陽谷肩貞竅隂俠溪主頷痛引耳䏆䏆耳鳴無所聞前谷後溪主耳鳴仍取偏歷太陵商陽主耳中風聾鳴刺一分留一呼灸三壯左取右右取左如食頃明下云療耳鳴聾百會治耳鳴耳聾銅絡却治頭旋耳鳴銅浮白治耳鳴䏆䏆無所聞和髎治耳中䏆䏆見牙關急上關治耳中如蟬聲見偏風耳門治耳鳴如蟬聲見停耳聽會聽宫治耳蟬聲見耳聾瘈脈治頭風耳鳴偏歷陽溪商陽見熱病無汗絡却見頭旋腕骨前谷治耳鳴頷厭見風眩療耳鳴明肩貞主耳鳴無聞甲身傷寒寒熱頷厭療耳鳴見偏頭痛人之耳鳴醫者皆以為腎虛所致是則然矣然亦有用氣而得者用心而得者不可一槩論也若欲無此患蓋亦不使腎至於虛且不使氣不用心可也或微微耳鳴止用蔥管置在耳中令氣透自不鳴矣耳痛上關下關四白百會顱息翳風耳門鳴下同曲池頷厭天窗陽溪關衝掖門中渚主耳痛少商主耳前痛瘈脈完骨主頭風耳後痛見頭風頭痛耳聾天牖又主耳不聰四瀆主耳暴聾千外關會宗主耳渾渾淳淳聾無所聞商陽主耳中風聾鳴見耳鳴天牖主耳不聰明下云療暴聾上關等主耳鳴聾見耳鳴商陽見熱病無汗陽谷明同百會治耳鳴耳聾銅束骨見腰僂翳風上關後溪顱囟治耳聾風池治耳塞腎俞治耳聾腎虛見勞瘵聽會治耳聾耳中如蟬聲聽宫治耳聾如物填塞無所聞耳中䏆䏆明云䁸䁸䏆䏆蟬鳴也外關天窗明下同治耳鳴聾無所聞竅隂治卒聾不聞人語三陽絡液門治耳暴聾見瘧四瀆治暴氣耳聾中渚治頭痛耳聾會宗治耳聾見風癎俠溪治頰頷腫耳聾􅎍痛不可轉痛無常處明下云療耳鳴聾浮白療耳聾銅作鳴䏆䏆無所聞明玉枕見目痛療耳聾上關療耳聾狀如蟬聲下云耳鳴聾顱息療小兒耳聾見喘耳門翳風腦空療耳聾鳴下外關聽會療耳淳淳渾渾聾無聞葦筒灸耳病見中風不語肩貞主耳聾千耳聾刺足少隂見心恍惚天牖療暴聾明見瘰􅊓耳聾有用氣得者氣快則通傷寒用衣被擁塞得者病去漸愈鄉人用劄耳草取汁滴用新羅白草煮粥食亦驗云停耳生瘡下關治停耳有膿汁出銅耳門治耳有膿汁出生瘡䏄耳停耳耳鳴明有聾字如蟬聲重聽無所聞風池治耳塞聽宫治耳如物填塞停耳膿出上關日三壯至二百千翼有二婦人耳久膿出豫以晉礬火煅候汁乾研細令挑少許入耳覺耳漸重而愈本事方紅綿散止用白礬煅用目痛目瞑陽白主目瞳子痛癢千見不明大衝主下眥痛又云治婦人大衝陽谷崑崙主目急痛赤腫曲泉主目赤腫痛陽溪陽谷主目痛赤俠溪主外眥赤痛逆寒泣出目癢二間主目眥風池腦户明同玉枕風府上星主目痛不能視先取譩嘻後取天牖風池照海主目痛視如見星天柱陶道崑崙主目如脫頭維太陵主目痛如脫見頭痛三間明同前谷主目急痛陽白治頭目痛目眵銅目窗治頭面浮腫痛引目外眥上赤痛忽頭旋目䀮䀮逺視不明上星腦户治目睛痛不能逺視玉枕治目痛不能視明下云目痛如脫天柱療頭風目如脫明心俞隂蹻療目痛飛揚陽谷療頭眩眼痛玉枕療目內攣系急痛失枕頭重項痛風眩目痛頭寒多汗耳聾鼻塞小兒三五歲兩眼每至春秋生白翳遮童子痛不可忍灸九椎節上一壯小兒熱毒風盛眼睛痛灸手中指本節頭三壯名拳尖四白主目痛僻戾目不明千齗交主目痛不明下廉主眼痛眼急痛不可逺視灸當陽隨年壯前谷主目痛見目淚風癢赤痛人中近鼻柱灸二壯通理百會後頂療頭目痛並見頭痛崑崙主目如拔千見瘧陶道治頭重目瞑銅與明同大迎治目不得閉見靣腫風門治傷寒目瞑見傷寒雜病天柱治目瞑視腦空療頭風目瞑明銅云腦風頭痛天府療頭眩目瞑逺視䀮䀮目窗主目瞑逺視䀮䀮千承漿主目瞑身汗出目微澀痛或兩旁生小米珠頻去其睫自愈不必針灸目上視眼目瞤動申脈主目反上視若赤痛從內眥始千陽白上星本神大都曲泉俠溪三間前谷攢竹玉枕主目系急目上插絲竹空前頂主目上插憎風寒神庭見風癎𩕄會見驚癎治目上不識人肝俞治目上視見咳逆筋縮療目轉上及目瞪明下見驚癎臨泣主兒癎反視千見驚癎肝俞療目上視明下見不明筋縮治目轉上埀銅見癲癎治眼戴睛上插眼反戴眼並見中風承泣銅見目淚主目瞤動與項口相引甲乙云目瞤動與頭口參相引喎僻口不能言顴髎治口喎靣赤目黃眼瞤動不止䪼腫齒痛地倉治眼瞤動不止目不得閉見口喎攢竹治眼臉瞤動見目不明目不明淚出目眩瞢瞳子癢逺視䀮䀮昏夜無見目瞤動餘同上承泣刺承泣目淚出掖門明下云目澀䀮䀮頭痛泣出前谷後溪腕骨神庭百會天柱風池心俞天牖主目泣出肝俞等主目淚出多眵䁾見目翳俠溪主泣出目癢見目痛承泣主目淚出行間見口喎神庭治目淚出銅見鼻涕臨泣治多淚見翳齗交治目淚眵汁內眥赤癢痛生白翳風池治目淚出欠氣多睛明治氣眼冷淚見眼翳承泣治目瞤冷淚見口喎頭維治風淚出見目瞤腕骨治目冷淚生翳行間口喎魚際療目泣出明心俞療目䀮䀮淚出下精明主目逺視不明惡風目淚出增寒頭痛目眩瞢內眥赤痛逺視䀮䀮無見眥癢痛淫膚白翳千目淚出刺承泣見目瞤前谷主目痛泣出甚者如脫行間治目淚出見口喎豫用真熊膽治人目疾赤爛翳淚皆除神效目眩通谷治頭重目眩善驚引鼽衄頸項痛目䀮䀮銅神庭見鼻涕上關見瘈瘲涌泉譩嘻見肩背痛束骨見腰僂魚際大都見腹滿治目眩本神治目眩頸項強急痛胸脅相引不得轉側飛揚見歷節風肺俞治頭目眩見􅎍滿肝俞治目眩循眉痛見咳逆絲竹空治目眩頭痛目赤視物䀮䀮風癎目戴上不識人眼睫毛倒發狂吐涎沫發即無時天府治目眩逺視䀮䀮支正三焦俞治目眩頭痛見腹脹風池治目眩若見傷寒無汗風門治身熱目眩見風勞臨泣治目眩枕骨合顱痛惡寒風府治頭痛頸項急目眩神庭治頭風目眩淚出上星治目眩明下同睛痛不能逺視前頂五處治頭風目眩目戴上見瘈瘲臨泣治目眩鼻塞目生白翳四白治頭痛目眩明同眼白翳微風目瞤動不息前關療風赤眼頭痛目眩目澀明四白銅同涌泉大杼療頭痛目眩束骨療頭痛目眩下又云療風赤胎赤兩目眥爛身熱肌肉動前谷療目眩淫淫攢竹療頭目風眩眉頭痛鼽衄目䀮䀮無逺見下𩕄會療頭目眩歧伯灸頭旋目眩及頭偏痛不可忍牽眼䀮䀮不逺視灸兩眼小眥上髮際各一壯立差率谷主醉酒風熱發兩目眩痛千大都主目眩承漿前頂天柱腦空目窗主目眩瞑天柱陶道明下同崑崙主目眩目如脫又云瘧多汗目如脫項如拔崑崙主之大敦主目不欲視太息神庭水溝主頭痛目不可視承泣主目眩見目不明通理百會療頭目眩疼明後頂療目眩痛下見目不明臨泣中渚治目眩銅並見目翳頷厭主目眩千見偏頭目不明又目䀮䀮目暗目眇腎俞偏歷後頂治目䀮䀮銅攢竹治目䀮䀮視物不明眼中赤明作熱痛及臉瞤動又云三度以細稜針刺之目大明養老合谷曲差明同治目視不明肩中俞治寒熱目視不明風池見目痛五處治目不明目窗治忽頭旋目䀮䀮逺視不明又云三度刺目不明復溜見脊肝俞治起則目䀮䀮見咳逆頭維治偏痛目視物不明三里治目不明人年三十以上不灸三里令氣上衝目明下云令氣上眼暗所以三里下氣也水泉治婦人目䀮䀮不能逺視頷厭療目無所見明見風眩攢竹見頭風腎俞下見勞崑崙療目䀮䀮後頂療目不明惡風寒頭目眩痛下肝俞療目生白翳解溪同氣短唾血目上視多怒狂衄目䀮䀮脅堂療目黃逺視䀮䀮天牖主目不明千天柱陶道崑崙主目不明目如脫承泣主目不明淚出目眩瞢瞳子癢逺視䀮䀮昏夜無見甲乙陽白主目瞳子痛癢逺視䀮䀮昏夜無見腎俞胃俞心俞百會內關復溜太泉腕骨中渚明下同攢竹精明委中崑崙天柱本神大杼頷厭通谷曲泉後頂絲竹空主目䀮䀮不明惡風寒千風池等主目痛不能視見目痛肝虛目不明灸肝俞二百壯小兒斟酌可灸一二七壯小兒妳澼目不明灸肩中俞各二十壯明千金方戒人喪明之由云生食五辛接熱食飲刺頭出血過多極目逺視夜讀注書久處煙火博奕不休日沒後讀書飲酒不已熱餐麵食抄寫多年雕鏤細作泣淚過多房室不節數向日月輪看月下讀書夜視星月極目瞻視山川草木十八件又有馳騁田獵冒涉風霜迎風追獸日夜不息者並是傷目之由也其讀書博奕等過度患目者名肝勞若欲治之非三年閉目不視不可得差徒自㵼肝及作諸治終是無效本事方云讀書之苦傷肝損目誠然晉范寧嘗苦目痛就張湛求方湛戲之曰云云用損讀書一減思慮二專內視三簡外觀四旦早起五夜早眠六凡六物熬以神火下以氣藴蓄於胸中七日然後納諸方寸修之一時近能數其目睫逺視尺箠之餘長服不已動見墻壁之外非但明目乃亦延年審如是而行之非可謂之嘲戲亦竒方也以其勸戒人有理姑備載之以示後人眼暗灸大椎數節第十當脊中安脊二百壯以多為佳最驗千明堂云人年三十以上若不灸三里令氣上衝目明下云眼暗千金方云讀書博奕等過度患目者名肝勞若欲治之非三年閉目不視不可得差徒自㵼肝及作諸治終是無效則是目者不可使之勞也古人蓋有養之之法如彭真人龜年常患目疾不計晝夜瞪目注視以去昏暗閉之少頃依法再行積功而視秋毫徐真人甲常患目疾暗室五坐運睛旋還八十一數閉目集神再運不數而神光自現狀如金輪永除昏暗施真人自記歌亦云運睛除目暗此見抱朴子皆養之之法也若用藥則地黃元羊肝元等與用當歸芍藥黃連等分為末以雪水煎濃汁乘熱頻洗者最佳云見既效方腦空治癲風引目眇見腦痛目翳膜白翳睊目􅀈目至隂主目翳千丘墟主目翳瞳子不見後溪主眥爛有翳又主目赤有翳前谷京骨主目中白翳京骨主目反白白翳從內眥始肝俞上星風池精明齗交承泣四白巨窖瞳子窖主目淚出多眵䁾內眥赤痛癢生白膚翳承光治目生白膜銅臨泣治目生白膜多淚又治目眩生白翳睛明治攀睛翳膜覆瞳子惡風淚出目內眥癢痛小兒雀目疳眼大人氣眼冷淚􅀈目視物不明大眥努肉侵睛明云膚翳白膜覆瞳子眼暗雀目冷淚巨髎治白翳覆瞳子見青盲少澤治目上膚翳覆瞳子丘墟見腋腫瞳子髎治目中翳膜見青盲中渚治目眩生翳膜臨泣腕骨齗交並見目淚肝俞見咳逆四白見目眩關衝前谷治目生白翳至隂治目生翳太淵治目生白翳明下同眼眥赤筋缺盆中引痛陽溪治目風赤爛有翳角孫治目生膚髮至隂療目翳䀮䀮合谷療目不明生白翳下張仲文療風眼卒生翳膜兩目痛不可忍灸手中指本節頭節間尖上三壯炷如麥左灸右右灸左前溪主目中白翳千解溪主白膜覆珠子無所見目卒生翳灸大指節橫文三壯左灸右右灸左良肝俞解溪療目生白翳明下見目不明水溝主睊目上關見青盲偏歷主􅀈目䀮䀮豫遊學會稽絶早觀書辰牌方食久之患目澀倦遊而歸同舍遺以鹽精數次揩目而疾除鹽精且爾則青鹽之能治目固也古方蓋用青鹽揩牙因掬在手洗目而目明云鹽精乃鹽倉地下之精英目赤目黃目青懸釐治目兊眥赤痛銅攢竹治眼赤痛見目不明風池治目內眥赤痛氣發耳塞目不明崑崙太淵陽溪治目赤見目翳俠溪治目外眥赤目眩液門治目赤澀千云主目澀暴變內關治目赤支滿目窗見目痛太陵治目赤見傷寒無汗上星肝俞主內眥赤痛癢千支溝主女人脊急目赤申脈見目痛火衝等