  text: 欽定四庫全書子部五
  hash: sha256:385bc2d94867d1b606f43bb11ebdc68a3a5579aafe48be2b02b9eb652717f689
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3e0037_WYG_000-1a, image: WYG0742/WYG0742-0229a.png}
body:
  text: 鍼灸資生經醫家類提要臣等謹案鍼灸資生經七卷舊本題葉氏廣勤堂新刋葢麻沙本也不著撰人名氏前有嘉定庚辰徐正卿初刋序稱東嘉王叔權作又有紹定四年趙綸重刋序稱澧陽郡博士王執中作而疑叔權為執中字以字義推之其說或是也其書第一卷總載諸穴二卷至末分論諸症經緯相資各有條理頗為明白易曉舊本冠以徽宗崇寧中陳承裴宗元陳師文等校奏醫書一表與序興書皆不相應考裴宗元陳師文等即校正太平惠民和劑局方之人殆書賈移他書進表置之卷端欲以官書取重歟然宋代官書自有王維徳銅人鍼灸經曷可誣也乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀鍼灸資生經原表昔神農嘗百草之味以救萬民之疾周官設疾醫之政以掌萬民之病著在簡編為萬世法我宋勃興神聖相授咸以至仁厚徳涵養生類且謂札瘥薦臻四時代有救恤之術莫先方書故自開寶以來蚤敕近臣讎校本草厥後纂次神醫普救刋行太平聖惠重定鍼艾俞穴校正千金外臺又作慶厯善救簡要濟衆等方以惠天下或範金掲石或鏤板聨編是雖神農之用心成周之致治無以過也天錫神考睿聖承統其好生之徳不特見於方論而已又設太醫局熟藥所於京師其恤民瘼可謂勤矣主上天縱深仁孝述前列爰自崇寧增置七局掲以和劑惠民之名俾夫修製給賣各有攸司又設收買藥材所以革偽濫之弊比詔會府咸置藥局所以推廣祖考之徳澤可謂曲盡然自創局以來所有之方或取於鬻藥之家或得於陳獻之士未經叅訂不無舛訛雖嘗鏤板頒行未免傳疑承誤故有藥味脱漏銖兩過差製作多不依經祖襲間有偽妄至於貼牓謬戾尤多殆不可以一二舉也頃因條具上達朝廷繼而被命遴選通醫俾之刋正於是請書監之秘文採名賢之别録公私衆本搜獵靡遺事闕所從無不研核或端本以正末或泝流以尋源訂其訛謬折其淆亂遺佚者補之重複者削之未閲歲而書成繕寫甫畢謹獻于朝將見合和者得十全之效飲餌者無纎芥之疑頒此成書惠及區宇遂使熙豐惠民之美意崇觀述事之洪規本末巨細無不畢陳納斯民於壽康召和氣於穹壤億萬斯年傳之無極豈不韙歟鍼灸資生經序銅人明堂黄帝岐伯鬼臾區留以活天下後世自隔體透膚之妙無傳乃謂是能筋脉傷血肉至望而畏之有疾則歸心於庸醫百藥之俱試不知病在巔者必灸風池風病非桂枝輩所能攻病在膺者必灸刺郄門雖枳實輩不能下遂至於束手無䇿豈不哀哉近世朱紘龎安常俱有法涂知西亦謂病當以刺愈三衞鄒握虎以諸法為歌訣該括行去聖賢活人之意賴以復傳今東嘉王叔權又取三百六十穴簡編巔末行分類别以穴對病凡百氏之説切於理及已之見得於心者悉疏於下箴灸之書至是始略備古聖賢活人之意至是始無遺憾傳謂為人子者不可不學醫予親年八十精力強健非頼此書耶因併醫衡世傑訂證不傳見者十有八條鋟木庾司以補惠民之籍時嘉定庚辰孟夏朔承議郎提舉淮南東路常平茶鹽公事徐正卿序鍼灸資生經序予得倅澧陽吏以圖經來迓暇日閲之見文籍之目有灸經焉意其非明堂即銅人也祗役以來親故惠書及士夫之經從者多以印置此書為託扣其所以乃前郡博士王君執中之所編著也求其版則亡之矣豈好事者擕之以去或守藏者不謹而散逸之邪然是經流傳既久豈無存者㝠加搜訪竟未得之憶篋中有淮東庾使徐君正卿所刋鍼灸資生經取而視之其序引厯述東嘉王叔權發明編類之功且謂鍼灸之書至是始畧備古聖賢活人之意至是始無遺憾則知王君之用心亦仁且至矣所謂叔權者其王君之字歟一日出示醫諭劉澐劉一見驚且喜曰王君所刋正此書也今之刻畫精緻視昔有加究所繇來盖徐君嘗主民曹於是邦得此書歸而刋之耳吁是經也王君首刋之澧陽今不復存徐君繼刻之海陵其存與否又未可知版之不存則二君之志將遂湮微豈不惜哉予負丞于此適擕以偕殆非偶然者亟命工鋟梓以廣其傳使是書得不泯絶其於衛生豈曰小補紹定四年四月望朝散郎澧陽郡丞趙綸序
