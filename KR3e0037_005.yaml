一二百壯以㵼風濕毒氣若覺悶熱者不得灸以本有熱灸之則火助風生食物大忌酒麵海鮮及忌房勞不爾服藥無益指有同舍為豫言史載之謂腳氣有風濕二種宜㵼不宜補只宜以沉香湯㵼見既效方而不許其灸千金方乃載灸法如此其詳豈虛人患腳氣方可灸耶故指迷方云若覺悶熱不得灸蓋有所見也凡灸腳氣三里絶骨為要穴而以愛護為第一豫舊有此疾不履濕則數嵗不作若履濕則頻作自後常忌履濕凡有水濕不敢著鞋踐之或立潤地亦不敢久須頻移足而後無患此亦愛護之第二義也有達官久患腳氣多服八味丸愈亦以腳氣衝心惟此藥能治之腳弱腳痹委中療腳弱無力風濕痹筋急半身不遂明三里療腳弱承山療腳弱無力腳重偏風不遂委中療腳弱無力腰尻重曲踿中筋急半身不遂下有人舊患腳弱且瘦削後灸三里絶骨而腳如故益知黃君針灸圖所謂絶骨治腳疾神效猶信也同官以腳腫灸承山一穴瘡即乾一穴數月不愈不曉所謂豈亦失之將攝耶是未可知也單方歌云風毒腳弱痹肩井及大椎風市與三里百壯不須疑千金灸腳弱九八穴病一腳則灸一腳兩腳病則灸兩腳凡腳弱病皆灸兩腳見腳氣或未能盡灸且先灸風市犢鼻三里絶骨亦效或不效當如其法灸之但肩井不可多灸爾腳腫陽蹻療腳氣腎氣明上崑崙療惡血風氣腫痛腳腫承山治腳氣膝腫見腰腳小腸俞治腳腫短氣不嗜食明云不食煩熱㽲痛然谷治足跗腫不得履地􅀢母氏常久病夏中腳忽腫舊傳夏不理足不敢著艾謾以針置火中令熱於三里穴刺之微見血凡數次其腫如失去􅀢素患腳腫見此竒效亦以火針刺之翌日腫亦消何其速也後亦常灸之凡治腳腫當先三里而後陽蹻等穴可也又豫患腳氣指縫爛每以茶末滲之愈他日復爛而腫用茶末不效漸腫至腳背上豫以為腳氣使然竊憂之策杖而後敢行偶賣藥儈者見之云可取床薦下塵滲之如其言滲之而愈此物不值一錢而能愈可憂之疾其可忽哉四支厥手足不舉餘見手足麻痹內庭治四支厥逆腹脹數缺銅至陽治四支重明下同痛見寒熱章門治厥逆四支惰見腹腫鬲俞治四支怠惰見痃癖極泉日月見悲愁脾俞治四支不收見腹脹支溝見腋痛小海付陽見風痺天池見鬲痛三隂交治四支不舉見腹脹大巨治偏枯四支不舉見小腹脹腎俞治腰中四支淫濼見勞瘵尺澤治四支暴腫臂寒短氣見喉痺三里治四支腫滿大都療手足逆冷四支腫見傷寒無汗豐隆療厥逆胸痛氣刺不可忍腹中如刀㽲大小便難四支不收身體怠惰腿膝酸痺屈伸難明下內庭主四厥手足悶千太溪主手足寒至節內庭主四支厥手足悶者久持之厥熱腦痛腹脹皮痛者使人久持之列缺主四支厥喜笑章門主四支解惰喜怒照海主四支淫濼曲泉付陽天池大巨小海明下作少海支溝絶骨前谷主四支不舉五里三陽絡三閒厲兑天井主嗜臥四支不欲動搖行間治四支逆冷銅太溪治手足厥冷見腹脅痛四逆取俠溪見傷寒大都治手足逆冷見腹滿有士人患隂證傷寒手足冷甚以火溫之亦不暖豫與理中湯服即得汗而病愈手足自溫矣若其他手足厥者當隨證灸之四厥脈沉絶灸手閒使便通起死法乾嘔四厥灸乳根轉筋人病狂癡手足厥作狂病治不效名醫録曰此驚恐憂思所得大驚傷心大恐傷腎大憂思傷神志神不足則狂癡志不足則恐怖恐怖則腎氣留積足不收亦因積驚恐氣傷腎也鬼擊卒死菖蒲根搗汁灌立差尸厥百會玉枕主卒起僵仆惡見風寒千通天明同絡却主暫起僵仆大杼主僵仆不能久立煩滿裏急身不安席隱白大敦主卒尸厥不知人脈動如故金門主尸厥暴死中極僕參主恍惚尸厥煩痛內庭主四厥手足悶者久持之厥腦痛腹脹皮痛者使人久持之列缺主四支厥喜笑邪客於手足少隂太隂足陽明之絡此五絡者皆㑹於耳中上絡左角五絡俱竭令人身脈動如故其形無所知其狀若尸刺足大指內側爪甲上去端如韭葉後刺足心後取足中指爪甲上各一痏後取手大指之內去爪甲如韭葉後刺手心主少隂兑骨之端各一痏立已不已以筒吹其兩耳中立已不已拔其左角髮方寸燔治飲以淳酒一杯不能飲者灌之立已豐隆主厥逆足卒青痛如刺腹若刀切之狀大便難煩心狂見鬼好笑卒面四支腫旁廷在腋下四肋閒髙下正與乳相當乳後二寸陷中俗名注市舉掖取之刺入五分灸五十壯主卒中惡飛尸遁注胸脅滿九曲中府在旁廷注市下三寸刺入五分灸三十壯主惡風邪氣遁尸內有瘀血天府主卒中惡風邪氣飛尸惡注鬼語遁下並千隱白治卒尸厥不識人明同足寒不能溫銅中極治恍惚尸厥見賁豚明下云尸厥不知人大敦治尸厥狀如死僕參治尸厥如中惡狀霍亂癲癎狂言見鬼厲兑治尸厥口噤氣絶狀如中惡心腹脹滿明云尸厥如死不知人金門治癲癎尸厥暴疲委陽治腋腫膨膨失志身熱飛尸遁注痿厥不仁魂門療尸厥走疰胸背連痛明下僕參療癲疾尸厥霍亂馬癎攢竹見狂禾窖療尸厥天府療卒中惡鬼疰不得安卧禁灸銅凡尸厥而死脈動如故此陽脈下墜隂脈上爭氣閉故也針百㑹入三分補之灸尉斗尉兩脅下又竈突墨彈丸大漿水和飲之義針足中指頭去甲如韭葉又刺足大指甲下內側去甲三分千水溝治卒中惡銅凡五尸者飛尸遁尸風尸沈尸尸疰也今皆取一方兼治之其狀腹痛脹急不得氣息上衝心胸旁攻兩脅或纍塊踊起或攣引腰背治之法灸乳後三寸男左女右可二七壯不止者多其壯取愈止千又兩手大拇指頭各七壯又心下三寸十壯又乳下一寸隨病左右多其壯數又以細繩量患人兩乳頭內即裁斷中屈之又從乳頭向外量使當肋罅於繩頭灸三壯或七壯男左女右卒疰忤攻心胸灸第七椎隨年又心下一寸三壯又手肘文隨年壯一切病食疰灸手小指頭隨年壯男左女右五毒疰不能飲食百病灸心下三寸胃管十壯水疰口中涌水經云肺來乘腎食後吐水灸肺俞又灸三隂交義灸期門㵼肺補腎也各隨年壯一切疰無新久先仰卧灸兩乳邊斜下三寸第三肋間隨年壯可至三百壯又治諸氣神良一名注市閒使岐伯云療鬼神邪明下銅云可灸鬼邪卒死隂囊下第一橫理十四壯有貴人內子産後暴卒急呼其母為辦後事母至為灸會隂三隂交各數壯而蘇母蓋名醫女也凡溺死一宿尚可救解死人衣灸臍中即活集效腳膝痛攣急不收不仁委中治膝不得屈伸取其經血立愈銅見腰脊腎俞治腳膝拘急足寒如水見勞瘵筋骨攣痛第二十二病灸絶骨千見上氣犢鼻療膝中痛不仁難跪起明髀關療膝寒不仁痺痿不屈伸梁丘療脛痛冷痺膝痛不能屈伸懸鍾療腿膝連膝脛麻痺屈伸難下又云膝脛連腰痛筋攣急足不收履坐不能起蠡溝療足寒脛酸屈伸難見疝巨虛療腳脛酸痛屈伸難不能久立甄權云主大氣不足偏風腲腿腳不相隨風市療脛麻膝痛見腰腳三里療四支腫滿腿膝酸痛三隂交療膝內廉痛小便不利身重足痿不能行下京骨療腿膝脛痿腳攣不得伸癲病狂走自嚙膝脛寒附陽療腿膝脛酸見腰腳承山療腳酸膝重見腰腳陽陵泉療膝股內外廉痛不仁屈伸難風市主兩膝攣痛引脅拘急軃躄或青或焦或枯或黧如腐木絶骨主膝脛骨搖酸痺不仁髀關主膝寒不仁痿痺不得屈伸明同犢鼻主膝不仁難跪光明主痿躄坐不能起明下云膝脛酸痺不仁手足偏小坐不能久膝關主膝內廉痛引臏不可屈伸曲泉主膝不可屈伸曲泉梁丘陽關主筋攣膝不得屈伸不可行解溪條口丘墟太白主膝股腫䯒酸轉筋上廉主風水膝腫千中封主膝腫見身濕解溪治膝股䯒腫銅見風復溜主腳後廉急不可前却承山承筋主腳筋急痛崑崙主腳如結踝如别銅作裂京骨承山承筋商丘主腳攣膀胱俞治拘急見足雜病膝痛餘見腳膝三里治膝䯒痠痛銅陽交治喉痺面腫寒痺膝䯒不收條口治膝䯒寒痠痛足緩履不收濕痺足下熱隂谷治膝痛如錐不得屈伸膀胱俞治腳膝無力見瘕癖合陽主膝股重隂交治腰膝拘攣髀關治膝寒明同不仁痿厥股內筋絡急陽陵泉治膝伸不得屈冷腳不仁偏風半身不遂腳冷無血色京骨治膝痛不得屈伸梁丘治寒痺膝不能屈伸陽關治膝外痛不可屈伸風痺不仁犢鼻治膝中痛不仁難跪起膝臏癕腫不潰可治潰者不治三隂交治膝股內痛見痃癖交信治膝脛內廉痛曲泉見疝膝關治膝內痛見風痺懸鍾治心腹脹滿胃熱不嗜食膝䯒痛筋攣足不收履坐不能久膝眼療膝冷痛不已明忌灸伏兔療膝冷見風勞豐隆療腿膝酸痺見尸厥合陽見脊治膝股重千銅云注膝䯒痠俠溪陽關主膝外廉痛膝關主膝內廉痛引臏不可屈伸連腹引喉痛中封主膝腫內踝前痛太衝主膝內踝前痛犢鼻主膝中痛不仁光明主膝痛脛熱不能行手足偏小明下云療膝脛痠痺不仁氣衝治腰痛不得俯仰見月事三里主膝痿痛見唾血風市療膝酸承山療膝重並見腰腳舍弟行一二里路膝必痠疼不可行須坐定以手撫摩久之而後能行後因多服附子而愈豫冬月膝亦痠疼灸犢鼻而愈以此見藥與灸不可偏廢也若灸膝關三里亦得但按其穴痠疼即是受病處灸之不拘腰腳痛餘見腰脊凡腰腳重痛刺委中出血久固宿疹亦皆立已次􅐎主腰下至足不仁並千隂市療腰腳如冷水明見疝承山治腰背痛腳腨重戰栗不能立腳氣膝下腫申脈治腰痛不能舉體足䯒寒不能久立坐如在舟車中崑崙治腰尻痛千作踵足腨千作跟腫不得履地下崑崙療腰疼偏風半身不遂腳重疼不得履地明膀胱俞療腰足不仁見脊僕參療腰痛不可舉承山下重腳痿下地機療腰痛不可俯仰足痺痛屈伸難風市療冷痺腳脛麻腿膝酸痛腰尻重起坐難承山療腳腨酸痛不能久立腰膝重起坐難筋攣急不可屈伸張仲文療腰重痛不可轉起坐難及冷痺腳筋攣不可屈伸灸曲踿兩文頭左右腳四處各三壯每灸一腳二火齊下燒才到肉初覺痛便用二人兩邊齊吹至火滅午時著艾至人定自行動藏腑一兩回或藏腑轉如雷聲立愈神效上廉治腰腿手足不仁見偏風陽輔治腰溶溶如坐水中膝下膚腫筋攣諸節盡痛無常處腋腫瘻馬刀喉痺膝䯒痠風痺不仁隂交治腰膝拘攣見疝仁夀宫備身患腳奉敕針環跳陽陵泉巨虛下廉陽輔即起行大理趙卿患風腰腳不隨不得跪起針上􅐎環跳陽陵泉巨虛下廉各二穴即得跪起治冷痺脛膝疼腰足攣急足冷氣上不能久立手足沉重日覺羸瘦此名復連病宜灸懸鐘絶骨一灸即愈見身濕痺千金千金翼溫腎湯主腰脊膝腳浮腫不隨茯苓乾薑澤㵼各二兩桂心三兩銼每服四五錢重水二盞煎八分盞服日三二服然則腰腳等病亦當服藥不可專恃灸云腰痛腰强腰屈隂包治腰尻引小腹痛明下云腰痛連小腹腫小便不利遺溺不禁銅居髎治腰引小腹痛見手痛胞肓治腰痛惡寒小腹堅急癃閉重不得小便澀痛腰背卒痛秩邊治腰痛不能俯仰小便赤澀腰尻重不能舉明同委中治腰重不舉體見腰脊白環俞治腰髖疼腳膝不遂肩井治因撲傷腰髖疼腰俞治腰髖疼脊强不得轉命門主腰腹相引痛見瘈瘲肺俞治腰背强痛隂陵泉水腫大腸俞治腰痛明同下髎治腰痛不得轉側陽輔治腰如坐水見膝痛明下隂市療腰如冷水見疝隂市療腰腳如冷水見疝涌泉治腰痛大便難京門治腰痛不得俯仰寒熱䐜脹引背不得息肝俞療腰痛肩疼明腎俞見勞氣海俞中膂俞見脊療腰痛關元俞膀胱俞療風勞腰痛胞肓療惡氣腰背卒痛下云腰痛不可忍俯仰難惡寒小便澀崑崙療腰尻重不欲起俯仰難惡聞人音下風市療腰尻重起難見腰腳腎俞療腰痛不可俯仰轉側難下腰俞療腰疼不能久立腰已下至足不仁坐起難腰脊急强不可俯仰腰重如石難舉動張仲文灸腰痛見腰腳四支寒熱腰疼不得俯仰身黃腹滿食嘔舌根直灸第十一椎上及左右各一寸五分三處各七壯千腰俞膀胱俞長强氣衝上􅐎下􅐎居髎主腰痛三里隂市陽輔蠡溝主腰痛不可顧申脈太衝陽蹻主腰痛不能舉委陽殷間太白隂陵泉行間銅同主腰痛不可俯仰甲云委陽殷門主腰痛得俯不得仰束骨飛揚承筋主腰痛如折陽輔主腰痛如錘居中腫痛不可咳咳則筋縮急諸節痛上下無常寒熱涌泉主腰痛大便難甲京門主腰痛不可久立甲腰背痛宜針決膝腰句畫中青赤絡脈出血便差十腰痛不得俯仰者令患人正立以竹拄地度至臍斷竹乃以度度背脊灸竹上頭處隨年壯灸訖藏竹勿令人得知腰痛灸腳跟上橫文中白肉際十壯良又灸足巨陽七壯巨陽在外踝下又灸腰目􅐎七壯在尻上約左右是又灸八窖及外踝上骨約中腰卒痛灸窮骨上一寸七壯左右一寸各灸七壯腰脊痛灸小腸俞五十壯見虛損腰背疼灸三焦俞隨年見勞有婦人久病而腰甚疼腰眼忌灸醫以針置火中令熱謬刺痛處初不深入既而疼止則知火不負人之說猶信云許知可因淮南大水忽腹中如水吼調治得愈自此腰痛不可屈伸思之此必腎經感水氣而得乃灸腎俞三七壯服麋茸丸愈豫謂腰痛不可屈伸灸腎俞自效不服麋茸丸亦可舍弟腰疼出入甚艱豫用火針微微頻刺腎俞則行履如故初不灸也屢有人腰背傴僂來覔㸃灸豫意其是筋病使然為㸃陽陵泉令歸灸即愈筋㑹陽陵泉也然則腰疼又不可專泥腎俞不灸其他穴也風池治腰傴僂引項筋無力不收銅肺俞治腰强見胸滿束骨治腰如折腨如結耳聾惡風寒目眩項不可顧目內眥赤爛白環俞治腰脊攣痛見腰脊痛腰脊痛餘見背痛委中主腰痛夾脊至頭几几然千凡腰腳重痛於此刺出血久痼宿疹亦皆立已大鍾主腰脊痛小腸俞中膂俞白環俞主腰脊疝痛次􅐎胞肓承筋主腰脊痛惡寒合陽主腰脊痛引腹承扶主腰脊尻臀股隂寒痛涌泉主腰脊相引如解志室京門主腰痛脊急明下同脾俞小腸俞膀胱俞腰俞神道谷中長强明下同大杼鬲關水分主腰脊急强腰俞療腰髖疼腰脊强不得轉明白環俞療腰脊攣痛大小便不利百病腰髖疼不遂腰中冷不識眠睡下云療腰脊急强不能俯仰起坐難手足不仁小便黃腰尻重不舉志室胞肓療腰脊痛急食不消腹堅急膀胱俞療脊急强腰至足酸重下神堂療腰脊急强逆氣上攻時噎大鍾見淋治腰脊强痛志室治腰脊强痛食飲不消腹堅急京骨見足痠中膂俞治腰脊不得俯仰見消渴明下云療腰痛不可俯仰夾脊膂痛上下按之應者從項後至此穴皆灸之立愈復溜治腰脊內引痛明下云腰痛引脊不得俯仰起坐目䀮䀮善怒多言舌乾涎自出足痿不收履䯒寒不自溫京骨治筋攣䯒痠髀樞痛頸項强腰脊不可俯仰委中治腰俠脊沈沈然遺溺腰重不能舉體風痹髀樞痛可出血痼疹皆愈又云熱病汗不出足熱厥逆滿膝不得屈伸取其經血立愈合陽治腰脊强引腹痛隂股熱膝䯒痠重履步難承扶治腰脊相引如解明下云療腰脊尻臀腰冷痛殷門治腰脊不可俯仰舉量惡血注之股外腫章門見腸鳴次髎治腰脊痛不得轉見疝懸樞治腰脊强明同不得屈伸三焦俞治肩背急腰脊强明下同不得俯仰膀胱俞治腰脊痛白環俞治腰脊攣痛大小便不利腰髖疼腳膝不遂溫瘧腰脊冷疼不得及卧勞損風虛史記太倉公告宋建曰君有病往四五日君要脅痛不可俯仰又不得小溲不亟治病即入濡腎及其未舍五藏急治之病方今客腎濡此所謂腎痺也宋建曰建故有腰脊痛往四五日弄石不能起即復置之暮腰脊痛不得溺至今不愈建病得之好持重即為柔湯使服之十八日而病愈然則腰脊傷持重得病而入腎灸腎俞可也脊痛餘見腰脊風痤反張五處身柱委中委陽崑崙主脊强反折瘈瘲癲疾千鬲關等主脊强見背痛崑崙主脊强背尻骨重京門石關主脊痓反折隂谷主脊內廉痛至陽療脊急强明章門見水腫鬲俞背痛胃倉腹脹大腸俞治脊强不得俯仰銅胃俞治脊痛銅見腹脹明下同脾俞大腸俞主腹中氣脹引脊痛食多身瘦名曰食晦先取脾俞後取季肋干膀胱俞療脊急强見腰脊赤白泄洞利腰脊痛小腸俞五十壯見寒熱氣穴治資氣上下引腰脊痛見月事腰俞主月閉溺赤脊强互引反折汗不出中膂俞治腎虛消渴腰脊不得俯仰見消渴明下云夾脊膂痛上下按之應者從項後至此穴皆灸之立愈見腰脊腠理附分治肩背急風冷客於腠頸項强痛不得顧陽白治背腠寒栗重衣不得溫銅次髎治背腠寒肝俞療腠中痛明下次髎療腰下至足不仁背腠寒小便赤淋心下堅脹見疝史記扁鵲之言曰疾居腠理湯尉之所及也在血脈針石之所及也在腸胃酒醪之所及也其在骨髓雖司命無奈之何也夫疾之在骨髓蓋始於居腠理也使居腠理而能治雖非聖人之治於無病亦賢者治將病也齊元侯乃以醫為好利欲治不疾以為功而卒至於不可救不特齊侯為然人皆然也吾故載扁鵲之言於腠理之未以戒人亦使醫者當治人於將病焉耳骨疼骨髓鬲俞見痰紫宫玉堂並見心煩療骨疼明上關主引骨痛千見瘈瘲骨痛灸絶骨五十壯見上氣商丘主骨痺煩滿鬲俞主皮肉骨痛見傷寒寒熱太白治骨痛見傷寒頭痛復溜治骨寒熱見寒熱骨髓冷疼上廉七十壯千骨㑹大杼禁灸骨病治此髓㑹絶骨髓病治此難疏病在骨髓秦越人以為司命無奈之何則骨髓有病病亦惙矣八十一難經疏乃云骨㑹大杼骨病治此髓會絶骨髓病治此是尚有針灸法矣可不針灸乎但明堂上經云大杼禁灸而銅人經云可灸七壯明堂下經云可灸五壯素問亦同諸經既同惟明堂獨異灸之可也况明堂經固云禁穴許灸三壯乎艾炷若小一二七壯亦可更灸上廉絶骨等穴尤佳針灸資生經卷五
