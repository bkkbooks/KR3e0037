body:
  text: 針灸資生經卷五臍痛中極療臍下塊如覆杯明見杯銅云結如覆杯見杯關元治臍下㽲痛小便赤澀不覺遺瀝小便處痛狀如散火溺血暴疝痛臍下結血狀如覆杯明同轉胞不得銅隂交治臍下㽲痛女子月事不絶帶下産後惡露不止繞臍冷痛中封見瘧水分見水腫神闕見瀉治繞臍痛曲泉主痛引臍中千見疝豫舊苦臍中疼則欲溏㵼常以手中指按之少止或正㵼下亦按之則不疼它日灸臍中遂不疼矣後義嘗溏利不已灸之則止凡臍疼者宜灸神闕關門治氣遊走夾臍急見積氣下腕治臍上厥氣動見腹痛氣海治臍下冷氣上衝心血結成塊狀如覆杯小便赤澀腹結治繞臍痛上搶心千同腹寒泄利咳逆天樞治夾臍切痛時上衝心煩滿嘔吐霍亂明下云冷氣臍痛見冷氣千云冬感寒臍痛見㵼外陵主心如懸下引臍腹痛千見腹痛上廉治夾臍腹痛見脅痛四滿治歷下切痛見積聚分水療水腫繞臍痛明下小兒臍腫灸腰後對臍骨節閒三壯然谷主兒臍風口不開銅同善驚繞臍絞痛灸天樞百壯千見癥瘕臍下絞痛灸關元百壯見腹寒熱臍中石門等主疝繞臍臍中石門天樞主臍疝繞臍蠡溝療臍中積氣千並見疝膺痛玉堂療胸滿膺痛見心煩玉堂治胸膺骨疼紫宫治胸膺骨疼大溪治乳腫賁膺並見胸脅痛胸滿胸脅滿龜胸凡胸滿短氣不得汗皆針補手太隂以出汗千又見霍亂神堂主胸腹滿三閒主胸滿腸鳴陽溪天容主胸滿不得息曲池人迎神道章門中府明下同臨泣天池璇璣府俞主胸中滿陽交主胸滿腫鳩尾主胸滿咳逆大泉主胸滿噭呼胸膺痛巨闕閒使主胸中淡淡梁門主胸下積氣期門缺盆主胸中熱息賁脅下氣上雲門主胸中暴逆心俞大杼主胸中鬱鬱然谷主胸中寒脉代時不至寸口小腹脹上搶心胸脅滿灸期門見心痛玉堂見心煩療胸滿膺痛明三閒療胸滿腹鳴亶中見肺癰療胸中氣滿如塞乳根療胸下滿悶陽交見療痛臨泣見腋腫治胸滿委陽治胸滿膨膨銅見尸厥璇璣治胸皮滿痛明同下云胸脅支滿俞府治胸滿見喘商陽治胸中氣滿喘咳支腫鬲關治胸中噎悶見背痛陽溪神封治胸滿不得息咳逆肺俞治胸中氣滿背僂如龜腰强頭目眩令人失顏色輒筋治胸中暴滿不得卧喘息鬲俞治胸滿支腫見嘔吐胃俞治胸脅支滿見腹脹涌泉神堂治胸腹滿見肩痛中庭治胸脅支滿噎塞食不下嘔吐食還出雲門治喉痹胸煩滿氣上衝心咳喘不得息胸脅短氣肩痛不得舉臂天池治胸中有聲見鬲病曲池治胸中煩滿胸鄉治胸脅滿引胸背痛不得明下有卧字轉側周榮治胸脅滿不得俯仰食不下咳唾稠膿明下同彧中治胸脅支滿咳逆喘不能食明同神藏治胸脅支滿咳逆喘不得息嘔吐胸滿不嗜食明同氣户治胸脅支滿喘逆上氣胸背急不得息不知食味食竇治胸脅支滿膈閒雷鳴常有水聲靈墟治胸脅支滿痛引胸不得息咳逆嘔吐胸滿不嗜食明同步郎治胸脅支滿鼻塞不通呼吸少氣喘息不得舉臂明同章門治胸脅支滿見腸鳴庫房治胸脅支滿咳逆上氣多唾濁沫膿血期門治産後胸脅支滿見心痛外丘治胸脅脹滿俠溪治胸脅支滿寒熱汗不出雲門療胸脅徹背痛見上氣華蓋療胸脅滿痛引胸明見喘紫宫見心煩中庭見反胃涌泉治胸脅支滿通谷章門曲泉鬲俞期門食竇明所陷谷石門主胸脅支滿千胃俞三里紫宫華蓋中庭神藏靈墟俠溪步郎商陽上廉氣户周榮上管勞官涌泉陽陵泉主胸脅注滿膽俞明下同章門主脅痛不得卧胸滿歐無所出前谷主咳而胸滿陽氣逆上滿胸取天容見上氣肺俞巨闕主胸滿見上氣太泉治胸脅支滿銅見心痛天髎治胸中煩悶見肩背肝俞療兩脅滿明見咳浮白療胸滿庫房療胸腹兩脅滿見咳天池治寒熱胸鬲煩滿頭痛四支不舉腋下腫上氣胸中有聲喉鳴膺忩治胸滿短氣魂門療胸背痛見尸厥小兒龜胸緣肺熱脹滿攻胸鬲所生又緣乳母食熱麵五辛胸轉起髙灸兩乳前各寸半上兩行三骨罅閒六處各三壯春夏從下灸上秋冬從上灸下若不依此法灸十不愈一二胸脅痛胸痹痛餘見胸滿本神顱息主胸脅相引不得傾側千太白主胸脅脹切痛陽輔主胸脅痛環跳至隂主胸脅痛無常處腰脅相引急痛大包主胸脅中痛豐隆又見腹痛丘墟主胸痛如刺胸脅滿心痛灸期門隨年壯乳根主胸下滿痛亶中百壯天井主胸痹心痛太泉主胸膺痛肺俞雲門中府隱白期門魂門大陵主胸中痛少衝主胸痛口熱胸中痛引腰背心下嘔逆面無滋潤灸幽門隨年壯冗在俠巨闕兩邊相去各半寸一云一寸經渠丘墟主胸背急胸中彭太溪治胸滿痛乳腫賁膺咳逆上氣喉中作聲銅肝俞治咳引胸痛見咳逆少衝見傷寒中府治胸痛見肺急乳根治胸滿痛華蓋治胸脅支滿痛引胸中咳逆上氣喘不能言明下同紫宫治胸脅支滿胸膺骨疼飲食不下嘔逆上氣煩心玉堂治胸滿不得喘息胸膺骨疼嘔吐寒痰上氣煩心幽門治胸中引痛心下煩悶逆氣裏急支滿不嗜食數咳健忘豐隆治厥逆胸痛如刺腹切痛明云氣刺不可忍見四支厥太淵治胸痹逆氣寒厥善噦嘔飲水咳嗽煩怒不得卧胸痹引背時寒閒使主之千閒使主胸痹背相引臨注主胸痹不得息魚際主痹走胸不得息浮白療胸滿胸痛明見咳逆俞府療胸中痛下胸痹心痛不得息痛無常處臨泣主之胸痹灸胸堂見上氣廉泉見上氣中府見咳主胸痛膽俞治胸脅不能轉銅明云胸脅滿見乾嘔丘墟治胸脅滿痛不得息明下云胸滿見太息下廉治胸脅小腹痛大包治胸脅痛見上氣腎俞主兩脅引痛千肝俞脾俞志室主兩脅急痛支溝主脅腋急痛中管承滿主脅下堅痛腕骨陽谷主脅痛不得息膽俞章門主脅痛不得卧竅隂主脅痛咳逆尺澤少澤主短氣脅痛心煩關元期門少商主脅下脹極泉治脅下滿痛銅鬲俞見嘔吐中膂俞見消渴竅隂見咳逆陽谷顱𩕄治脅痛見寒熱肝俞治兩脅急痛見咳逆腕骨治脅下痛不得息腎俞治脅滿引小腹痛見勞瘵上廉治飱泄腹脅痛滿狂走俠臍腹痛食不化喘息不能行太溪治腹脅痛連脊手足厥冷雲門療胸脅徹背痛華蓋療胸脅痛見胸滿三里主脅鬲痛鬲痛五噎氣哽承滿乳根療鬲氣明見噎亶中療胸鬲悶咳嗽氣短喉鳴下鬲俞療鬲痛見痃癖商陽療胸鬲氣滿見喘足臨泣療胸鬲滿悶下見頰痛胸中鬲氣聚痛好吐灸厥隂俞隨年壯十隱白見嘔吐巨闕主鬲中不利明下同食竇銅同主鬲中雷鳴察察隱隱常有水聲明下云療鬲間鳴滀陸常有水聲胸鬲中氣灸闕俞隨年壯天池治胸鬲煩滿銅見胸滿亶中治鬲氣嘔吐涎沫率谷見痰鬲俞治鬲胃寒痰見嘔吐扶突等主氣哽千見喉鳴天突療氣鯁鯁明下見頭項腫章門療噎見積氣中庭治胸脅支滿噎塞銅大鍾治食噎不下見淋關衝見霍亂天突治胸中氣噎見咳逆上氣亶中治胸中如塞明下岐伯云積氣成乾噎天突見嗽關衝見吐㵼治氣噎明乳根療鬲氣不下食噎病譩嘻療久瘧背氣滿悶胸中氣噎下神堂見脊中府見肺氣療善噎下背痛胸背背脊餘見肩背勞瘵經渠丘墟主胸背急千附分主背痛引頭明下引頷鬲關秩邊京骨主背惡寒痛脊强難俯仰崑崙主脊强背尻骨重鬲俞治背痛惡寒脊强俯仰難食飲不下嘔噦多涎唾胸噎悶銅意舍治明下有胸脅脹漓背痛惡風寒食不下嘔吐巨骨治背髆痛胸中有瘀血肩背不得屈伸而痛魄户治背膊痛見上氣神堂治背脊强急見肩痛氣户治胸背急見胸脅滿大椎治氣疰背髆拘急承筋治腰背拘急不容治胸背相引痛見痃癖經渠治胸背拘急胸滿膨膨見瘧魚際治痹走胸背痛見寒熱魄戶療背胛悶明見勞下同下云療肩膊間急痛背氣不能引顧咳逆上喘胃俞療背中氣上下行脊痛腹鳴下志室療背痛俯仰不得背痛灸巨闕等或灸胸堂千並上氣肺俞治背僂如龜背生時被客風拍著脊骨達於髓所致灸肺俞心俞鬲俞各三壯譩嘻療溫瘧寒瘧病瘧背悶氣滿腹脹氣眩明胸中痛引腰背千見胸脅列缺主胸背寒栗見肩痹魚際治痹走胸背痛銅見寒熱雲門療胸脅徹背痛明見上氣背疼乃作勞所致技藝之人與士女刻苦者多有此患士之書學女之針指皆刻苦而成背疼矣色勞者亦患之晉之景公是也惟膏肓為要穴豫嘗於膏肓之側去脊骨四寸半隱隱微疼按之則疼甚謾以小艾灸三壯即不疼它日復連肩上疼却灸肩疼處愈方知千金方之阿是穴猶信云千每遇熱膏肓穴所在多出冷汗數年矣因灸而愈肩背酸痛肩髆肩臂餘見胸痛浮白治肩背不舉銅神堂療肩背連胸痛不可俯仰明下商陽治肩背急引缺盆痛見頷腫譩嘻治溫瘧肩背痛見鼻衄中府治肩背痛見肺氣附分治肩背急見腠理神堂治肩痛胸腹滿灑淅寒熱脊背急明同三焦俞治肩背急腰脊强不得俯仰涌泉主肩背頸項痛千天牖缺盆神道大杼天突水道巨骨主肩背痛鬲俞譩嘻京門尺澤主肩背寒痓肩甲內廉痛天柱治肩背痛欲折銅肝俞見腰痛療肩疼明曲垣治肩痛周痹明同氣注肩髆拘急疼悶銅肩外俞治肩痹熱痛而寒至肘明同下云療肩痛發寒熱引項强肩井治頸項不得顧肩髆悶兩手不得向頭或因撲傷雲門見胸滿秉風治肩痛不能舉肩貞治肩中熱痛見風痹天宗治肩胛痛天忩明下同治肩痛引項不得顧前谷療膊胛小指痛養老療肩欲折下見臂青靈療肩不舉不能帶衣肩髎療肩重不舉見臂養老天柱主肩痛欲折天井主肩痛不可屈伸曲池天窖主肩重痛不舉巨骨主肩中痛不能動搖明下同肩外俞主肩甲痛而寒至肘後溪主肩臑痛淵腋主肩腋前痛與胸相引天髎治肩肘痛引頸項急寒熱缺盆中痛汗不出胸中煩悶銅章門治厥逆肩臂不舉青靈治肩臂不舉不能帶衣肩髎治肩重不能舉臂肘巨骨治肩臂不得屈伸見背痛居髎治肩引胸臂急見手痛臑腧治寒熱肩腫引胛中痛臂酸無力支溝療肩臂酸重見腋關衝主肩臂酸重腕骨主肩臂疼天宗主肩重臂痛章門治厥逆肩臂不舉銅青靈治肩臂不舉不能帶衣肩髎治肩重不能舉臂肘巨骨治肩臂不得屈伸見背痛關衝主肩臂酸痛支溝療肩臂酸重明下見腋列缺主肩背寒栗少氣不足以息寒厥交兩手而鶩凡實則肩背熱背汗出四支暴腫虛則肩寒栗氣不足以息天井療頸項及肩背痛見肘痛腰背痛灸三焦俞大椎治背膊急見勞下焦俞療背痛身熱肩背酸疼諸家針灸之詳矣當隨病證針灸之或背上先疼遂率引肩上疼者乃是膏肓為患千金外臺固云按之自覺牽引於肩中是也當灸膏肓俞則肩背自不疼矣豫嘗肩背痛已灸膏肓肩痛猶未巳遂灸肩井三壯而愈以此知雖灸膏肓而他處亦不可不灸云肩痹痛不仁不舉天井主肩痛痿痹不仁不可屈伸肩肉麻木曲垣主肩甲周痹肩貞肩髃關衝主肩中熱頭不可顧曲池天窖主肩重痛不舉清冷泉明同陽谷主肩不舉不得帶衣天井療肘痛引肩不屈伸見肘肩外俞治肩痹曲垣治肩痛周痹並見肩背兩肩頭冷疼尤不可忽豫屢見將中風人臂骨脫臼不與肩相連接多有治不愈者要之才覺肩上冷疼必先灸肩髃等穴毋使至於此極可也豫中年每遇寒月肩上多冷常以手掌心撫摩之夜卧則多以被擁之僅能不冷後灸肩髃方免此患蓋肩髃係兩手之安否環跳係兩足之安否不可不灸也臂痛臂無力曲池療肘臂偏細明下見肘肩髃療臂細無力痠疼臂冷而緩明臂臑肩髃療臂細無力手不得向頭少海見瘰癧乳根聽宫療臂疼中渚孔最支正肘髎療肘臂酸痛見肘痛閒使療臂腫痛屈伸難下肩髎療肩重不舉臂痛扁骨即肩髃療肩中熱指臂痛乳根治臂腫銅太淵治臂內廉痛居髎治腰引小腹痛肩引胸臂攣急手臂不得舉而至肩臂臑見瘰癧肘髎治臂痛不舉