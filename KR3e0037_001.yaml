body:
  text: 針灸資生經卷一神庭一穴在鼻直入髮際五分灸二七壯止七七壯岐伯曰凡欲療風勿令灸多緣風性輕多即傷惟宜灸七壯止三七壯禁針針即發狂忌生泠雞猪羊酒麵動風等物明堂云舉火之時忌熱食不宜熱衣上星自此以下不言一穴在鼻直上入髮際一寸陷中明堂云容豆是以細三稜針之即宣泄諸陽熱氣無令上衝頭目可灸七壯不宜多若頻灸即拔氣上令目不明忌同甲乙經熱穴論注並刺三分囟會在上星後明堂云上星上一寸陷中可灸二七壯至七七壯初灸即不痛病去即痛痛即罷灸針入二分此後去入字留三呼得氣即瀉若八嵗以下不得針緣𩕄門未合刺之不幸令人夭忌同素問注云刺四分豫少刻苦年踰壯則腦冷或飲酒過多則腦痛如破後因灸此穴非特腦不復冷他日酒醉腦亦不痛矣凡腦冷者宜灸此前頂在𩕄會後寸半骨陷中甄權云是一寸今依素問寸半為定針一分灸三壯止七七忌同素注云刺四分此後去問字百會一名三陽五會在前頂後寸半頂中央旋毛中可容豆灸七壯止七七凡灸頭頂不得過七壯緣頭頂皮薄灸不宜多針二分得氣即瀉唐秦鳴鶴刺微出血頭痛立愈素注云刺四分舊傳秦鳴鶴針高宗頭風武后曰豈有至尊頭上出血之理已而刺之微出血頭疼立止后亟取金帛賜之是知此穴能治頭風矣明堂經治中風言語蹇澀半身不遂凡灸七處亦先於百會北人始生子則灸此穴蓋防他日驚風也豫舊患心氣偶覩隂陽書有云人身有四穴最急應四百四病皆能治之百會蓋其一也因灸此穴而心氣愈後閲灸經此穴果主心煩驚悸健忘無心力自是間或灸之百病皆主不特治此數疾而已也一名天滿神聰四穴在百會四面各相去一寸理頭風目眩狂亂風癎左主如花右主如果針三分明堂有此四穴而銅人無之其穴治頭風目眩狂亂風癎亦所不可廢者故附入於此明堂一穴在鼻直上入髮際一寸理頭風多鼻涕鼻塞三日一報針二分按銅人明堂及諸家針灸經鼻直上入髮際一寸皆云上星穴明堂經於此復云明堂穴不知何所據且附入於此所謂疑以傳疑也今以諸經校勘上星穴者是後頂一名交衝在百會後寸半枕骨上灸五壯針二分明云四分後凡云明云者明堂經云也强間一名大羽在後頂後寸半針二分灸七壯明云五壯腦戶一名合顱在枕骨上强間後寸半禁針針令人啞可灸七壯亦不可妄灸令人夭明云灸令人失音針三分素注云四分甲乙云不可灸銅人云禁針素問明堂乃云針入三分四分亦可疑矣不如不針為穩素問蓋云刺腦户入腦立死故也風府一名舌本在頂後髮際上一寸大筋內宛宛中疾言其肉立起言休立下禁灸使人失音針三分明云四分留二呼又云舌緩針風府見下岐伯對黃帝傷寒之問曰巨陽者諸陽之屬也其脈連於風府故為諸陽主氣也然則風府者固傷寒所自起也北人皆以毛裹之南人怯弱者亦以帛護其項俗謂三角是也豫少怯弱春冬須數次感風自用物護後無此患矣凡怯弱者須護項後可也今婦人用帛蔽項名護項乃云蔽垢膩其名雖存其義亡矣啞門一作瘖一名舌橫一名舌厭在項中央入髮際五分宛宛中督脈陽維之會入繫舌本仰頭取之禁灸令人啞針三分素注云在項後髮際宛中去風府一寸明云舌急不言如何治答曰舌急針瘖門舌緩針風府得氣即瀉可小繞針入八分留三呼瀉五吸瀉盡更留針取之得氣即瀉曲差二穴在神庭兩旁寸半入髮際針三分灸三壯五處二穴在上星兩旁寸半針三分留七呼灸三壯明云五壯止承光二穴在五處後寸半針三分禁灸忌同明云在五處後二寸素注云一寸通天二穴在承光後寸半針三分留七呼灸三壯絡却二穴一名强陽又名腦蓋在通天後寸半灸三壯素注云刺三分留五呼玉枕二穴在絡却後寸半明上下云七分半俠腦戶腦戶在强間後寸半旁寸三分起肉枕骨入髮際上三寸灸三壯明云針三分素注云留三呼甲乙經云二分銅人云玉枕在絡却後一寸半明堂上下經皆云七分半若以銅人為誤則足太陽穴亦同若以明堂為誤不應上下經皆誤也小本明堂亦同豫按素問注云玉枕在絡却後七分則與明堂之七分半相去不逺矣固當從素問為凖然而玉枕二穴既夾腦户矣不應止七分則至於腦蓋也銅人之一寸半蓋有說焉識者當有以辨之今以諸經校勘在絡却後寸半者是天柱二穴夾頂後髮際大筋外廉陷中針五分得氣即瀉明云二分留三呼瀉五吸灸不及針日七壯至百五忌同下云三壯素注云刺二分眉衝二穴一名小竹當兩眉頭直上入髮際是療目五般癎頭痛鼻塞不灸通針三分明上明堂上經有眉衝穴而銅人經無之理目五般癎頭痛鼻塞等疾所不可廢者其穴與曲差相近故附於此臨泣二穴在目上直入髮際五分陷中針三分留七呼得氣即瀉忌同素注云灸五壯足少陽有臨泣穴矣此亦有之蓋此乃頭臨泣穴也目窗二穴在臨泣後一寸針三分灸五壯今附三度刺目大明正營二穴在目窗後一寸針三分灸五壯承靈二穴在正營後寸半灸三壯素注云刺三分腦空二穴一名顳顬在承靈後寸半夾玉枕骨下陷中針五分得氣即瀉灸三壯曺操患頭風發即心亂目眩華他針立愈忌同素注云按腦空在枕骨後枕骨上甲乙經作玉枕骨中風池二穴在腦空後髮際陷中針七分留七呼灸三壯明云在項後髮際陷中甲乙經云腦空後髮際陷中針寸二分大患風者先補後瀉少可患者以經取之留五呼瀉七吸灸不及針日七壯至百五艾炷不用大忌同當陽二穴當童人直上入髮際一寸療卒不識人風眩鼻塞針三分明下銅人無當陽穴而明堂下經有之理卒不識人風眩鼻塞等疾亦不可廢者其穴與臨泣相近故附入於此頷厭二穴在曲周下足少陽穴無下字明堂同腦空上亷灸三壯針七分留七呼忌同明云二分素注云在曲角下腦空之上上廉刺七分若深令人耳無所聞懸顱二穴在曲周上足少陽穴同明堂無上字腦空中灸三壯針三分留三呼明云二分素注云在曲角上腦空下亷新校正云按後手少陽中云角上此云角下必有一誤懸顱二穴在曲角上是懸釐二穴在曲周上足少陽穴無上字腦空下廉針三分灸三壯天衝二穴在耳上如前三寸足少陽穴同灸七壯針三分率谷二穴在耳上入髮際寸半陷者宛宛中灸三壯針三分明下云嚼而取之曲鬢二穴在耳上髮際曲隅陷中鼓頷有空明作穴針三分灸七壯明下云曲髮灸三壯指迷在耳上將耳掩前正尖上銅人云曲鬢足少陽穴同素問亦同明堂下經云曲髮疑髮字誤也曲鬢穴是曲髮字誤角孫二穴在耳郭中間上開口有空明作穴治目生膚髮齒齗腫灸三壯明堂别無療病法明云主齒牙不嚼物齲痛腫針八分按明堂云角孫主齒牙不嚼物齲痛腫則有療病法矣銅人闕曰三壯若灸可艾炷如小雀糞風水面腫針此一六出水盡頓愈忌同明云日灸三壯至二百罷若是水氣唯得針此穴若針餘穴水盡即死下云灸五壯兊端在唇上端針二分灸三壯炷如大麥明下云在頥前下脣下開口取之齗交在脣內齒上齗縫筋中針三分灸三壯承漿一名懸漿在頥前脣下宛宛中日灸七壯止七七灸即血脈通宣其風立愈炷依小筋頭作針三分得氣即瀉忌同明云頥前下脣之下針三分半得氣即瀉瀉盡更留三呼徐徐引氣而出日灸七壯過七七停四五日後灸七七若一向灸恐足陽明脉斷令風不差停息復灸令血脈通宣其風立愈下云下唇稜下宛中亷泉一名舌本在頷下結喉下明云舌本間灸三壯針三分得氣即瀉明云二分千云當頥直下骨後陷中攢竹二穴一名始光一名光明一名員柱在兩眉頭少陷宛宛中不宜灸針一分留三呼瀉三吸徐徐出針宜以細三稜針刺之宣泄熱氣三度刺目大明忌同明云宜細三稜針針三分出血下云灸一壯睛明二穴一名淚孔在目內眥針寸半留三呼雀目者可久留針然后速出禁灸忌同明云目內眥頭外畔陷宛宛中針分半留三呼補不宜灸一云在目內眥外一分按明堂云針一分半銅人乃云入一寸半二者必有一誤豫觀面部所針淺者入一分深者四分爾而素問氣府注亦云刺入一分則是銅人誤寫一分為一寸也巨髎二穴夾鼻孔旁八分直目瞳子蹻脈足陽明之會針三分得氣即瀉灸七壯明云巨窖在鼻孔下夾水溝旁八分蹻脈足陽明之會針三分灸七七壯迎香二穴在禾髎上一寸鼻下孔旁五分針三分留三呼不宜灸忌同禾髎二穴在鼻孔下夾水溝旁五分針二分又手陽明穴云禾髎一名長頻直鼻孔夾水溝旁五分明云和窖在鼻孔下夾水溝旁五分下云禾窖在鼻孔下夾水溝旁五分灸三壯銅人經禾髎二穴在鼻孔下夾水溝旁五分明堂下經作禾窖窖即髎也上經乃作和窖皆云在鼻孔下夾水溝旁五分則是一穴也而銅人手少陽穴復有和窖二穴在耳前兑素問作鋭髮陷中其穴相去逺矣恐明堂上經誤寫禾字作和字也今以諸經校勘禾髎穴者是陽白二穴在眉上一寸直目瞳子灸三壯針入二分承泣二穴在目下七分直目瞳子陷中禁針針之令人目烏色可灸三壯炷如大麥忌同明云針入四分半得氣即瀉特不宜灸若灸無問多少三日後眼下大如拳息肉日加長如桃大至三十日定不見物妨或如五升許大銅人云此穴可灸三壯禁針針之令人目烏色明堂乃云針入四分半特不宜灸灸後眼下大如拳二家必各有所據未知其孰是不針不灸可也四白二穴在目下一寸灸七壯針三分凡用針穩審方得下針深即令人目烏色地倉二穴夾口吻旁四分外如近下有脈微微動是也針三分明云針三分半留五呼得氣即瀉日可灸二七壯重者七七炷如粗叉腳大炷若大口轉喎却灸承漿七七即愈忌同大迎二穴在曲頷前寸二分骨陷中動脈又以口下當兩肩針三分留七呼灸三壯本神二冗在曲差旁寸半一云直耳上入髮際四分針二分灸七壯二說相去逺矣可疑千云耳正直上入髮際二分絲竹空二冗一名目髎在眉後陷中針三分留二呼宜瀉不宜補禁灸使人目小又令目無所見瞳子髎二冗在目外眥五分灸三壯針三分素注在目外去眥五分千注一名太陽一名前關顴髎二穴在面頰骨下亷兑骨端陷中針二分頭維二穴在額角入髮際本神旁寸半針三分禁灸本神在曲差旁寸半上關二穴一名客主人在耳前起骨上亷開口有空動脈宛宛中灸七壯艾炷不用大筯頭作炷若針必須側卧張口取之乃得禁針深問曰何以不得針深岐伯曰上關若刺深令人缺而不得㰦下關久留針即㰦而不得缺牙關急是故上關不得刺深下關不得久留針也明云客主二穴針入一分留之得氣即瀉日灸七壯至二百炷不用大其針灸之必須側卧張口取之乃得穴避風下云灸一壯按素問刺禁曰刺客主人內陷中脈為內漏為聾注云言刺太深則交脈破决故為耳內之漏脈內漏則氣不營故聾審若是又不止令人缺而不得㰦而已用針者所當知也下關二冗在上關下耳前動脈下亷合口有空開口即閉針入四分得氣即瀉禁灸又云下關不得久留針見上側卧閉口取穴前關二穴在目後半寸亦名太陽之穴理風赤眼頭痛目眩目澀不灸針三分明銅人有上關下關各二穴素問亦同但明堂上下經有上關而無下關惟上經有前關穴又不與下關穴同在上關之下恐别自是前關穴一名太陽穴理風赤眼頭痛目眩澀等疾所不可廢故附入於下關之後和髎二穴在耳前兊髮下橫動脈針七分灸三壯素注在耳前鋭髮下橫動脉和髎二穴在耳前鋭髮陷中明堂上經亦有和窖二穴窖即髎也在鼻孔下夾水溝旁五分即銅人之禾髎明堂下經之禾窖也或者明堂上經誤寫禾字作和字恐人以和髎和窖為一穴故備論之聽會二穴在耳微前陷中上關下一寸動脈宛宛中張口得之針七分留三呼得氣即瀉不須補日灸五壯止三七壯十日后依前報灸明云針三分忌冷食聼呵下云灸三壯一云聽呵前一云後名聽會一名聽呵耳門二穴在耳前起肉當耳缺者陷中針三分留三呼灸三壯明下云禁灸有病不過三壯聽宫二穴在耳中珠子大如赤小豆針三分灸三壯明云針一分頰車二穴在耳下曲頰端陷中針四分得氣即瀉日灸七壯止七七炷如大麥忌同明下云在耳下二韭葉陷中灸三壯又云耳下曲頰骨後千云一名機關在耳下八分小近前肩井二穴一名膊井在肩上陷明堂此有罅中二字缺盆上大骨前寸半以三指按取之當中指下陷中甲乙經云秪可針五分此膊井脉足陽明之會乃連入五藏氣若刺深則令人悶倒不識人即速須三里下氣先補不瀉須㬰平復如故凡針肩井皆以三里下其氣大良灸七壯明云針四分先補而後瀉特不宜灸針不得深深即令人悶若婦人胎落後微損手足弱者針肩井立差灸乃勝針日灸七壯止一百若針肩井必三里下氣如不灸三里即拔氣上明堂既云特不宜灸又云灸乃勝針日灸七壯至百壯罷則是又可灸矣不知何自畔其說也或者肩井不可灸惟胎落後手足弱者可灸耶天髎二穴在肩缺盆中上毖骨之際陷中央針八分灸三壯巨骨二穴在肩端上行兩義骨間陷中灸五壯針寸半明云巨骨一穴在心脾骨頭日灸三壯至七壯禁針針則倒懸一食頃乃得下針針入四分瀉之勿補針出始得正卧忌同下云巨骨二穴在肩端上兩行骨陷中灸一壯銅云云門在巨骨下夾氣户旁各二寸俞府在巨骨下璇璣旁各二寸氣户在巨骨下俞府兩旁各二寸銅人云巨骨一穴在肩端上兩義骨間明堂下經亦同但明堂上經云巨骨一穴在心脾骨頭不特一穴字不同而穴在心脾骨頭亦異豈其所謂一穴在心脾頭者非巨骨耶不然即是誤寫二字作一字肩胛為心脾也臑會二穴一名臑髎在肩前廉去肩頭三寸宛宛中針七分留三呼得氣即瀉灸七壯素注臂前亷肩端肩髃二穴在膊骨頭肩端兩骨間陷宛宛中舉臂取之灸七壯至二七以差為度若灸偏風不遂可七七壯不宜多恐手臂細若風病筋骨無力久不差灸不畏細也刺即泄肩臂熱氣唐厙狄欽患風痺手足不得伸甄權針此穴令將弓箭射之如故明云針八分留三呼瀉五吸灸不及針以平手取其穴日灸七壯增至二七若灸偏風不隨可至二百若更多灸恐手臂細若刺風痶風􅍙風病當其火艾不畏細也忌同千云肩頭正中兩骨間一名中肩井外臺名扁骨肩髎二穴在肩端臑上陷中舉臂取之針七分灸三壯明云五壯肩貞二穴在肩胛下兩骨解間肩髃後陷中針五分天宗二穴在秉風後大骨下陷中灸三壯針五分留六呼秉風二穴在肩上小髎後舉臂有空灸五壯針五分臑俞二穴在肩髎後大骨下胛上廉陷中針八分灸三壯素在肩臑後舉臂取之曲垣二穴在肩中央曲胛陷中按之應手痛灸三壯針五分明云九分肩外俞二穴在肩胛上廉去脊骨三寸陷中針六分灸三壯明上云一壯肩中俞二穴在肩胛內廉去脊二寸陷中針三分留七呼灸十壯大椎一穴一作顀在第一椎上陷者宛宛中針五分留三呼瀉五吸灸以年為壯明云日灸七壯至七七壯甲乙云大椎下至尾􅦡骨二十一椎長三尺折量取俞穴既曰大椎又曰在第一椎上陷中必是二穴非二穴則不言在第一椎上矣此大椎第一椎所以異也但銅人云大椎在第一椎上陷中諸經皆同惟明堂下經云在第一椎下陶道穴既在第一椎下不應大椎亦在第一椎下必是下經誤寫上字作下字也考之下經亦言陶道穴在大椎節下與銅人合足見其誤寫上字作下無疑矣陶道在大椎節下間俯而取之灸五壯針五分身柱在第三椎節下間針五分灸七七壯明云五壯下云三壯神道在五椎節下間俯而取之灸七七壯止百壯小兒風癎瘈瘲可灸七壯明云針五分灸三壯又云五壯靈臺在六椎節下間俯而取之經闕療病法出素問至陽在七椎節下間俯而取之針五分灸三壯明下云七壯筋縮在九椎節下間俯而取之針五分灸三壯明下云七壯脊中一名神宗在十一椎節下間俯而取之禁灸灸令人腰背傴僂針五分得氣即瀉明堂作脊俞一名脊中在十一椎中央接脊在十二椎下節間下經治小貌疳脫肛懸樞在十三椎節下間伏而取之針三分灸三壯明云在十二椎下節間下云十一椎下銅人云懸樞在十三椎節下間明堂上經作十二椎節間下經作十一椎下脊中穴既在十一椎下不應懸樞又在十一椎下固知其誤矣考之素問亦與銅人同當以銅人為正明堂上經亦誤三字作二字也要之接脊穴在十二椎節下爾命門一名屬纍在十四椎節下間伏而取之明作俯而取之針五分灸三壯陽關在十六椎下間伏而取之針五分灸三壯闕療病法出素問腰俞一名背解一名髓孔一名腰柱一名腰户在二十一椎節下間宛宛中以挺腹地舒身兩手相重支額縱四體後乃取其穴針八分留三呼瀉五吸灸七壯至七七壯忌房勞舉重强力甲乙云針二寸留七呼灸七七壯明云三壯下云五壯素注云針一分新校正云按甲乙經作二寸水熱穴注亦可二寸氣府論注骨空論注作一分一名髓空長强一名氣之隂郤督脈絡别其穴趺地取之甲乙云在脊骶端計三分轉針以大痛為度其穴趺地取之乃得灸不及針日三十壯止二百此痔根本是冷忌冷食房勞甲乙云針二寸留七呼明下云五壯自大椎至腰俞長同身寸三尺折量取穴甲有里醫言凡灸椎骨當灸骨節突處方驗灸節下當骨無驗以魚肉骨參之其言為可信盍依其言當骨節灸之大杼二穴在項後第一椎下兩旁相去各寸半陷中針五分可灸七壯甲乙同明云禁灸下經云灸五壯素同難疏骨會大杼骨病治此明堂云禁灸而銅人云可灸七壯必有說也要非大急不必灸風門二穴一名熱府在二椎下兩旁相去各寸半針五分留七呼今附若頻刺泄諸陽熱氣背永不發癰疽灸五壯肺俞二穴在三椎下兩旁各寸半自此後不寫相去二字針三分留七呼得氣即瀉出甲乙經甄權針經云在三椎下兩旁以搭手左取右右取左當中指末是穴針五分留七呼灸百壯明下云三壯千肺俞對乳引繩度之厥隂俞二穴在四椎下兩旁各寸半針三分灸七七壯千扁鵲云名闕俞心俞二穴在五椎下兩旁各寸半針三分留七呼得氣即瀉不可灸明下云灸五壯千云第七節對心橫三間銅人云心俞不可灸可針入三分世醫因此遂謂心俞禁灸但可針爾殊不知刺中心一日死乃素問之所戒豈可妄針耶千金言風中心急灸心俞百壯服續命湯又當權其緩急可也豈可泥不可灸之說而坐受斃耶督俞二穴一名高蓋在六椎下兩旁各寸半禁針通灸銅人經缺此穴明堂經有之今依明堂入在此恐銅人本不全也膈俞二穴在七椎下兩旁各寸半針三分留七呼灸三壯明下云五壯難疏血會膈俞血有病名此八椎下兩旁銅人明堂並缺俞穴肝俞二穴在九椎下兩旁各寸半針三分留六呼灸三壯明下云七壯素云刺中肝五日死膽俞二穴在十椎下兩旁各寸半正坐取之灸三壯針五分明云三分下經云灸五壯素刺中膽一日半死脾俞二穴在十一椎下兩旁各寸半針三分留七呼灸三壯明下云五壯素云刺中脾十日死胃俞二穴在十二椎下兩旁各寸半針三分留七呼灸隨年為壯明云三壯下云七壯三膲俞二穴在十三椎下兩旁各寸半針五分留七呼灸三壯明云針三分下云灸五壯腎俞二穴在十四椎下兩旁各寸半與臍平針三分留七呼灸以年為壯忌同明云三壯下云五壯刺腎六日死氣海俞二穴在十四椎下兩旁各寸半通灸按明堂有氣海俞而銅人無之恐銅人本不全故依明堂附入於此大腸俞二穴在十六椎下兩旁各寸半針三分留六呼灸二壯關元俞二穴在十七椎下兩旁各寸半針三分按明堂有關元俞而銅人無之恐銅人本不全故依明堂附入於此小腸俞二穴在十八椎下兩旁各寸半針三分留六呼灸三壯膀胱俞二穴在十九椎下兩旁各寸半針三分留六呼灸三壯明下云七壯中膂內俞二穴一名脊內俞在二十椎下兩旁各寸半俠脊起肉針三分留十呼灸三壯明下云主腰痛夾脊膂痛上下按之應者從項後至此穴痛皆灸之立愈白環俞二穴在二十一椎下兩旁各寸半甲乙云針如腰户法同挺腹地端身兩手相重支額縱息令皮膚俱緩乃取其穴針八分得氣即先瀉訖多補之不宜灸忌房勞不得舉重明下云灸三壯上髎二穴在第一空腰髁下俠脊陷中針三分灸七壯千云腰踝下一寸次髎二穴在第二空俠脊陷中可灸七壯針三分中髎二穴在第三空俠脊陷中針二分留十呼灸三壯下髎二穴在第四空俠脊陷中針二分留十呼灸三壯會陽二穴一名利機在隂尾骨兩旁針八分灸五壯千金八窖在腰目下三寸俠脊相去四寸兩邊四穴故名八􅐎其曰夾脊四寸是除脊各寸半也凡大杼下穴皆當除脊各寸半附分二穴在第二椎下附項內廉兩旁相去俠脊各三寸灸五壯針三分魄户二穴在三椎下兩旁各三寸正坐取之針五分得氣即瀉又宜久留針日灸七壯止百壯忌同明云日七壯至二百下云魂户在三椎下兩旁各三寸灸三壯又云魄戶在三椎下兩旁各三寸灸五壯素注云魄戶上直附分銅人有魄户穴明堂上經亦同而下經既有魄戶穴又有魂户穴皆云在三椎下若謂誤寫魄字作魂不應兩出魄戶穴也考之下經既有懸鍾矣後又有懸鍾既有天突矣其治小兒又有天突意者魂戶即魄戶誤作魂而兩出之不然何其穴皆在三椎旁歟膏肓俞二穴在四椎下明云近五椎兩旁各三寸主無所不療羸瘦虛損夢中失精上氣咳逆發狂健忘明云狂惑忘誤取穴之法令人正坐曲脊伸兩手以臂得動搖從胛骨上角摸􅟥至骨下頭其間當有四肋三間灸中間從胛骨之裏去胛骨容側指許摩胠去表肋間空處按之自覺牽引於肩中灸兩胛中一處至百壯多至五百明云六百壯多至千壯當覺下嚨嚨然似流水之狀亦當有所下出若得痰疾則無所不下也如病人已困不能正坐當令側卧挽上臂令取穴灸之又以右手從左肩上住指頭所不及者是穴也右取亦然乃以前法灸之若不能久坐當伸兩臂令人挽兩胛骨使相離不爾即胛骨覆其穴灸之無驗此灸訖後令人陽氣益盛當消息以自補養論曰昔在和緩不救晉侯之疾以其在膏之上肓之下針藥所不能及即此穴是也時人拙不能求得此穴所以宿病難追若能用心方便求得灸之無疾不愈出千金外臺灸膏肓功效諸經例能言之而取穴則未也千金等方之外莊綽論之最詳然繁而無統不能定於一豫嘗以意取之令病人兩手交在兩膊上灸時亦然胛骨遂開其穴立見以手指摸索第四椎下兩旁各三寸四肋三間之中間按之酸疼是穴灸至千百壯少亦七七壯當依千金立㸃立灸坐㸃坐灸卧㸃卧灸云若只合瓜在兩膝頭中㸃穴亦得神堂二穴在五椎下兩旁各三寸陷中正坐取之針三分灸五壯明下云三壯素注云上直魄戶餘同譩嘻二穴在肩膊內廉俠明堂作在六椎下兩旁各三寸正坐取之以手痛按之病者言譩嘻針六分留三呼瀉五吸灸二七壯止百忌莧菜白酒明下云五壯膈關二穴在七椎下兩旁各三寸陷中正坐取之針五分灸五壯魂門二穴在九椎下兩旁各三寸陷中正坐取之灸三壯針五分陽綱二穴在十椎下兩旁各三寸陷中正坐闊肩取之針五分灸三壯明下云七壯意舍二穴在十一椎下兩旁各三寸陷中正坐取之針五分灸五十壯至百壯明云五十壯至百二十壯甲乙云三壯針五分下云灸七壯素注二壯胃倉二穴在十二椎下兩旁各三寸針五分灸五十壯明云五十壯甲乙云三壯肓門二穴在十三椎下兩旁各三寸又肋間其明堂作異經云與鳩尾相直灸三十壯針五分志室二穴在十四椎下兩旁各三寸陷中正坐取之針五分灸三壯明下云兩旁各三寸半灸七壯明堂上經作兩旁各三寸與銅人經同而下經乃作三寸半必是分外半字也胞肓二穴在十九椎下兩旁各三寸陷中伏而取之灸五七壯針五分明云灸五七壯至五十壯甲乙云三壯下云五壯秩邊二穴在二十椎下兩旁各三寸陷中伏而取之灸三壯針五分忌同明云在二十椎下兩旁各三寸灸三壯針三分素問氣府論注曰秩邊在二十一椎下兩旁上直胞肓與銅人經明堂經二十椎下不同未知其孰是姑兩存之以上二十八穴當凖千金方除脊各三寸取穴天容二穴在耳下曲頰後灸三壯天牖二穴在頸筋缺盆上天容後天柱前完骨下髮際上明云髮際上一寸陷中針一寸留七呼不宜補亦不宜灸若灸面腫眼合先取譩嘻後針天牖風池即差若不先針譩嘻即難療明云針五分得氣即㵼㵼盡更留三呼瀉三吸不宜補亦不宜灸下云灸三壯素注同銅人明堂上經皆云不宜灸下經素問注乃云灸三壯恐凡禁穴許灸一壯至三壯也天窗二穴一名窗籠在頸大筋前曲頰下扶突後動脈應手陷中灸三壯針三分天鼎二穴在頸缺盆直扶突後一寸灸三壯針三分忌同明下云天鼎在頸缺盆直扶突氣舍後一寸陷中灸七壯素氣府注云天鼎在頸缺盆上直扶突氣舍後同身寸之半按甲乙經作寸半扶突二穴一名水穴在人迎後寸半灸三壯針三分素注在頸當曲頰下一寸人迎後仰而取之缺盆二穴一名天蓋在肩下橫骨陷中灸三壯針三分素云二分不宜刺太深使人逆息也明云肩上橫骨陷中素同一名天蓋肩上是穴銅人云在肩下橫骨陷中明堂乃云在肩上橫骨陷中又云肩上是穴恐銅人誤下字也人迎二穴一名五會在頸大筋動脈應手俠結喉旁仰而取之以候五藏氣足陽明脈氣所發禁灸灸之不幸傷人針四分水突一穴一名水門在頸大筋前直人迎下氣舍上針三分灸三壯氣舍二穴在頸直人迎俠天突陷中針三分灸三壯天突在結喉下夫宛宛中針五分留三呼得氣即瀉灸亦得即不及針其下針直橫下不得低手即五藏之氣傷人短夀忌同明下云在項結喉下五分中央宛宛中灸五壯素氣穴注云在項結喉下四寸中央宛宛中刺一寸灸三壯甲乙云在結喉下五寸明下灸小兒云結喉下三寸兩骨間千名天瞿五今校勘在結喉下寸是穴璇璣在天突下一寸陷中仰頭取之灸五壯針入三分華蓋在璇璣下一寸陷中仰頭取之針三分灸五壯明下云三壯一本云五壯紫宫在華蓋下一寸六分陷中仰頭取之灸五壯針三分明下云在華蓋下一寸灸七壯小本亦同玉堂一名玉英在紫宫下寸六分陷中灸五壯針三分膻中一作亶一名元兒在玉堂下一寸六分橫直兩乳間陷中仰卧取之灸七七壯禁針不幸令人夭明云日灸七壯止七七禁針不幸令人死甲乙云針三分下云灸三壯千云鳩尾上一寸靈蘭祕典云膻中者臣使之官喜樂出焉說者曰膻中為氣之海然心主為君以敷宣教令膻中主氣以氣布隂陽氣和志適則喜樂由生分布隂陽故官為臣使也然則膻中者乃十二藏之一臣使之官為氣之海分布隂陽非其他穴比者或患氣噎鬲氣肺氣上喘不得下食胸中如塞等疾宜灸此難疏氣會三焦外筋直兩乳間氣痛治此中庭在膻中下寸六分陷中灸五壯針三分明云二分下云膻中下一寸灸三壯腧府素作俞二穴在巨骨下璇璣旁各二寸陷中仰而取之明云仰卧取之針三分灸五壯明下云腧府灸三壯彧中二穴在腧府下寸六分陷中仰而取之明云仰卧取之針四分灸五壯明下云腧府下一寸灸三壯神藏二穴在彧中下寸六分陷中仰而取之灸五壯針三分靈墟二穴在神藏下寸六分陷中仰而取之針三分灸五壯神封二穴在靈墟下寸六分仰而取之灸五壯針三分步郎二穴在神封下寸六分陷中仰而取之針三分灸五壯氣户二穴在巨骨下俞府兩旁各二寸陷中仰而取之針三分灸五壯庫房二穴在氣户下寸六分陷中仰而取之灸五壯針三分屋翳二穴在庫房下寸六分陷中仰而取之灸五壯針二分膺窗二穴在屋翳下寸六分灸五壯針四分乳中二穴當乳是足陽明脈氣所發禁灸灸不幸生蝕瘡瘡中有清汁膿血可治瘡中有瘜肉若蝕瘡者死微刺三分亦相去寸六分乳根二穴在乳下寸六分陷中仰而取之灸五壯針三分以上十二穴去膺中行各四寸遞相去寸六分雲門二穴在巨骨下俠氣户旁各二寸陷中灸五壯針三分刺深使人氣逆不宜深刺明云雲門在巨骨下氣户兩旁各二寸陷中動脈應手舉臂取之山眺經云在人迎下第二骨間相去二寸三分通灸禁針甲乙云灸五壯針七分若深令人氣逆中府二穴一名膺中俞肺之募在雲門下一寸乳上三肋間針三分留五呼灸五壯素注在胸中行兩旁相去六寸雲門下一寸乳上三肋間動脈應手陷中仰而取之周榮二穴在中府下寸六分陷中仰而取之針四分明下云灸五壯胸鄉二穴在周榮下寸六分陷中仰而取之針四分灸五壯天溪二穴在胸鄉下寸六分陷中仰而取之針四分灸五壯食竇二穴在天溪下寸六分陷中舉臂取針四分灸五壯以上十二穴去膺中行各六寸六分淵腋二穴在腋下三寸宛宛中舉臂得之禁灸灸之不幸令人生腫蝕馬瘍內潰者死寒熱生馬瘍可消針三分輒筋二穴在腋下三寸復前一寸著脅灸三壯針六分天池二穴一名天會在乳後一寸腋下三寸著脅直腋撅肋間灸三壯針三分大包二穴在淵腋下三寸脾之大絡布胸脅中出九肋間灸三壯針三分鳩尾一名尾翳一名􅐳骭在臆前蔽骨下五分不可灸令人畢世少心力此穴大難針大好手方可下針不然取氣多令人夭針三分留三呼瀉五吸肥人倍之忌同明下云灸三壯素注在臆前蔽骨下五分不可灸刺人無蔽骨者從岐骨際下行一寸巨闕心之募在鳩尾下一寸鳩尾拒者少令强一寸中人有鳩尾拒之針六分留七呼得氣即瀉可灸七壯止七七忌同上脘一作管在巨闕下一寸當寸五分去蔽骨三寸明云去巨骨三寸針八分先補後瀉神驗如風癎熱病宜先瀉後補立愈日灸二七壯至百壯未愈倍之忌同明下云三壯千一名胃管中脘一名太倉胃之募在上脘下一寸上紀者中脘也針八分留七呼瀉五吸疾出針灸二七壯止百壯忌同明云日灸二七壯止四百千一名胃募在心下四寸胃管下一寸按氣穴論注云中脘居心蔽骨與臍之中上下各四寸刺入寸二分與銅人稍異宜從銅人為穩其曰胃之募蓋飲食蓄積於此也豫嘗苦脾疼嘗灸此穴覺冷氣從兩脅下而上至灸處即散此灸之功也自後頻灸之亦每教人灸此凡脾疼不可忍飲食全不進者皆宜灸難疏府會太倉府病治此在心下四寸建里在中脘下一寸針五分留十呼灸五壯明云針寸二分下脘在建里下一寸針八分留三呼㵼五吸灸二七壯止二百水分在下脘下一寸臍上一寸針八分留三呼瀉五吸若水病灸大良可灸七壯止百壯禁針針水盡即斃明云水分穴若水病灸大良日灸七壯止四百針五分留三呼明云水氣惟得針水溝針餘穴水盡即死何於此却云可針今校勘不針為是明堂云若是水病灸之大良針入五分而銅人云若是水病灸之大良禁不可針針水盡即斃是又不可針矣恐人但知明堂之可針不知銅人不可針也於是書之以示世醫云水分穴校之不針為是神闕一名氣合當臍中灸百壯禁針忌同素注禁刺刺之使人臍中惡瘍潰矢出者死不可治灸三壯臍中千金等經不言灸只云禁針銅人云宜灸百壯近世名醫遇人中風不省急灸臍中皆效徐伻平中不省得桃源簿為灸臍中百壯始蘇更數月乃不起鄭糾云有一親卒中風醫者為灸五百壯而蘇後年餘八十向使徐平灸至三五百壯安知其不永年耶論神闕穴多灸極是隂交一名橫户素問云在臍下一寸針八分得氣即瀉灸百壯止明云灸不及針日三七壯止百壯氣海一名脖胦一名下肓在臍下寸半宛宛中針八分得氣即瀉瀉後宜補之灸百壯今附氣海者是男子生氣之海也治藏氣虛憊真氣不足一切氣疾久不差皆灸之忌同明下云灸七壯此經以氣海為生氣之海難經疏以為元氣之海則氣海者蓋人之元氣所生也故栁公度曰吾養生無他術但不使元氣佐喜怒使氣海常溫爾今人既不能不以元氣佐喜怒矣若能時灸氣海使溫亦其次也豫舊多病常苦氣短醫者教灸氣海氣遂不促自是每歲須一二次灸之則以氣怯故也石門一名利機一名精露在臍下二寸灸亦良可灸二七壯止百壯婦人不可針針之終身絶子明云甲乙經云一名精露一名丹田一名命門針八分留三呼得氣即瀉下云灸七壯千云灸絶孕刺五分臍下二寸名石門明堂載甲乙經云一名丹田千金素問注亦謂丹田在臍下二寸世醫因是遂以石門為丹田誤矣丹田乃在臍下三寸難經疏論之詳而有據當以難經疏為正詳見關元銅人云針之絶子千金云灸之絶孕要之婦人不必針灸此論丹田穴當以臍下二寸為是關元在臍下三寸小腸之募足太隂少隂厥隂三隂任脉之會下紀者關元也針八分留三呼瀉五吸灸百壯止三百壯忌同明云若懷胎必不針若針而落胎胎多不出而針外崑崙立出灸不及針日三十壯下云五壯岐伯云但是積冷虛乏皆宜灸關元乃丹田也諸經不言惟難經疏云丹田在臍下三寸方圓四寸著脊梁兩腎間中央赤是也左青右白上黃下纍三寸法三光四寸法四時五色法五行兩腎間名大海而貯其血氣亦名大中極言取人身之上下四向最為中也老醫與人灸皆從此說多者千餘壯少亦三二百不知全活者幾何人然亦宜頻灸故曰若要安丹田三里不曾乾中極一名玉泉一名氣原在關元下一寸針八分留十呼得氣即瀉灸百壯止三百明云主婦人斷緒四度針銅人作以度針針即有子故却時任針也灸不及針日三七壯下云五壯曲骨在橫骨上毛際陷中灸七壯至七七針二寸明下云橫骨上中夾下一寸毛際陷中千云臍下五寸會隂一名屏翳在兩隂間任脈别絡俠督脈衝脈之會灸三壯幽門二穴俠巨闕兩旁各五分灸五壯針五分明云在巨闕旁各寸半陷中千腎藏云夾巨闕各一寸銅人云幽門夾巨闕肓俞夾臍旁各五分相去一寸明堂乃云幽門在巨闕旁寸半通天夾上管旁相去三寸按千金四滿第二行穴在丹田今石門兩邊各寸半與明堂合始知銅人誤云通谷二穴在幽門下一寸針五分灸五壯明云夾上管兩旁相去三寸下云灸三壯隂都二穴一名食宫在通谷下一寸灸三壯針三分石關二穴在隂都下一寸灸三壯針一寸商曲二穴在石關下一寸灸五壯針一寸肓俞二穴在商曲下一寸臍旁各五分灸五壯針一寸中注二穴在肓俞下一寸灸五壯針一寸四滿二穴一名髓府在中注下一寸針三分灸三壯千丹田旁各寸半即心下八寸臍下橫文是寸今校勘四滿二穴千金云在丹田旁各寸半即心下八臍下橫文是尤證得丹田在二寸氣穴二穴一名胞門一名子户在四滿下一寸灸五壯針三分大赫二穴一名隂維一名隂關在氣穴下一寸灸五壯針三分橫骨二穴在大赫下一寸灸三壯千云名屈骨端在隂上橫骨中宛曲如却月中央是以上二十二穴去腹中行皆當為寸半說見幽門不容二穴在幽門兩旁各寸半灸五壯針五分明云在上管兩旁各一寸灸三壯素注在第四肋端素問云夾鳩尾外當乳下三寸夾胃管各五不容至太一也夾臍廣三寸各三滑肉門天樞外陵也下臍二寸夾之各三大巨水道歸來也皆腹第三行穴也新校正云甲乙經天樞在臍旁各二寸與諸書同特此經為異信若是則其穴不當乳下可也必當乳下則廣三寸之說為當承滿二穴在不容下一寸針三分灸五壯明云三壯千夾巨闕兩旁各一寸半梁門二穴在承滿下一寸灸五壯針三分關門二穴在梁門下一寸針八分灸五壯太一二穴在關門下一寸灸五壯針八分滑肉門二穴在太乙下一寸灸五壯針八分下一寸至天樞天樞二穴一名長溪一名穀門大腸之募去肓俞寸半夾臍旁各二寸陷中灸五壯針五分留十呼千魂魄之舍不可針合臍相去各三寸外陵二穴在天樞下一寸灸五壯針三分大巨二穴在長溪下二寸灸五壯針五分長溪天樞也千在臍下一寸兩旁各二寸水道二穴在大巨下三寸灸五壯針三寸半歸來二穴在水道下二寸灸五壯針八分外臺水道下三寸今校勘歸來二穴在水道下二寸為是氣衝二穴一名氣街在歸來下鼠鼷上一寸動脈應手宛宛中禁針灸七壯立愈炷如大麥明下云五壯素注云在腹臍下橫骨兩端鼠鼷上針三分千云歸來下一寸以上二十四穴去腹中行當各三寸期門二穴肝之募在不容旁寸半直兩乳第二肋端針四分灸五壯千直兩乳下第二肋端旁寸半又云乳直下寸半日月二穴膽之募在期門下五分陷中灸五壯針五分千名神光一名膽募腹哀二穴在日月下寸半針三分大橫二穴在腹哀下三寸半直臍旁灸三壯針七分肓俞去臍旁當一寸半天樞去臍當三寸大橫去臍當四寸半其去章門合為六寸難經疏乃云章門在臍上二寸兩旁九寸為可疑焉耳腹結二穴一名腸窟在大橫下三分針七分灸五壯府舍二穴在腹結下三寸足太隂厥隂隂維之交會此三脈上下三入腹絡肝脾結心肺從脅上至肩此太隂郤三隂陽明之别針七分灸五壯衝門二穴一名慈宫上去大橫五寸府舍下橫骨兩端約中動脈針七分灸五壯以上十四穴去腹中行各當為四寸半章門二穴一名長平一名脅髎脾之募在大橫外直臍季肋端側卧屈上足伸下足舉臂取之針六分灸百壯明云日七壯止五百忌同難疏藏會季肋章門也藏病治此是脅骨下短肋在臍上二寸兩旁九寸京門二穴一名氣腧一名氣府腎之募在監骨腰中季肋本俠脊灸三壯針三分留七呼帶脈二穴在季脅下寸八分陷中針六分灸五壯明下云七壯如帶繞身管束諸經脈千云在季脅端五樞二穴在帶脈下三寸一云在水道旁寸半陷中針一寸灸五壯明下云三壯維道二穴在章門下五寸三分針八分灸三壯居髎二穴在章門下八寸三分監骨上陷中灸三壯針八分脅堂二穴在腋下二骨間陷中舉腋取之灸五壯明堂下經有脅堂穴主胸脅氣滿噫噦喘逆目黃逺視䀮䀮而銅人無之故附入於此少商二穴木也在手大指端內側去爪甲角如韭葉明云白肉際宛宛中以三稜針刺之微出血泄諸藏熱湊不宜灸成君綽忽腮頷腫大如升喉中閉塞水粒不下甄權針之立愈明云針一分留三呼㵼五吸宜針不宜灸以三稜針刺之令血出勝氣針所以勝氣針者此脈脹腮之候腮中有氣人不能食故刺出血以宣諸藏腠也忌冷熱食下云灸三壯甲乙作一壯魚際二穴火也在手大指本節後內側散脈中針一分留二呼素注二分灸三壯太淵二穴在掌後陷中灸三壯針一分素注二分明下云太泉在手中掌後橫文頭陷中灸五壯難掌後魚際下脉會太淵脉病治此銅人曰太淵明堂曰太泉疑是二穴也豫按千金方注云太泉即太淵也避唐祖名改之於是書之以示世醫泉脈清冷泉同經渠二穴金也在寸口陷中針二分留三呼禁灸灸傷人神列缺二穴在腕側上寸半明堂下云腕上一寸以手交叉頭指末兩筋兩骨罅中針二分留二呼瀉五吸灸七壯忌同明云針三分日灸七壯若患偏風灸至百若患腕勞灸七七下云三壯素注云腕上寸半孔最二穴在腕上七寸明下云隱者宛宛中手太隂治熱病汗不出此穴可灸三壯即汗出咳逆臂厥痛針三分灸五壯明下云灸三壯尺澤二穴水也在肘中約上動脈中針三分灸五壯明云肘中約上兩筋動脈中甄權云在臂屈伸橫文中筋骨罅陷中不宜灸主癲病不可向手臂不得上頭素刺禁云刺肘中內陷氣歸之為不屈伸注云肘中謂肘屈折之中尺澤穴中也刺過陷脈惡氣歸之氣閉關節故不屈伸難疏言尺之一寸外為尺澤也言尺脈入澤如水入大澤銅人云灸五壯明堂下經乃云不宜灸主癲病不可向手臂不得上頭既曰不宜灸矣乃曰主癲病是又可灸也此必有誤且從銅人灸五壯明堂亦云禁穴許灸一壯至三壯故也俠白二穴在天府下去肘五寸動脈中針三分灸五壯天府二穴在腋下三寸動脈中以鼻取之禁灸使人逆氣今附刺鼻衄血不止針四分留三呼明云四分留七呼灸二七壯不除至百壯出明堂經其甲乙經禁灸甲乙銅人皆云禁灸明堂乃云灸二七壯至百壯亦甚不同矣要非大急不必灸商陽二穴金也一名絶陽在手大指次指內側去爪甲角如韭葉灸三壯針一分留一呼二間二穴水也一名間谷在手大指次指本節前內側陷中針三分灸三壯三間二穴木也一名少谷在手大指次指本節後內側陷中針三分留三呼灸三壯合谷二穴一名虎口在手大指次指岐骨間陷中明云手大指兩骨罅間宛宛中針三分留三呼灸三壯今附若婦人妊娠不可刺刺損胎氣千云手大指虎口兩骨間陽溪二穴火也一名中魁在腕中上側兩筋間陷中針三分留七呼灸二壯忌同偏厯二穴手陽明絡在腕後三寸别走太隂針二分留七呼灸三壯明下云五壯溫溜二穴一名逆注一名池頭在腕後大士三寸小士六寸針三分灸三壯明云在腕後五寸六寸間下廉二穴在輔骨下去上廉一寸輔兑肉其分外針針五分留二呼灸三壯此有下廉足陽明亦有下廉蓋在足者乃下巨虛也上廉二穴在三里下一寸其分獨抵陽明之會外斜針五分灸五壯此有上廉足陽明亦有上廉蓋在足者乃上巨虛也三里二穴在曲池下三寸手陽明穴云二寸按之肉起兑肉之端灸三壯針二分明云一名手三里在曲池下二寸三里有二有手三里有足三里此手三里也故明堂云一名手三里是也銅人云三里在曲池下三寸明堂乃云二寸在手陽明穴亦云二寸恐銅人本誤二字作三字也曲池二穴土也在肘外輔骨屈肘曲中以手拱胸取之針七分得氣先瀉後補之灸大良可三壯明云曲池木也在肘外輔骨曲肘橫文頭陷中日灸七壯至二百且停十餘日更下火至二百罷忌同下云在肘外輔屈肘曲骨中紋頭素注肘外輔屈肘兩骨中千肘外曲頭陷中肘髎二穴在肘大骨外廉陷中灸三壯針三分五里二穴在肘上三寸行向裏大脈中央灸十壯禁針素氣穴論云大禁二十五在天府下五寸注云謂五里穴也謂之大禁者禁不可刺也又曰五里者尺澤之後五里與此文同五里有二其一在足厥隂肝經部與此穴為二此當為手五里也素問所謂在天府下者指此五里也注云尺澤之後五里指亦指此五里也天澤穴在手太隂臂臑二穴在肘上七寸㬷肉端手陽明絡灸三壯針三分明云在肩髃下一云兩筋兩骨罅陷宛中平手取之不得拏手令急其穴即閉宜灸不宜針日七壯至百若針不得過三五過多恐惡忌同千名頭衝肩髎在肩部少衝二穴木也一名經始在小指內廉端明下作側去爪甲角如韭葉針一分灸三壯明云一壯少府二穴火也在手小指本節後陷中直勞宫勞宫在手厥隂針二分灸七壯明云三壯神門二穴土也一名兑衝在掌後兑骨端陷中灸七壯炷如小麥針三分留七呼隂郤二穴在掌後脈中去腕五分針三分灸七壯通里二穴在腕後一寸陷中針三分灸三壯明云七壯靈道二穴金也去掌後寸半或一寸灸三壯針三分少海二穴水也一名曲節在肘內廉節後又云肘內大骨外去肘端五分屈肘得之針三分灸三壯甄權云屈手向頭取之治齒寒腦風頭痛不宜灸針五分明云在肘內橫紋頭屈手向頭取之陷宛中甲乙云穴在肘內廉即後陷中動應手針二分留三呼瀉五吸不宜灸下云灸五壯素注五壯銅人云灸三壯明堂下經素問注皆云灸五壯上經甄權皆云不宜灸亦可疑矣非大急亦不必灸青靈二穴在肘上三寸伸肘舉臂取灸七壯明下云三壯極泉二穴在腋下筋間動脈入胸灸七壯針三分少澤二穴金也一名小吉在手小指端去爪甲下一分陷中灸一壯針一分前谷二穴水也在手小指外側本節前陷中針一分灸一壯明云三壯後溪二穴木也在手小指外側本節後陷中灸一壯針一分明云在手外側腕前起骨下陷中灸三壯腕骨二穴在手外側腕前起骨下陷中灸三壯針二分留三呼陽谷二穴火也在手外側腕中兑素作鋭骨下陷中灸三壯針二分留二呼養老二穴在手踝骨上空寸陷中灸三壯針三分支正二穴在腕後五寸别走小陽灸三壯針三分明云在手太陽腕後五寸去養老穴四寸陷中灸五壯小海二穴土也在肘內大骨外去肘端五分陷中甄權云屈手向頭取之灸三壯針二分中衝二穴木也在手中指端去爪甲如韭葉陷中針一分明云灸一壯勞宫二穴火也一名五里在掌中央橫文動脈中屈無名指著處是灸三壯明云針二分得氣即瀉只一度針過兩度令人虛不得灸灸令息肉日加忌同素注灸三壯一名掌中趙岐釋孟子云無名之指手第四指也今曰屈無名指著處是穴蓋屈第四指也無名指當屈中指為是今說屈第四指非也太陵二穴土也在掌後兩筋間陷中針五分灸三壯內關二穴在掌後去腕二寸别走少陽針五分灸三壯間使二穴金也在掌後三寸兩筋間陷中針三分灸五壯明下云七壯千云腕後三寸或云掌後陷中郤門二穴去腕五寸手厥隂郤針三分灸五壯曲澤二穴水也在肘內廉陷中屈肘取之灸三壯針三分留七呼素注內廉下天泉二穴一名天濕在曲腋下二寸舉臂取針六分灸三壯關衝二穴金也在手小指次指端去爪甲角如韭葉針一分灸一壯忌同素注三壯一云握拳取之液門二穴水也在手小指次指間陷中針二分灸三壯一云握拳取之中渚二穴木也在手小指次指本節後間陷中針三分灸三壯明云二壯陽池二穴一名别陽在手表腕上陷中針二分留三呼不可灸忌同素注灸三壯外關二穴正少陽絡在腕後二寸陷中針三分留七呼灸二壯明云三壯支溝二穴火也在腕後三寸兩骨間陷中針二分灸二七壯忌同明云五壯素注三壯千云腕後臂下三寸會宗二穴在腕後三寸空中一寸針三分灸三壯三陽絡二穴在臂上大交脈明云肘前五寸外廉陷中支溝上一寸禁針灸七壯明云五壯四瀆二穴在肘前五寸外廉陷中灸三壯針六分留七呼天井二穴土也在肘外大骨後肘上明堂作後一寸兩筋間陷中屈肘得之甄權云曲肘後一寸義手按膝頭取之兩筋骨罅針三分灸三壯忌同明云五壯素注刺一寸千肘後兩筋間清冷淵二穴在肘上二寸伸肘舉臂取之灸三壯針三分消濼二穴在肩下臂外腋斜肘分下行針一分灸二壯明云在肩下外關腋斜肘分下行針六分灸三壯素注肩下臂外關腋大敦二穴木也在足大指端去爪甲如韭葉及三毛中灸三壯針三分留六呼千云足大指聚毛中行間二穴火也在足大指間動脈應手陷中灸三壯針六分留十呼太衝二穴土也在足大指本節後二寸或寸半陷中今附凡診太衝脈可訣男子病死生針三分留十呼灸三壯明云在足大指本節後二寸骨罅間陷中灸五壯素注在足大指間本節後二寸動脈應手刺腰痛注云在大指本節後內間二寸中封二穴金也在足內踝前一寸仰足取之陷中伸足乃得之針四分留七呼灸三壯素注內踝前寸半甲乙云一寸千與素同又云內踝前一寸斜行小脈上一名懸泉蠡溝二穴在足內踝上五寸别走少陽針二分留三呼灸三壯明下云七壯又云交儀在內踝上五寸恐即蠡溝穴别出蠡溝故不可曉亦蠡溝二穴名交儀中都二穴一名中郤在內踝上七寸䯒骨中與少隂相直針三分灸五壯膝關二穴在犢鼻下二寸陷中針四分灸五壯犢鼻在足陽明曲泉二穴水也在膝內輔骨下大筋上小筋下陷中屈膝取之又云正膝屈內外兩筋間宛宛中又在膝曲橫紋頭針六分灸三壯隂包明堂作胞二穴在膝上四寸股內廉兩筋間針六分灸三壯明云七壯五里二穴在氣衝下三寸隂股中動脈灸五壯針六分治腸中滿熱閉不得溺氣衝在腹部第三行隂廉穴氣斷同五里有二其一在手陽明肘上三寸其一在此當為足五里也隂廉二穴在羊矢下去氣衝二寸動脈中灸三壯即有子針八分留七呼竅隂二穴金也在足小指次指端去爪甲如韭葉灸三壯針一分竅隂有二其一在此其一在側頭部此當為足竅隂也俠溪二穴水也在足小指次指岐骨間本節前陷中灸三壯針三分明云臨泣去俠溪寸半地五會二穴在足小指次指本節後陷中去俠溪一寸針一分不可灸灸使人羸瘦不出三年卒臨泣二穴木也在足小指次指本節後間陷中去俠溪寸半灸三壯針二分偃伏第三行既有臨泣穴矣此亦有臨泣穴此當蓋足臨泣也邱墟二穴在外踝下如前陷中去臨泣三寸灸三壯針五分留七呼懸鍾二穴在足外踝上三寸動脈中針六分留七呼灸五壯千云一名絶骨外踝上三寸又云四寸陽輔二穴火也在外踝上四寸輔骨前絶骨端如前三分去邱墟七寸灸三壯針五分留七呼千云外踝上輔骨前餘同光明二穴在外踝上五寸針六分留七呼灸五壯明下云七壯治䯒疼不能久立與陽輔療病同外邱二穴在外踝上七寸針三分灸三壯陽交二穴一名别陽在外踝上七寸斜屬三陽分肉之間灸三壯針六分留七呼千云一名足窖在外踝上七寸一云三寸陽陵泉二穴土也在膝下一寸外廉陷中針六分得氣即瀉又宜久留針灸七壯至七七壯即止明下云一壯素注三壯千云膝下外尖骨前難疏髀骨中微側少許筋會陽陵泉筋病治此陽關二穴在陽陵泉上三寸犢鼻外陷中針五分不可灸千云關陽一云關陵中瀆二穴在髀骨外膝上五寸分肉間陷中灸五壯針五分留七呼環跳二穴在髀樞中側卧伸下足屈上足取之灸五十壯針一寸留十呼忌同明下云在硯子骨宛宛中灸三壯甲乙云五壯風市二穴在膝外兩筋間立舒下兩手著腿當中指頭陷中療冷痺腳脛麻腿膝酸痛腰重起坐難明下豫冬月當風市處多冷痺急撜熱手溫之略止日或兩三痺偶謬刺以溫針遂愈信乎能治冷痺也亦屢灸此不特治冷痺亦治風之要穴見明堂銅人乃不載豈名或不同將其本不全耶隱白二穴木也在足大指端內側去爪甲角如韭葉宛宛中針三分今附婦人月事過時不止刺立愈明云針一分留三呼灸三壯大都二穴火也在足大指本節後陷中灸三壯針三分千注本節內側白肉際太白二穴土也在足內側核骨下陷中灸三壯針三分千云足大指內側公孫二穴在足大指本節後一寸灸三壯針四分商邱二穴金也內踝下微前陷中灸三壯針三分三隂交二穴在內踝上三寸骨下陷中明云內踝上八寸陷中灸三壯針三分昔宋太子善醫術出苑逢一妊婦太子診曰女令徐文伯診曰一男一女針之瀉三隂交補合谷應針而落果如文伯言故妊娠不可刺千云內踝上八寸骨下又云內踝上三寸漏谷二穴亦名太隂絡在內踝上六寸骨下陷中針三分明下云灸三壯地機二穴亦名脾舍足太隂郤别走上一寸空在膝下五寸灸三壯針三分明云膝內側轉骨下陷中伸足取之隂陵泉二穴水也在膝下內側輔骨下陷中伸足取之針五分當屈膝取之血海二穴在膝臏上內廉白肉際二寸中灸三壯針五分千云白肉際二寸半注云一作三寸箕門二穴在魚腹上越筋間動脈應手在隂股內一云上起筋間灸三壯厲兑二穴金也在足大指次指端去爪甲如韭葉針一分灸一壯內庭二穴水也在足大指次指外間陷中灸三壯針三分陷谷二穴木也在足大指次指外間本節後陷中去內庭二寸針三分留七呼灸三壯衝陽二穴在足跗上去陷谷三寸針五分灸三壯素注跗上五寸骨間動脈刺三分千云跗上五寸骨間去陷谷三寸一云二寸解溪二穴火也在衝陽後寸半腕上陷中明下云任繫鞋處針五分灸三壯素注在衝陽後二寸半新校正云刺瘧注作三寸半二注不同當從甲乙經作寸半豐隆二穴在外踝上八寸下廉䯒外廉陷中針三分灸三壯明下云七壯下廉二穴一名下巨虛在上廉下三寸當舉足取穴針八分灸三壯明云上廉下三寸兩筋兩骨罅陷宛宛中蹲地坐取之針六分得氣即瀉甲乙云針三分灸三壯主小腸氣不足面無顔色偏風熱風冷痺不遂風濕痺灸亦良日七七壯素注足陽明與小腸合在上廉下三寸針三分手陽明亦有下廉此乃足下廉也條口二穴在廉上一寸舉足取之針五分明云在上廉下一寸針八分灸三壯上廉二穴一名上巨虛在三里下三寸當舉足取之灸三壯針三分甄權云治藏氣不足偏風腰腿手足不仁灸隨年為壯明云巨虛上廉在三里下三寸兩筋兩骨罅陷宛宛中針八分得氣即瀉灸大良日七壯下云三壯素注在三里下三寸又云在膝犢鼻下䯒外廉六寸手陽明亦有上廉此乃足上廉也三里二穴土也在膝下三寸䯒外廉兩筋間一云䯒骨外大筋內當舉足取之秦承祖云諸病皆治食氣水氣蠱毒痃癖四肢腫滿膝䯒痠痛目不明華他云療五勞羸瘦七傷虛乏胸中瘀血乳癰外臺明堂云人年三十以上若不灸三里令氣上衝目所以三里下氣也下同灸三壯針五分明云針腹背每須取三里穴針八分留十呼瀉七吸日灸七壯止百壯素注刺一寸在膝下三寸䯒骨外廉兩筋肉分間指云深則足趺陽脈不見集云按之太衝脈不動手有三里此亦曰三里蓋足三里也銅人云在膝下三寸明堂素問注皆同人多不能求其穴每以大拇指次指圈其膝蓋以中指住處為穴或以最小指住處為穴皆不得真穴所在也豫按明堂有膝眼四穴蓋在膝頭骨下兩旁陷中也又按銅人等經有犢鼻穴蓋在膝臏下骭俠罅大筋中也又按銅人有膝關二穴蓋在犢鼻下二寸陷中也而新校正素問注巨虛上廉云三里在犢鼻下三寸則是犢鼻之下三寸方是三里不可便從膝頭下去三寸為三里穴也若如今人之取穴恐失之太髙矣千云灸至五百壯少一二百壯犢鼻二穴在膝臏下骭俠解明堂作罅大筋中治膝中痛不仁難跪起膝臏腫潰者不可治不潰者可療若犢鼻堅硬勿便攻先以洗尉即微刺之愈明云針三分灸三壯按素問刺禁云刺膝臏出液為跛犢鼻在膝臏下骭用針者不可輕也梁邱二穴在膝上二寸明云三寸兩筋間灸三壯針三分明云五分明堂作三寸銅人千金皆作二寸千金注謂或云三寸姑兩存之隂市二穴一名隂鼎在膝上三寸伏兔下陷中拜而取之針三分不可灸明下云灸三壯千注二十卷云在膝上當伏下行二寸臨膝取之又云膝內輔骨後大筋下小筋上屈膝得之銅人云不可灸明堂乃云灸三壯豈以禁穴許灸一壯至三壯耶伏二穴在膝上六寸起肉正跪坐取之一云膝蓋上七寸針五分不可灸明云婦人八部諸病通針三分髀關二穴在膝上伏後交分中針六分明云灸三壯膝眼四穴在膝頭骨下兩旁陷中主膝冷疼不已針五分留三呼瀉五吸禁灸有人膝腫甚人為灸此穴遂至不救蓋犯其所禁也銅人無此四穴明堂有之故附入于此涌泉二穴木也一名地衝在足心陷中屈足捲指宛宛中灸三壯針五分無令出血淳于意云漢北齊王阿母患足下熱喘滿謂曰熱厥也當刺足心立愈明云灸不及針若灸廢人行動下云在腳心底宛中白肉際灸三壯素注刺三分千注肝藏卷云在腳心大指下大筋史記濟北王阿母足熱而悶淳于意曰熱厥也刺足心各三所案之無出血病已病得之飲酒大醉然谷二穴火也一名龍淵在內踝前起大骨下陷中灸三壯針三分不宜見血素注刺三分刺此多見血令人立飢飲食千注婦人方云在內踝前直下一寸太溪二穴土也在內踝後跟骨上動脈陷中灸三壯針三分大鍾二穴在足跟後衝中灸三壯針二分留七呼水泉二穴去太溪下一寸在內踝下灸五壯針四分照海二穴隂蹻脈所生在內踝下針三分灸七壯千云在內踝下四分明上云隂蹻二穴在內踝下陷宛中針三分灸三壯下云隂蹻二穴在內踝下陷中灸三壯千云內踝下容爪甲明堂上下經有隂蹻穴而銅人無之惟有照海穴亦在內踝下與隂蹻同而未知其故豫按素問氣穴論隂陽蹻穴在內踝下是謂照海隂蹻所生則與銅人照海穴合矣則是隂蹻即照海也故附隂蹻于照海之末復溜二穴金也一名昌陽一名伏白在內踝上二寸動脈陷中針三分留三呼灸五壯明云七壯交信二穴在內踝上二寸少隂前太隂後廉前筋骨間腨灸三壯針四分留五呼明下云內踝上二寸後廉筋骨陷中素氣穴論踝上橫二穴注云內踝上者交信穴也按素問氣府論隂蹻穴注云謂交信也在內踝上二寸少隂前太隂後筋骨間隂蹻之郤竊意隂蹻即交信也至氣穴論隂陽蹻穴注乃云隂蹻穴在內踝下是謂照海隂蹻所生則是隂蹻乃照海非交信矣故明堂下經既有交信穴在內踝上又出隂蹻穴在內踝下上下不同蓋二穴也但不知素問之注何故前後自異學者毋信其一注而不考其又有一注也築賔二穴在內踝上腨分中灸五壯針三分明云在內踝上灸三壯隂谷二穴水也在膝內輔骨後大筋下小筋上按之應手屈膝乃取之灸三壯針四分留七呼至隂二穴金也在足小指外側去爪甲角如韭葉針二分灸三壯通谷二穴水也在足小指外側本節前陷中灸三壯針二分束骨二穴木也在足小指外側本節後陷中灸三壯針三分京骨二穴在足外側大骨下赤白肉際陷中按而得之針三分灸七壯明云五壯素注三壯申脈二穴陽蹻脈所出在外踝下陷中容爪甲白肉際針三分千云申脈在外踝下陷中明上云陽蹻二穴在外踝前一寸陷宛中針三分素氣穴注陽蹻穴是謂申脈陽蹻所出在外踝下陷中新校正云按刺腰痛篇注在外踝下五分繆刺論注外踝下半寸容爪甲明堂上經有陽蹻穴而銅人無此穴惟有申脈二穴陽蹻脈所出在外踝下陷中與陽蹻穴同而未知其故豫按素問氣穴論隂陽蹻穴注云陽蹻穴是謂申脈陽蹻所出在外踝下陷中則與銅人申脈穴合是則陽蹻即申脈也故附明堂陽蹻于申脈之後金門二穴一名關梁在外踝下灸三壯炷如小麥針一分僕參二穴一名安耶在跟骨下陷中拱足得之針二分灸七壯明云三壯崑崙二穴火也在外踝後跟骨上陷中素注細脈動應手灸三壯針三分明云上崑崙針五分下崑崙外踝下一寸大筋下明堂有上崑崙又有下崑崙銅人只云崑崙而不載下崑崙豈銅人不全耶抑名不同未可知也但上經云內崑崙在外踝下一寸下經云內崑崙在內踝後五分未知其孰是豫謂既云內崑崙則當在內踝後矣下經之穴為通上崑崙在外踝故也付陽二穴在外踝上三寸足太陽穴同千金亦同陽蹻郤太陽前少陽後筋骨間陽蹻之郤灸三壯針五分留七呼明下云付陽在外踝上二寸恐二字當作三後筋骨間宛宛中灸五壯素氣府論隂陽蹻各一注云陽蹻謂付陽穴也在外踝上三寸太陽前少陽後筋骨間陽蹻之郤按素問氣府論陽蹻穴注云謂付陽穴也在外踝上三寸竊意陽蹻即付陽也及考氣穴論隂陽蹻四穴注云陽蹻穴是謂申脈陽蹻所出則是陽蹻乃申脈非付陽矣故明堂下經既有付陽在外踝上二寸上經又有陽蹻在外踝前一寸一寸二寸既異是付陽陽蹻各是一穴也但不知素問之注何故前後相背耶飛揚二穴一名厥陽在外踝上九寸明堂千金並云七寸針三分灸三壯明云五壯承山二穴一名魚腹一名肉柱一名傷山在兑腨腸下分肉間陷中灸一壯針七分明云八分得氣即瀉速出針灸不及針止七七壯下云五壯一云在腿肚下分肉間承筋二穴一名腨腸一名直腸在腨腸中央陷中灸三壯禁針明云在脛後從腳根後到上七寸腨中央陷中針三分千云從腳根上七寸腨中央不刺銅人千金皆云禁針明堂乃云針三分亦可疑矣不針可也合陽二穴在膝約中央下二寸千作三寸針六分灸五壯委中二穴土也在膕中央約文中動脈今附委中者血郤也熱病汗不出足熱厥逆滿膝不得曲伸取其經血立愈明云甄權云在曲踿內兩筋兩骨中宛宛是令人面挺腹地而取之針八分留三呼瀉五吸甲乙云針五分留七呼灸三壯素注在足膝後屈處膕中央約紋中又骨空論云在膝解後曲腳中背面取之委陽二穴三焦下輔腧也在足太陽後出於膕中外廉兩筋間屈伸取之承扶下六寸灸三壯針七分素注在足膕中外廉兩筋間千云足太陽前少陽後浮郤二穴在委陽上一寸展膝得之灸三壯針五分殷門二穴在肉郤下六寸針七分扶承二穴一名肉郤一名隂關一名皮部在尻臀下股隂衝上紋中針七分明下云灸三壯千云在尻臀下股隂下紋中一云股臀下橫紋中以上諸穴皆依銅人經次第而編明堂上下經有穴而銅人不載亦或附入惟有其穴而無其名者無慮數十穴不編當各依本經所說而針灸之不可泥此經之無穴名而不針灸也扁鵲灸鬼邪凡十三穴與銅人明堂同而其名却異故不編入許希針經之穴既與諸經不同其名又異如龍興穴之類是已亦不附入者不欲以一人之私名亂諸經之舊穴以滋後學者惑也針灸資生經卷一
