腫復溜治腹中雷鳴腹脹如鼓四支腫十水病明下同章門療身黄羸瘦四支怠惰腹脹如鼔兩脇積氣如卵石明下中封四滿主鼔脹千見陰縮太白公孫主腹鼓脹腹中氣大滿見腹脹陰交石門主水脹小腹皮敦敦然見水腫甄權云分水主鼓脹腸鳴水腫鼓脹中封二百壯奔㹠冷氣心間伏梁狀如覆杯冷結諸氣鍼中管八分留七呼寫五吸疾出鍼須灸日二七壯至四百止忌房室心腹諸病堅滿煩痛憂思結氣寒冷霍亂心痛吐下食不消腸鳴洩利太倉中管百壯心下堅積聚冷熱腹脹上管百壯千翼水腫雜腫四支腫石水水通身腫灸足第二指上一寸隨年壯又灸兩手大指縫頭七壯十虚勞浮腫灸太衝百壯又灸腎俞凡頭目癰腫留飲胸脇支滿刺陷谷出血立已陷谷列缺主面目癰腫陽陵泉公孫主頭面腫完骨巨窌主頭面氣胕腫天摳豐隆厲兌陷谷衝陽主面浮腫中府間使合谷主面腹腫解谿主風水面胕腫顔黒氣舍主肩腫不得顧三里主水腹脹皮腫曲泉主腹腫陰谷主寒熱腹偏腫大敦主大腹腫脹臍腹邑邑陰交石門主水脹水氣行皮中小腹皮敦敦然小便黄氣滿屋翳主身腫皮痛不可近衣關門主身腫身重天府主身脹逆息不得卧風汗身腫喘息多唾上星治頭風面虚腫銅顖㑹治目眩面腫前頂治目眩面赤腫小兒頂腫腦户治目黄頭腫水溝治水氣徧身腫明云若是水氣惟得鍼此若鍼餘穴水盡即死胃倉治水腫見腹脹缺盆治水氣見瘰􅕅屋翳治身體腫皮膚痛不可近及淫濼瘈瘲不仁腎俞治身腫見勞瘵建里治腹脹身腫神闕治水腫鼓脹腸鳴如流水聲中極石門治水腫見腹脹四滿治大腹有水見積聚章門治腹腫脊强四支傷惰涌泉治男子如蠱女子如姙娠五指端盡痛足不得踐地陰谷同上三里治水氣明同復溜治十分病見鼓脹維道治水腫不嗜食見嘔吐地機治丈夫溏洩腹脇脹水腫腹堅不嗜食小便不利陰陵泉治腹中寒不嗜食鬲下滿水脹腹堅喘逆不得卧腰痛難俛仰陷谷治面目浮腫及水病善噫腸鳴腹痛分水療腹腫不能食若是水病灸大良明下云療水病腹腫繞臍痛衝胸不得息甄權云主水氣浮腫鼓脹腸鳴如雷聲時上衝心銅見鼔脹曲骨療水病脹滿下小兒水氣四支盡腫及腹大灸分水三壯胃倉主水腫臚脹食飲不下惡寒千水溝主水腫人中滿關元婦人小腹滿石水見無子章門主身潤石水身腫關元主小腹滿石水四滿然谷主大腹石水氣衝主大氣石水豐隆主四支腫身濕銅同豐隆復溜主風逆四支腫列缺主汗出四支腫復溜治四支腫銅見鼔脹水腫惟得鍼水溝若鍼餘穴水盡即死此明堂銅人所戒也庸醫多為人鍼水分殺人多矣若其他穴亦有鍼得差者特幸焉耳不可為法也或用藥則禹餘糧丸為第一見既效方予屢見人服驗故書于此然灸水分則最為要穴也有里醫為李生治水腫以藥飲之久之不效以受其延待之勤一日忽為灸水分與氣海穴翌早觀面如削矣信乎水分之能治水腫也明堂固云若是水病灸大良蓋以此穴能分水不使妄行云焉耳但不知明堂又云鍼四分者豈治其他病當鍼四分耶百病水腫腎俞百壯胃倉隨年水腫陷谷隨年水腫上下陰交百壯水腫脹曲骨百壯大腹陰市隨年人中滿脣腫及水腫大水臍中石門百壯風水上亷隨年水腫不得卧陰陵泉百壯石水灸然谷氣衝四滿章門水分主水腫腹滿不能食堅硬日七壯至四百壯忌鍼鍼水盡即死水病灸至差止千翼鍼灸資生經卷四
