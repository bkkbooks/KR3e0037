非風也古人謂之陰陽癎猶傷寒之有陰陽證也陽癎如陽證當治以凉藥陰癎如陰證當治以溫藥庸醫不知此例以風藥治之風藥多涼或是慢驚未有不罹其害者戒之戒之若灸驚風惟灸慢驚慢脾風為穏當云風癎五癎神庭療癲風不識人羊鳴明見癲癎百㑹療風癎青風心風角弓反張羊鳴多哭言語不擇發時即死吐沫心熱悶頭風多睡心煩驚悸無心力忘前失後食無味頭重飲酒面赤鼻塞明下云療登高而歌棄衣而走角弓反張羊癎吐舌百㑹治風癎中風角弓反張或多哭言語不擇發即無時盛即吐沬心煩驚悸銅神庭絲竹空見目眩治風癎目戴上不識人巨闕療心中煩悶熱風風癎浪言或作鳥聲不能食無心力㑹宗治肌膚痛耳聾風癎脊中見癲涌泉治風癎前頂療風癎明上管療風癎熱痛可瀉而後補脊俞療風癎癲邪眉衝療目五般癎頭痛鼻塞涌泉神聰見頭風强間岐伯云療風癎天井療癎病羊鳴吐舌癎病小兒惡疾也呼吸之間不及求師致困者不少下小兒食癎者先寒熱洒淅乃發灸鳩尾上五分三壯小兒風癎者先屈手指如數物乃發也灸鼻柱上髪際宛中三壯小兒猪癎病如尸厥吐沬灸巨闕三壯小兒雞癎善驚反折手掣自摇灸手少陰三壯在掌後去腕半寸陷中小兒羊癎目瞪吐舌羊鳴灸九椎下節間三壯小兒牛癎目直視腹脹乃發灸鳩尾三壯小兒馬癎張口摇頭身反折馬鳴灸僕參各三壯馬癎張口摇頭馬鳴欲反折灸頂風府臍中三壯千燒馬蹄末服良牛癎目正直視腹脹灸鳩尾骨及大椎各三壯燒牛蹄末服良羊癎喜揚目吐舌灸大椎上三壯猪癎喜吐沫灸完骨兩旁各一寸七壯犬癎手屈拳攣灸兩手心足太陽肋户各一壯雞癎摇頭反折喜驚自摇灸足諸陽各三壯神庭脊俞療風癎見驚癎前頂治小兒驚癎風癎銅見癲癎小兒髪逆上啼笑面暗色不變是癎候或鼻口青時小驚或目閉青時小驚或身熱頭常汗出或身熱吐哯而喘或身熱目時直視或卧惕惕而驚手足振摇或卧夢笑手足動摇或意氣下而妄怒或咽乳不利或目瞳子卒大黒於常或喜欠目上視或身熱小便難或身熱目視不精或吐痢不止厥痛時起或弄舌摇頭諸候二十條皆癎之初也見其候便爪其陽脉所應灸𤓰之皆重手令兒驟啼及足絶脉亦依方與湯直視瞳子動腹滿轉鳴下血身熱口噤不得乳反張脊强汗出發熱為卧不悟手足掣瘲喜驚凡八條癎之劇者也如有此非復湯爪所能救當時而灸之徐嗣曰風眩之病起於心氣不足胸上蓄熱實痰熱相感而動風風心相亂則悶瞀故謂之風眩瞀大人曰癲小兒為癎此方為治萬無不愈困急時但度灸穴使大鍼鍼之無不差者初得鍼竟便灸最良余業之以來三十餘年所救活者數千百人病此而死不逢嗣故也續命湯主眩發頓悶無知口沫出四體角弓目反上口噤不得言竹瀝一升二合生地黄汁一升龍齒末生薑防風麻黄去節各四兩防已附子炮各三兩石膏十兩桂二兩合十味水一斗煮取三升分三服有氣加附子一兩紫蘇五合橘皮半兩其論風眩癲癎甚有理故併其方附於此更有賁㹠湯詳見千金但小兒癎非心氣不足爾千金有風食驚癎三種本事有陰陽癎慢脾風三證慢脾即食癎宜醒脾丸人參散右方有三癎元治小兒百二十種驚癎荆芥穗二両礬一兩半生半枯為末麵糊丸黍米大硃砂衣薑湯下二十丸吾謂慢驚用來復丹急驚三癎丸食癎醒脾丸可也風勞餘見勞大杼治風勞氣欬嗽明有氣急字胸中鬱鬱身熱目眩銅大椎治風勞食氣風門治風勞嘔逆上氣胸背痛喘氣卧明作短不安膀胱俞治風勞腰脊痛附分治風勞臂肘不仁五里治風勞驚恐吐血肘臂痛嗜卧四支不得動曲泉治風勞失精身體極痛洩水不利膿血陰腫䯒痛關元俞膀胱俞療風勞腰痛明伏兎療風勞痺逆狂邪膝冷手節攣縮身癮疹腹脹少氣頭重風勞腦戸五壯鍼三分補之千翼灸風勞發背癰疽用麻繩一條蠟過從手中指第二節量至心坎骨截斷須直伸臂折過自前項下取中纒至後心相對令齊閉口量兩吻濶狹以此為則對灸七壯澧州井司法馬司法云神效風痙角弓反張顱顖治風痙銅大迎治風痙口噤牙疼頰腫惡寒舌强不能言瘂門治寒熱風痙脊强反折瘈瘲天衝治癲疾風痙牙齗腫善驚脾俞膀胱俞主熱痙引骨痛千上關主瘈瘲沫出寒熱痙引骨痛腎俞中膂俞長强主寒熱痙反折肝俞主筋寒熱痙筋急手相引魚際主痙上氣失瘖不能言腰俞主反折見月事小兒身强角弓反張灸鼻上入髪際三分三壯次大椎下節間三壯明下百㑹治角弓反張銅見中風上窌見絶子腰俞主脊强反折千産論云痙者口噤不開背强而直如發癎狀摇頭馬鳴身反折宜速灌小續命湯是也此見二十論又云産後中風如角弓狀無治法見十八章後人惟用荆芥穗末酒服二錢七立效若是則灸未必如藥之速見效也風眩餘見頭目眩餘論見風癎完骨療風眩項痛頭强寒熱明當陽臨泣療卒不識人風眩鼻塞後頂見頭風玉枕見目痛頷厭見偏頭痛療風眩千陽谷主風眩驚手捲甲乙手捲作手腕痛泄風汗出腰項急承光治風眩頭痛嘔吐心煩申脉治坐如在舟車中見腰脚神庭上星顖㑹主風頭眩千天牖等前項等主風眩見頭風攢竹療頭目風眩見目眩千金方載徐嗣之言曰風眩之病起於心氣不足胸上蓄熱實痰熱相感而動風風心相亂則悶瞀故謂之風眩瞀大人曰癲小兒曰癎則是風眩癲癎本一疾也不知後人何為析而三之予因分為三門且從為之辭以釋世醫之疑云風痺餘見肩髃穴天井治驚悸瘈瘲風痺臂肘痛捉物不得銅肩貞治風痺手臂不舉肩中熱痛尺澤治風痺肘攣手臂不舉消濼治寒熱風痺項痛肩背急明云頭痛項背急膝關治風痺膝内痛引臏不可屈伸喉咽痛付陽治痿厥風痺頭重䪼痛髀樞股䯒痛瘈瘲風痺不仁時有寒熱四肢不舉陽輔見膝痛陽關並見膝痛治風痺不仁委中見腰脊治風痺少海見瘰癧療風痺明委中見脚弱下亷療風濕痺見身寒痺環跳治冷風濕痺見腰痛治卒病肉痺不知人見中風岐伯曰中風大法有四四曰風痺巢氏曰風寒濕三氣合而為痺風多者為風痺風痺之狀肌膚盡痛而復手足不隨也醫者當以此求之速與續命湯依俞穴灸之云詳見千金中風中風寒熱餘論見偏風小兒但是風病諸般醫治不差灸率谷明下黄帝療中風眼戴上及不能語者灸第二椎第五椎上各十壯齊下火炷如半棗核大立差黄帝問岐伯曰中風半身不遂如何灸答曰凡人未中風一兩月前或三五月前非時足脛上忽酸重頑痺良久方解此將中風之候急灸三里絶骨四處三壯後用葱薄荷桃柳葉煎湯淋洗驅逐風氣於瘡口出灸瘡春較秋灸秋較春灸常令兩脚有瘡為妙凡人不信此法飲食不節酒色過度忽中此風言語蹇澁半身不遂宜七處齊下火各三壯風在左灸右右灸左百㑹耳前髪際肩井風市三里絶骨曲池七穴神效不能具錄依法灸無不愈灸風中府手足不隨其狀覺手足或麻或痛良久乃已此將中府之候病左灸右病右灸左因循失灸廢者灸瘡春較秋灸秋較春灸取盡風氣集效百㑹曲鬢肩顒曲池風市足三里絶骨共十三穴灸風中藏氣塞涎上不語極危者下火立效其狀覺心中潰亂神思不怡或手足麻此將中藏之候不問風與氣但依次自上及下各灸五壯日别灸隨年壯凡遇春秋常灸以泄風氣素有風人可保無虞此能灸暴卒百㑹風池大椎肩井曲池間使足三里共十二穴集效方云治風莫如續命防風排風湯之類此可扶助疾病若救危急必火艾為良此論亦當范子黙自壬午五月間口眼喎斜灸聽㑹等三穴即正右手足麻無力灸百㑹髪際等七穴得愈未年八月間氣塞涎上不能語金虎丹加膩粉服至四丸半氣不通涎不下藥從鼻中出魂魄飛揚如墜江湖中頃欲絶灸百㑹風池等左右共十二穴氣遂通吐幾一碗許繼又下十餘行伏枕半月餘遂平爾後小覺意思少異於常心中憒亂即便灸百㑹風池等穴立效本事方云十二穴者謂聽㑹頰車地倉百㑹肩隅曲池風市足三里絶骨髪際大椎風池也依而用之立效氣塞涎上不能語心中風候也巢氏病源常論之古方雖謂但得偃卧悶絶汗出者心中風之候恐未盡也范公灸得氣通蓋灸百㑹之力其吐幾一碗下十行者豈服金虎丹加膩粉所致耶必用方戒人服金虎等丹風池療大患風者先補後瀉少可患以經取之明肝俞療中風支滿短氣不食食不消吐血目不明閉塞陰蹻療偏枯不能行大風暴不知人卧驚視如見星臨泣治卒中風不識人銅解谿治風面浮腫顔黒厥氣上衝腹脹大便下重瘈驚膝股䯒腫轉筋目眩頭痛勞宫治中風善怒悲笑不休手痺内關治中風肘攣實則心暴痛虚則心煩惕惕風頭耳後痛煩心足不收失履口喎僻頭頂瘈痛牙車急完骨主之甲心俞治心中風語悲泣銅見狂走百㑹治風癎中風角弓反張或多哭言語不擇發即無時盛即吐沫心驚煩健忘銅崑崙主狂易大風千陰蹻主風暴不知人偏枯不能行照海主大風黙黙不知所痛視如見星天井主大風黙黙不知所痛悲傷不樂百㑹療青風心風見風癎肩髃治偏風熱風見中風不語岐伯曰中風大法有四一曰偏枯二曰風痱三曰風懿四曰風痺夫諸急卒病多是風初得輕微人所不悟宜速與續命湯依俞穴灸之夫風者百病之長岐伯所言四者說其最重也凡風多從背五藏俞入諸藏受病肺病最急肺主氣息又冒諸藏故也肺中風者其人偃卧而胸滿短氣冒悶汗出者肺風之證視目下鼻上兩邊下行至口色白者尚可治急灸肺俞百壯服續命湯小兒減之若急黄者此為肺已傷化為血不可復治若為急風邪所中便迷漠恍惚妄言狂語或少氣惙惙不能復言若不求師即治宿昔而死即覺便灸肺俞及膈俞肝俞數十壯急服續命湯可救若涎吐出不收者既灸當立與湯也諸陽受風亦恍惚妄語與肺病相似然著緩可經久而死肝中風者其人但踞坐不得低頭繞兩目連額上色微有青者肝風之證若脣色青面黄尚可治急灸肝俞百壯服續命湯心中風者其人但得偃卧不得傾側悶亂冒絶汗出者心風之證若脣正赤尚可治急灸心俞百壯服續命湯脾中風者其人但踞坐而腹滿身通黄吐鹹汗出者尚可治急灸脾俞百壯服續命湯腎中風者其人踞坐而腰痛視脇左右未有黄色如餅粢大者尚可治急灸腎俞百壯服續命湯大腸中風者卧而腸鳴不止灸大腸俞百壯可服續命湯鄉里有人忽覺心腹中熱甚急投藥鋪說其狀鋪家以為此中風之候與治風藥而風不作予中心藏之至夷陵見一太守中夏忽患熱甚不免以水洒地設簟卧其上令人扇之次日忽中風數日而殂人皆咎其卧水簟上而用扇也暨到澧陽見一老婦人夏中亦患熱夜出卧㕔上次日中風偶其子預合得小續命湯服更召醫調理數日愈始知人之中風心腹中多大熱而後作而小續命湯不可不服也王令患風醫以青州白員子排風湯續命湯四物湯黄蓍建中湯术附湯嘉禾散各為一處同和分數服每服水一碗棗三枚薑五片同煎至七分去滓溫服自後與人服皆效周戸傳三湯四散子用四君子排風續命湯嘉禾急風正氣匀氣散一切風疾無不差肝風占候其口不能言當灸鼻下人中次灸大椎次肝俞五十壯餘處隨年壯眼暗人灸之得明二三百壯良凡心風寒灸心俞各五十壯扁鵲曰凡人心風灸心俞兩邊各一寸二分各五七壯對心是肝俞二穴主心風腹脹滿食不消化吐血酸痛四支羸露不欲食飲鼻血目眗䀮䀮不明肩頭脇下痛小便急灸三二百壯差即止扁鵲云治卒中惡風心悶煩毒欲死急灸足大指下横文隨年壯立愈若筋急不能行者内踝筋急灸内踝上