body:
  text: 鍼灸資生經卷四心痛凡心實者則心中暴痛虚則心煩惕然不能動失智内關主之千凡卒心痛汗岀刺大敦出血則已心俞亶中通谷巨闕太倉神府郄門曲澤大陵主心痛期門長强天突俠白中衝主心痛短氣尺澤主心痛彭彭然心煩亂悶少氣不足息然谷主心如懸少氣不足以息心悶痛上氣牽引小腸灸巨闕二七壯腎俞復溜大陵云門主心痛如懸間使主心懸如飢支溝太谿然谷主心痛如錐刺甚者手足寒至節者死行間主心痛色蒼蒼然如死灰狀終日不得太息銅鳩尾主心寒脹滿不得食息賁唾血厥心痛善噦心疝太息中管主心痛難俛仰甲云身寒心痛衝胃死不知人臨泣主胸痺心痛不得反側甲云不得息痛無常處腹結見臍行間見腹痛主痛搶心通里主卒痛煩心心中懊憹數欠頻伸心下悸悲千與銅同靈道主心痛悲恐相引瘈瘲建里主心痛上搶心不欲食明云心痛身腫章門主心痛而嘔太泉主心痛肺脹胃氣上逆鳩尾主心寒脹滿不得食大都太白主暴泄心痛腹脹心痛尤甚上管主心痛有三蟲多涎不得反側不容期門主心切痛喜噫酸少衝主心痛而寒商丘主心下有寒痛胸痺心痛天井臨泣主之或灸亶中百壯見胸痺亶中天井主胸心痛心腹諸病心痛灸大倉肝俞見心滿心腹胸滿痞痛灸肝俞見胸脇脹中管治心痛銅見心滿建里療心痛明見上氣鬲俞治心痛周痺見痃癖足臨泣治心痛周痺痛無常處見月事魚際療心痺明見氣逆荆婦舊侍親疾累日不食因得心脾疼發則攻心腹後心痛亦應之至不可忍則與兒女别以藥飲之疼反甚若灸則徧身不勝灸矣不免令兒女各以火鍼微刺之不拘心腹須臾痛定即欲起矣神哉治心腹冷痛玉抱肚法鍼砂四兩炒似烟出入白礬半兩碙砂粉霜各半錢新水拌勻微濕以皮紙貼安懐中候熱發寘臍中氣海石門關元穴大補本元或寘其他冷處汗出立差予自用驗此藥燥則不熱再以新水拌再熱可用十餘次如藥力盡却曝乾再入礬等依舊熱舍弟叔浩傳一方只用鍼砂泥礬功效亦同豈以碙砂粉霜價不亷而不用耶予舊患心脾發則疼不可忍急用瓦片寘炭火中燒令通紅取出投米醋中漉出以紙三二重裹之置疼處稍止冷即再易耆舊所傳也後閱千金方有云凡心腹冷痛熬鹽一半熨或熬蠶沙燒塼石蒸熨取其裏溫煖止或蒸土亦大佳始知予家所用蓋出千金方也他日心疼甚急灸中管數壯覺小腹兩邊有冷氣自下而上至灸處即散此灸之功也本事方載王思和論心忪非心忪也胃之大絡名曰建里絡胸鬲及兩乳間虚而有痰則動更須臾發一陣熱是其證也審若是又當灸建里矣但不若中管為要穴云靈道治心痛悲恐相引瘈瘲肘攣暴瘖不能言俠白治心痛乾嘔煩滿極泉治心痛乾嘔太淵治心痛唾血振寒咽乾狂言口僻陰郄見霍亂中衝治心痛煩滿舌强厥陰俞見欬逆神門見煩心臨泣治心痛見月事齗交治面赤心煩痛天井治心胸痛見上氣下管治心痛不可忍外陵治心如懸下痛見腹痛大陵上管治心痛不可忍明云不可卧章門治喘息心痛見腸鳴涌泉建里治心下痛不欲食許云心疼是有涎宜針建里幽門治女子心痛逆氣善吐食不下期門治産餘疾食不下胸脇滿心切痛善噫巨闕療凡心痛有數種冷痛痐蟲心痛蠱毒霍亂不識人明銅云治蚘蟲心痛蠱毒中管治心匿不能食反胃霍亂心痛曲澤見唾血督俞見腹痛鬲俞見痰飲療心痛涌泉療心痛不嗜食少衝療卒心痛心俞療寒熱心痛背相引痛胸滿悶欬嗽不得息煩心多涏巨闕療心痛不可忍嘔血煩心下張仲文療卒心痛不可忍吐冷酸水及元藏氣灸足大指次指内横文中各一壯炷如小麥立愈心懊憹憹微痛煩逆灸心俞百壯千心痛如錐刀刺氣結灸鬲俞七壯心痛冷氣上灸龍頷百壯在鳩尾頭上行一寸半不可刺心痛惡氣上脇急痛灸通谷五十壯在乳下二寸心痛暴絞急絶欲死灸神府百壯在鳩尾正心有忌心痛暴惡風灸巨闕百壯心痛堅煩氣結灸太倉百壯心痛灸臂腕横文三七壯又灸兩虎口白肉際七壯千腎心痛先取京骨昆崙發鍼不已取然谷胃心痛取大都太白脾心痛取然谷太谿肝心痛取行間太衝肺心痛取魚際太淵心痛不可按煩心巨闕主之心痛有三蟲多涎不得反側上管主之心痛身寒難以俛仰心疝衝冒死不知人中管主之心痛如鍼錐刺然谷及太谿主之心腹中卒痛石門主之行間陰郄主心痛見驚間使治卒心痛多驚喑不得語咽中如鯁銅曲澤治心痛善驚郄門治心痛衂血嘔噦驚恐畏人神氣不足天泉治心病胸脇支滿欬逆膺背脾臂内亷痛太谿治久瘧欬逆心痛如錐刺手足寒至節喘息者死心痛右九種乃心脾疼而非真心痛真心痛則朝發夕死夕發朝死如難經疏所載是已然此疾亦有所自産論嘗謂産後心痛若悞以為有所傷療之則虚極而心絡寒甚傳心之正經則變為真心痛此一說也巫臣以夏姬之故怨子反曰余必使汝疲於奔命以死子反於是一歲七奔命遂遇心疾而卒則又因用心而成疾矣然則如之何平居當養其心使之和平疾自不作其次則當服鎮心丹之類以補養之可也若疾將作而鍼灸抑亦可以為次矣心恍惚餘見肺中風心俞天井神道明上下同治悲愁恍惚千見悲愁狂驚恍惚灸足陽明狂癲恍惚灸腦户等狂言恍惚灸天樞並見狂卒中邪魅恍惚見邪癲左手關後尺中陰實者腎實也若恍惚健忘目視䀮䀮耳聾悵悵善鳴刺足少陰治陰巨闕治恍惚不知人銅見痰百㑹療少心力忘前失後心神恍惚明下陰都療心恍惚千心驚恐曲澤治心痛善驚銅靈道治悲恐見心痛下亷治暴驚魚際治心痺悲恐少衝治悲恐善驚見傷寒上管治心風驚悸明同作心忪少府治悲恐畏人見憂疝神門見心煩蠡溝見疝巨闕治驚悸少氣見狂梁丘治大驚乳痛陰郄間使見心痛二間厲兌治多驚明下云間使療驚悸見傷寒無汗五里治驚恐見風勞京骨見瘧大鍾見淋大陵治喜驚恐百㑹見風癎神道見頭痛天井見風痺液門見狂治驚悸通谷見目眩章門治善恐見水腫天衝治癲疾風痋牙腫善驚恐支正治風虚驚恐狂惕明下云療驚恐悲愁郄門治驚恐畏人見心痛神庭治驚悸不得安寢腦空治腦風頭痛目瞑心悸三間合谷厲兌主吐舌戾頸喜驚千曲澤大陵主心下澹澹喜驚甲作内關通里主心下悸明下云療悲恐畏人然谷銅同陽陵泉明同主心下惕恐如人將捕之大鍾郄門主驚恐畏人神氣不足氣海陰交大巨主驚不得卧大巨主善驚厲兌主多卧好驚明同掖門主喜驚妄言面赤少府主數噫恐悸氣不足神門主數噫恐悸不足巨闕主驚悸少氣陰蹻主卧驚視如見鬼解谿主瘈瘲而驚少衝主太息煩滿少氣悲驚行間主心痛數驚心悲不樂手少陰陰郄主氣驚心痛少衝療悲恐畏人善驚神庭療驚不安寢明見癲癎曲澤療喜驚梁丘見足寒療大驚瘈脉療小兒驚恐見瘈瘲陰蹻療婦人驚悲不樂見月事又療大風卧驚視如見星風府療多悲恐驚悸下鳩尾療心驚悸神氣耗散兒睡中驚目不合灸屈肘横文中上三分各一壯兒睡中驚掣灸足大指次指端去爪甲如韮葉各一壯然谷主兒善驚千驚怖心忪少力灸大横五十壯上管療驚悸明見心煩天井療驚悸明下見悲厲兌療善驚見卧或中等主悸坐不安席千見上氣長强主小兒驚恐失精見驚癎心喜笑怒神門陽谷主笑若狂千勞宫大陵主喜笑不止見癲狂列缺主喜笑見四支厥勞宫治悲笑銅見中風大陵治善笑不休見傷寒無汗陽谿治狂言喜笑見鬼水溝見癲癎銅同失笑無時節明復溜見脊勞宫治善怒銅見中風魚際療心痺悲怒明見氣逆肝俞療多怒下見目翳身柱主怒欲殺人千見瘈瘲明銅同狂風罵撾斫人名熱陽風灸口兩吻邊燕口處赤白際各一壯又陰囊縫三十壯心氣健忘無心力失志心俞療心氣亂明見癎百㑹下同治無心力忘前失後見風癎百㑹治中風心煩驚悸健忘銅神道見頭痛幽門見胸痛列缺膏肓俞治健忘見勞瘵百㑹天府曲池列缺主惡風邪氣泣出喜忘千健忘刺足少陰見恍惚心忪少力灸大横五十見驚百㑹見風癎巨闕見驚癎療無心力明上管療心中悶明見心煩委陽見尸厥治失志銅秦承祖云中衝療神氣不足失志明下内關主失志千見心痛通谷主心中憒憒見癲鳩尾療心中氣悶不喜聞人語明見驚癎心俞療小兒心氣不足不語見口啞予舊患心氣凡思慮過多心下怔忪或至自悲感慨必灸百㑹則以百㑹有治無心力忘前失後證故也兼服鎮心丹心憂悲哭泣餘見癲邪漏谷主心悲千見腸鳴商丘見腸鳴治心悲銅靈道治悲恐見心痛神道治恍惚悲愁見頭痛天井心俞明下同神道主悲愁恍惚悲傷不樂天井主大風黙黙不知所痛悲傷不樂明下云療驚悸悲傷大横治大風逆氣多寒善悲銅照海見咽乾治善悲不樂日月治太息善悲小腹熱欲走多唾言語不正四支不收明下少衝治悲恐善驚見傷寒少府治煩滿少氣悲恐畏人掌熱明下同股腋攣急胸痛手拳不伸支正療驚恐悲愁明下勞宫治悲笑銅見中風心俞見癲癎神門見心煩解谿見癲大陵見傷寒無汗治喜悲泣小兒夜啼上燈啼雞鳴止者灸中指甲後一分中衝穴一壯新生兒不吮妳多啼見口噤先灸承漿七壯次灸頰車各七壯炷如雀屎間使主善悲千見癲狂通里見心痛主悸悲行間見驚主心悲勞宫等主心悲見癲狂百㑹等主泣出見健忘陰蹻療婦人驚恐明見驚憂主心灸絶骨見上氣􅀢母氏久病忽泣涕不可禁知是心病也灸百㑹而愈􅀢凡遇憂愁悽愴亦必灸此有此疾者不可不之信也歎息太息少衝主太息煩滿少氣悲驚千行間主不得太息見心痛凡好太息不嗜食多寒熱汗出病至則喜嘔嘔已乃衰即取公孫及井俞實則腸中切痛厥頭面腫起煩心狂多飲不嗜卧虚則鼓脹腹中氣滿熱痛不嗜食霍亂公孫主之商丘見腸鳴日月治太息善悲銅見悲愁行間治太息見口喎丘墟療胸脇痛善太息胸滿膨膨明下心煩悶心痺膽風熱餘見心氣神門治瘧心煩甚欲得飲冷惡寒則欲處溫中咽乾不嗜食心痛數噫恐悸少氣不足手臂寒喘逆身熱狂悲哭嘔血遺溺銅上管治心中熱煩陰都見瘧巨闕治心中煩滿玉堂治煩心見胸痛魚際少商見善噫公孫見狂言解谿見癲至陰見頭痛完骨治頭痛煩心陽谿治熱病煩心百㑹見風强閒承光治煩心見頭痛曲差治心中煩滿汗不出完骨主風頭耳後痛煩心千關衝主舌卷口乾心煩悶幽門治心煩悶見胸痛少衝療煩心上氣明紫宫療胸脇支滿痺痛骨疼食不下嘔逆上氣煩心玉堂療胸滿不得喘息膺痛骨疼嘔逆上氣煩心公孫主煩心千見歎息尺澤少澤主心煩見脇痛凡心虚則心煩内關主之見心痛通里主煩心千見心痛巨闕心俞療煩心明見心痛太一治心煩銅見癲狂上管療心風驚悸銅同不能食心中悶發噦百㑹療心熱悶心煩見風癎巨闕療心中煩悶見風癎中腕療心悶見賁豚事紫宫等主心煩見上氣曲澤療心痛出血則心下澹澹喜驚身熱煩心口乾逆氣唾血肘瘈瘲喜摇頭清汗出不過肩明曲差療心煩明見頸項心悶痛灸巨闕二七壯千見心痛百㑹治心熱悶見風癎絶骨治風心煩並見中風魚際療心痺銅見上氣臨泣月事鬲俞治心痛周痺銅見痃癖膽虚膽熱中府治膽熱嘔逆上氣銅見肺氣膽虚灸三陰交各二十壯嗜卧𩕄㑹見頭痛銅同百㑹見癎療多睡明陰蹻見小腹痛鬲俞見食不下療嗜卧腎俞療好獨卧見勞二間下同三間療多卧喜睡厲兌療多睡善驚千同脾俞療四支煩熱嗜卧怠惰四支不欲動下三陽絡療嗜卧身不欲動五里見風勞太谿見傷寒無汗大鍾照海並見淋二間治嗜卧銅鬲俞主傷寒嗜卧