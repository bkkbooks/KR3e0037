body:
  text: 鍼灸資生經卷五臍痛中極療臍下塊如覆杯明見杯銅云結如覆杯見杯闗元治臍下㽲痛小便赤澁不覺遺瀝小便處痛狀如散火溺血暴疝痛臍下結血狀如覆杯明同轉胞不得銅隂交治臍下㽲痛女子月事不絶帶下產後惡露不止繞臍冷痛中封見瘧水分見水腫神闕見瀉治繞臍痛曲泉主痛引臍中千見疝予舊苦臍中疼則欲溏㵼常以手中指按之少止或正㵼下亦按之則不疼它日灸臍中遂不疼矣後义嘗溏利不已灸之則止凡臍疼者宜灸神闕闗門治氣遊走夾臍急見積氣下腕治臍上厥氣動見腹痛氣海治臍下冷氣上衝心血結成塊狀如覆杯小便赤澁腹結治繞臍痛上搶心千同腹寒洩利欬逆天樞治夾臍切痛時上衝心煩滿嘔吐霍亂明下云冷氣臍痛見冷氣千云冬感寒臍痛見㵼外陵主心如懸下引臍腹痛千見腹痛上㢘治夾臍腹痛見脅痛四滿治歴下切痛見積聚分水療水腫繞臍痛明下小兒臍腫灸腰後對臍骨節閒三壯然谷主兒臍風口不開銅同善驚遶臍絞痛灸天樞百壯千見癥瘕臍下絞痛灸闗元百壯見腹寒熱臍中石門等主疝繞臍臍中石門天樞主臍疝遶臍蠡溝療臍中積氣千並見疝膺痛玉堂療胷滿膺痛見心煩玉堂治胷膺骨疼紫宫治胷膺骨疼大谿治乳腫賁膺並見胷脅痛胷滿胷脅滿龜胷凡胷滿短氣不得汗皆鍼補手太隂以出汗千又見霍亂神堂主胷腹滿三閒主胷滿腸鳴陽谿天容主胷滿不得息曲池人迎神道章門中府明下同臨泣天池璇璣府俞主胷中滿陽交主胷滿腫鳩尾主胷滿欬逆大泉主胷滿噭呼胷膺痛巨闕閒使主胷中淡淡梁門主胷下積氣期門缺盆主胷中熱息賁脇下氣上雲門主胷中暴逆心俞大杼主胷中鬰鬰然谷主胷中寒脉代時不至寸口小腹脹上搶心胷脅滿灸期門見心痛玉堂見心煩療胷滿膺痛明三閒療胷滿腹鳴亶中見肺癰療胷中氣滿如塞乳根療胷下滿悶陽交見療痛臨泣見腋腫治胷滿委陽治胷滿膨膨銅見尸厥璇璣治胷皮滿痛明同下云胷脅支滿俞府治胷滿見喘商陽治胷中氣滿喘欬支腫鬲闗治胷中噎悶見背痛陽谿神封治胷滿不得息欬逆肺俞治胷中氣滿背僂如龜腰强頭目眩令人失顏色輙筋治胷中暴滿不得卧喘息鬲俞治胷滿支腫見嘔吐胃俞治胷脅支滿見腹脹涌泉神堂治胷腹滿見肩痛中庭治胷脇支滿噎塞食不下嘔吐食還出雲門治喉痹胷煩滿氣上衝心欬喘不得息胷脇短氣肩痛不得舉臂天池治胷中有聲見鬲病曲池治胷中煩滿胷鄉治胷脅滿引胷背痛不得明下有卧字轉側周榮治胷脅滿不得俛仰食不下欬唾稠膿明下同彧中治胷脇支滿欬逆喘不能食明同神藏治胷脇支滿欬逆喘不得息嘔吐胷滿不嗜食明同氣户治胷脇支滿喘逆上氣胷背急不得息不知食味食竇治胷脇支滿膈閒雷鳴常有水聲靈墟治胷脇支滿痛引胷不得息欬逆嘔吐胷滿不嗜食明同步郎治胷脇支滿鼻塞不通呼吸少氣喘息不得舉臂明同章門治胷脇支滿見腸鳴庫房治胷脇支滿欬逆上氣多唾濁沫膿血期門治產後胷脇支滿見心痛外丘治胷脇脹滿俠谿治胷脇支滿寒熱汗不出雲門療胷脇徹背痛見上氣華盖療胷脇滿痛引胷明見喘紫宫見心煩中庭見反胃涌泉治胷脇支滿通谷章門曲泉鬲俞期門食竇明所陷谷石門主胷脇支滿千胃俞三里紫宫華盖中庭神藏靈墟俠谿步郎商陽上廉氣户周榮上管勞官涌泉陽陵泉主胷脇注滿膽俞明下同章門主脇痛不得卧胷滿歐無所出前谷主欬而胷滿陽氣逆上滿胷取天容見上氣肺俞巨闕主胷滿見上氣太泉治胷脇支滿銅見心痛天髎治胷中煩悶見肩背肝俞療兩脇滿明見欬浮白療胷滿庫房療胷腹兩脇滿見欬天池治寒熱胷鬲煩滿頭痛四支不舉腋下腫上氣胷中有聲喉鳴膺忩治胷滿短氣魂門療胷背痛見尸厥小兒龜胷縁肺熱脹滿攻胷鬲所生又縁乳母食熱麵五辛胷轉起髙灸兩乳前各寸半上兩行三骨罅閒六處各三壯春夏從下灸上秋冬從上灸下若不依此法灸十不愈一二胷脇痛胷痹痛餘見胷滿本神顱息主胷脇相引不得傾側千太白主胷脇脹切痛陽輔主胷脇痛環跳至隂主胷脇痛無常處腰脇相引急痛大包主胷脇中痛豐隆又見腹痛丘墟主胷痛如刺胷脇滿心痛灸期門隨年壯乳根主胷下滿痛亶中百壯天井主胷痹心痛太泉主胷膺痛肺俞雲門中府隠白期門魂門大陵主胷中痛少衝主胷痛口熱胷中痛引腰背心下嘔逆面無滋潤灸幽門隨年壯宂在俠巨闕兩邊相去各半寸一云一寸經渠丘墟主胷背急胷中彭太谿治胷滿痛乳腫賁膺欬逆上氣喉中作聲銅肝俞治欬引胷痛見欬逆少衝見傷寒中府治胷痛見肺急乳根治胷滿痛華盖治胷脇支滿痛引胷中欬逆上氣喘不能言明下同紫宫治胷脇支滿胷膺骨疼飲食不下嘔逆上氣煩心玉堂治胷滿不得喘息胷膺骨疼嘔吐寒痰上氣煩心幽門治胷中引痛心下煩悶逆氣裏急支滿不嗜食數欬健忘豐隆治厥逆胷痛如刺腹切痛明云氣刺不可忍見四支厥太淵治胷痹逆氣寒厥善噦嘔飲水欬嗽煩怒不得卧胷痹引背時寒閒使主之千閒使主胷痹背相引臨注主胷痹不得息魚際主痹走胷不得息浮白療胷滿胷痛明見欬逆俞府療胷中痛下胷痹心痛不得息痛無常處臨泣主之胷痹灸胷堂見上氣㢘泉見上氣中府見欬主胷痛膽俞治胷脇不能轉銅明云胷脇滿見乾嘔丘墟治胷脇滿痛不得息明下云胷滿見太息下㢘治胷脇小腹痛大包治胷脇痛見上氣腎俞主兩脇引痛千肝俞脾俞志室主兩脇急痛支溝主脇腋急痛中管承滿主脇下堅痛腕骨陽谷主脇痛不得息膽俞章門主脇痛不得卧竅隂主脇痛欬逆尺澤少澤主短氣脇痛心煩闗元期門少商主脇下脹極泉治脇下滿痛銅鬲俞見嘔吐中膂俞見消渴竅隂見欬逆陽谷顱􅇟治脇痛見寒熱肝俞治兩脇急痛見欬逆腕骨治脇下痛不得息腎俞治脇滿引小腹痛見勞瘵上㢘治飱泄腹脇痛滿狂走俠臍腹痛食不化喘息不能行太谿治腹脇痛連脊手足厥冷雲門療胷脇徹背痛華盖療胷脇痛見胷滿三里主脇鬲痛鬲痛五噎氣哽承滿乳根療鬲氣明見噎亶中療胷鬲悶欬𠻳氣短喉鳴下鬲俞療鬲痛見痃癖商陽療胷鬲氣滿見喘足臨泣療胷鬲滿悶下見頬痛胷中鬲氣聚痛好吐灸厥隂俞隨年壯十隱白見嘔吐巨闕主鬲中不利明下同食竇銅同主鬲中雷鳴察察隱隱常有水聲明下云療鬲間鳴滀陸常有水聲胷鬲中氣灸闕俞隨年壯天池治胷鬲煩滿銅見胷滿亶中治鬲氣嘔吐涎沫率谷見痰鬲俞治鬲胃寒痰見嘔吐扶突等主氣哽千見喉鳴天突療氣鯁鯁明下見頭項腫章門療噎見積氣中庭治胷脇支滿噎塞銅大鍾治食噎不下見淋闗衝見霍亂天突治胷中氣噎見欬逆上氣亶中治胷中如塞明下岐伯云積氣成乾噎天突見嗽闗衝見吐㵼治氣噎明乳根療鬲氣不下食噎病譩譆療乆瘧背氣滿悶胷中氣噎下神堂見脊中府見肺氣療善噎下背痛胷背背脊餘見肩背勞瘵經渠丘墟主胷背急千附分主背痛引頭明下引頷鬲闗秩邊京骨主背惡寒痛脊强難俛仰崑崙主脊强背尻骨重鬲俞治背痛惡寒脊强俛仰難食飲不下嘔噦多涎唾胷噎悶銅意舍治明下有胷脇脹漓背痛惡風寒食不下嘔吐巨骨治背髆痛胷中有瘀血肩背不得屈伸而痛魄户治背􅈩痛見上氣神堂治背脊强急見肩痛氣户治胷背急見胷脇滿大椎治氣疰背髆拘急承筋治腰背拘急不容治胷背相引痛見痃癖經渠治胷背拘急胷滿膨膨見瘧魚際治痹走胷背痛見寒熱魄戸療背胛悶明見勞下同下云療肩膊間急痛背氣不能引顧欬逆上喘胃俞療背中氣上下行脊痛腹鳴下志室療背痛俛仰不得背痛灸巨闕等或灸胷堂千並上氣肺俞治背僂如龜背生時被客風拍著脊骨達於髓所致灸肺俞心俞鬲俞各三壯譩譆療温瘧寒瘧病瘧背悶氣滿腹脹氣眩明胷中痛引腰背千見胷脇列缺主胷背寒慄見肩痹魚際治痹走胷背痛銅見寒熱雲門療胷脇徹背痛明見上氣背疼乃作勞所致技藝之人與士女刻苦者多有此患士之書學女之鍼指皆刻苦而成背疼矣色勞者亦患之晉之景公是也惟膏肓為要穴予嘗於膏肓之側去脊骨四寸半隠隠微疼按之則疼甚謾以小艾灸三壯即不疼它日復連肩上疼却灸肩疼處愈方知千金方之阿是穴猶信云千每遇熱膏肓穴所在多出冷汗數年矣因灸而愈肩背酸痛肩髆肩臂餘見胷痛浮白治肩背不舉銅神堂療肩背連胷痛不可俛仰明下商陽治肩背急引缺盆痛見頷腫譩譆治温瘧肩背痛見鼻衂中府治肩背痛見肺氣附分治肩背急見腠理神堂治肩痛胷腹滿灑淅寒熱脊背急明同三焦俞治肩背急腰脊强不得俛仰涌泉主肩背頸項痛千天牖缺盆神道大杼天突水道巨骨主肩背痛鬲俞譩譆京門尺澤主肩背寒痓肩甲内㢘痛天柱治肩背痛欲折銅肝俞見腰痛療肩疼明曲垣治肩痛周痹明同氣注肩髆拘急疼悶銅肩外俞治肩痹熱痛而寒至肘明同下云療肩痛發寒熱引項强肩井治頸項不得顧肩髆悶兩手不得向頭或因撲傷雲門見胷滿秉風治肩痛不能舉肩貞治肩中熱痛見風痹天宗治肩胛痛天忩明下同治肩痛引項不得顧前谷療􅈩胛小指痛養老療肩欲折下見臂青靈療肩不舉不能帶衣肩髎療肩重不舉見臂養老天柱主肩痛欲折天井主肩痛不可屈伸曲池天窌主肩重痛不舉巨骨主肩中痛不能動摇明下同肩外俞主肩甲痛而寒至肘後谿主肩臑痛淵腋主肩腋前痛與胷相引天髎治肩肘痛引頸項急寒熱缺盆中痛汗不出胷中煩悶銅章門治厥逆肩臂不舉青靈治肩臂不舉不能帶衣肩髎治肩重不能舉臂肘巨骨治肩臂不得屈伸見背痛居髎治肩引胷臂急見手痛臑腧治寒熱肩腫引胛中痛臂酸無力支溝療肩臂酸重見腋闗衝主肩臂酸重腕骨主肩臂疼天宗主肩重臂痛章門治厥逆肩臂不舉銅青靈治肩臂不舉不能帶衣肩髎治肩重不能舉臂肘巨骨治肩臂不得屈伸見背痛闗衝主肩臂酸痛支溝療肩臂酸重明下見腋列缺主肩背寒慄少氣不足以息寒厥交兩手而鶩凡實則肩背熱背汗出四支暴腫虛則肩寒慄氣不足以息天井療頸項及肩背痛見肘痛腰背痛灸三焦俞大椎治背􅈩急見勞下焦俞療背痛身熱肩背酸疼諸家鍼灸之詳矣當隨病證鍼灸之或背上先疼遂率引肩上疼者乃是膏肓為患千金外臺固云按之自覺牽引於肩中是也當灸膏肓俞則肩背自不疼矣予嘗肩背痛已灸膏肓肩痛猶未巳遂灸肩井三壯而愈以此知雖灸膏肓而他處亦不可不灸云肩痹痛不仁不舉天井主肩痛痿痹不仁不可屈伸肩肉麻木曲垣主肩甲周痹肩貞肩髃闗衝主肩中熱頭不可顧曲池天窌主肩重痛不舉清冷泉明同陽谷主肩不舉不得帶衣天井療肘痛引肩不屈伸見肘肩外俞治肩痹曲垣治肩痛周痹並見肩背兩肩頭冷疼尤不可忽予屢見將中風人臂骨脱臼不與肩相連接多有治不愈者要之纔覺肩上冷疼必先灸肩髃等穴毋使至於此極可也予中年每遇寒月肩上多冷常以手掌心撫摩之夜卧則多以被擁之僅能不冷後灸肩髃方免此患盖肩髃係兩手之安否環跳係兩足之安否不可不灸也臂痛臂無力曲池療肘臂偏細明下見肘肩髃療臂細無力痠疼臂冷而緩明臂臑肩髃療臂細無力手不得向頭少海見瘰癧乳根聴宫療臂疼中渚孔最支正肘髎療肘臂酸痛見肘痛閒使療臂腫痛屈伸難下肩髎療肩重不舉臂痛扁骨即肩髃療肩中熱指臂痛乳根治臂腫銅太淵治臂内㢘痛居髎治腰引小腹痛肩引胷臂攣急手臂不得舉而至肩臂臑見瘰癧肘髎治臂痛不舉